/** テストの点数と目標点の推移グラフ（教科ごと） */
function drawTestChart(testRecords) {
  if (!chartsReadyOrLoad_(() => drawTestChart(testRecords))) return;
  const el = document.getElementById('test-chart');
  const selectorArea = document.getElementById('test-chart-selector');
  if (!el || !selectorArea) return;

  const subjects = [...new Set((testRecords || []).map(r => r.subject))];
  if (subjects.length === 0) { el.innerHTML = emptyMessage('グラフにできるきろくがまだありません'); return; }

  if (!selectorArea.querySelector('select')) {
    selectorArea.innerHTML = `<select class="form-select form-select-sm" id="test-subject-select">
      ${subjects.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>`;
    document.getElementById('test-subject-select').addEventListener('change', () => drawTestChart(testRecords));
  }
  const selected = document.getElementById('test-subject-select').value || subjects[0];

  const toNum = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  // records は新しい順なので、時系列（古い順）に並べ替えてプロット
  const rows = testRecords.filter(r => r.subject === selected).slice().reverse()
    .map(r => [r.unit, toNum(r.score1), toNum(r.expected1), toNum(r.score2), toNum(r.expected2)]);
  if (rows.length === 0) { el.innerHTML = emptyMessage('グラフにできるきろくがまだありません'); return; }

  const data = google.visualization.arrayToDataTable(
    [['単元', '点数(知識)', '目標(知識)', '点数(思考)', '目標(思考)']].concat(rows));
  new google.visualization.LineChart(el).draw(data, {
    curveType: 'function', legend: { position: 'bottom' }, pointSize: 5,
    vAxis: { title: '点数', minValue: 0, maxValue: 100 },
    series: {
      0: { color: '#dc3545' }, 1: { color: '#dc3545', lineDashStyle: [4, 4] },
      2: { color: '#0d6efd' }, 3: { color: '#0d6efd', lineDashStyle: [4, 4] }
    },
    chartArea: { width: '80%', height: '60%' }
  });
}

/* ---------------- クエスト（ガチャ・アバター・アイテム） ----------------
 *
 * きせかえの「ほぞん」について
 * ---------------------------------------------------------------
 * アイテムをタップした時点では、まだ端末の中で着せかえただけです。
 * 以前はここで「ほぞんする」を押さないと消えてしまい、押しても通信が
 * 止まると「じゅんび中」のまま何も起きませんでした。
 * そこで、
 *   ・タップが落ち着いたら自動でほぞんする（押し忘れで消えない）
 *   ・いまの状態を「ほぞんしています…／ほぞんしました」と必ず文字で出す
 *   ・うまくいかなかったときは、そう言って「ほぞんする」でやり直せる
 * の3つにしました。api() 側にも時間の上限があるので、待ちっぱなしにはなりません。
 * ------------------------------------------------------------- */

/** タップが止まってから自動でほぞんするまでの時間 */
const AVATAR_AUTOSAVE_MS = 900;
/** いま選んでいるカテゴリ（きせかえるたびに「すべて」へ戻らないよう覚えます） */
let avatarFilterCategory;
/** 自動ほぞんの待ちタイマー */
let avatarSaveTimer = null;

function renderQuestView(data) {
  document.getElementById('cost-gacha-1').textContent = data.gachaCost;
  document.getElementById('cost-gacha-10').textContent = data.gacha10Cost;
  document.getElementById('quest-exchange').textContent = data.profile.exchangePoints;
  const expNote = document.getElementById('quest-exp-note');
  if (expNote) expNote.textContent = data.profile.exp;
  App.pendingAvatar = { ...data.avatar };
  if (avatarSaveTimer) { clearTimeout(avatarSaveTimer); avatarSaveTimer = null; }
  avatarFilterCategory = undefined;
  renderItemGrid(data);
  renderAvatarPreview();
  updateAvatarSaveState();
  const p = data.userProfile;
  document.getElementById('profile-motto').value = p.motto || '';
  document.getElementById('profile-favorite').value = p.favorite || '';
  document.getElementById('profile-goal').value = p.goal || '';
}

function renderItemGrid(data, filterCategory) {
  avatarFilterCategory = filterCategory;
  const grid = document.getElementById('inventory-grid');
  const filterArea = document.getElementById('item-category-filter');
  const owned = new Set(data.inventory);
  const categories = data.itemCategories || [];

  // どの部分をきせかえるか（ぼうし・ふく…）のえらび分け。1つのまとまりとして見せます
  filterArea.innerHTML = `<div class="mq-choice mb-2">
    <button type="button" class="mq-choice-item cat-btn${!filterCategory ? ' on' : ''}" style="min-height:2.6rem;padding:.4rem .9rem;" data-cat="">すべて</button>
    ${categories.map(c => `<button type="button" class="mq-choice-item cat-btn${filterCategory === c ? ' on' : ''}" style="min-height:2.6rem;padding:.4rem .9rem;" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
  </div>`;
  filterArea.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => renderItemGrid(data, btn.dataset.cat || undefined));
  });

  const items = (data.allItems || []).filter(item => !filterCategory || item['カテゴリ'] === filterCategory);
  if (items.length === 0) { grid.innerHTML = emptyMessage('アイテムがまだ登録されていません'); return; }

  grid.innerHTML = items.map(item => {
    const id = item['アイテムID'];
    const has = owned.has(id);
    const cost = Number(item['必要交換ポイント'] || 0);
    const equipped = App.pendingAvatar[item['カテゴリ']] === id;
    const rarity = item['レアリティー'];
    return `<div class="item-slot ${equipped ? 'equipped' : ''} ${has ? '' : 'locked'}"
      data-item="${esc(String(id))}" data-cat="${esc(item['カテゴリ'] || '')}" data-owned="${has}" data-cost="${cost}"
      title="${esc(item['アイテム名'])}${has ? '' : (cost > 0 ? `（${cost}Ptでこうかん）` : '（ガチャでゲット）')}">
      ${rarity ? `<span class="rarity-tag rarity-${esc(rarity)}">${esc(rarity)}</span>` : ''}
      ${item.imageUrl ? `<img src="${esc(item.imageUrl)}" width="68" height="68" alt="${esc(item['アイテム名'])}" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : icon('box')}
      ${!has && cost > 0 ? `<span class="cost-tag">${cost}Pt</span>` : ''}
    </div>`;
  }).join('');

  grid.querySelectorAll('.item-slot').forEach(slot => {
    slot.addEventListener('click', () => onItemClick(slot, data));
  });
}

function onItemClick(slot, data) {
  const itemId = slot.dataset.item;
  const category = slot.dataset.cat;
  const owned = slot.dataset.owned === 'true';
  const cost = Number(slot.dataset.cost);
  const item = data.allItems.find(i => String(i['アイテムID']) === itemId);

  if (owned) {
    // 装備の切り替え。えらんでいたカテゴリはそのまま残します
    // （タップのたびに「すべて」へ戻ると、着せかえが続けられません）
    if (App.pendingAvatar[category] === item['アイテムID']) {
      delete App.pendingAvatar[category];
    } else {
      App.pendingAvatar[category] = item['アイテムID'];
    }
    renderAvatarPreview();
    renderItemGrid(data, avatarFilterCategory);
    scheduleAvatarSave();
    return;
  }
  if (cost > 0) {
    Swal.fire({
      title: 'アイテムこうかん',
      html: `「<b>${esc(item['アイテム名'])}</b>」を <b>${cost} 交換Pt</b> でこうかんしますか？<br><span class="small text-muted">いまの交換Pt: ${App.data.profile.exchangePoints}</span>`,
      icon: 'question', showCancelButton: true, confirmButtonText: 'こうかんする', cancelButtonText: 'やめる'
    }).then(async result => {
      if (!result.isConfirmed) return;
      const res = await apiWithLoading('こうかん中...', 'exchangeItem', item['アイテムID']);
      if (res.success) {
        App.data.inventory.push(item['アイテムID']);
        applyProfileGains_(res);
        starBurst(slot, 10);   // 作り直す前の、いまの位置から星がとびます
        toast(res.message);
        renderItemGrid(App.data, avatarFilterCategory);
      } else {
        Swal.fire('こうかんできません', esc(res.message), 'warning');
      }
    });
  } else {
    toast('このアイテムはガチャでゲットできるよ！', 'info');
  }
}

function renderAvatarPreview() {
  renderAvatar(document.getElementById('avatar-layers'), App.pendingAvatar, App.data.allItems);
  renderAvatar(document.getElementById('home-avatar'), App.pendingAvatar, App.data.allItems);
}

/** 空っぽ（はずしている）を表す値をそろえます。'' と null と 未設定 は同じあつかいです */
function avatarSlotValue_(composition, key) {
  const value = composition ? composition[key] : undefined;
  return (value === undefined || value === null) ? '' : String(value);
}

/** 画面のすがたが、サーバーにほぞんしてあるすがたと ちがうか */
function avatarHasUnsavedChanges_() {
  const saved = (App.data && App.data.avatar) || {};
  const pending = App.pendingAvatar || {};
  const keys = new Set(Object.keys(saved).concat(Object.keys(pending)));
  for (const key of keys) {
    if (avatarSlotValue_(saved, key) !== avatarSlotValue_(pending, key)) return true;
  }
  return false;
}

/**
 * きせかえの「いまどうなっているか」を文字で出します。
 * 児童が画面を閉じてよいかどうかを、迷わず判断できるようにするためです。
 * @param {string} [state] - 'saving' | 'saved' | 'failed'（省略すると今の状態から決めます）
 */
function updateAvatarSaveState(state) {
  const note = document.getElementById('avatar-save-note');
  if (!note) return;
  const mode = state || (avatarHasUnsavedChanges_() ? 'saving' : 'saved');
  const text = {
    saving: 'きせかえを ほぞんしています…',
    saved: 'いまの すがたは ほぞんずみです',
    failed: 'ほぞんできませんでした。「ほぞんする」を おしてね'
  }[mode];
  note.textContent = text;
  note.classList.toggle('is-waiting', mode === 'saving');
  note.classList.toggle('is-failed', mode === 'failed');
}

/**
 * きせかえたあと、タップが落ち着いてから自動でほぞんします。
 * 続けてタップされているあいだは待ち直すので、通信は最後の1回だけです。
 */
function scheduleAvatarSave() {
  updateAvatarSaveState('saving');
  if (avatarSaveTimer) clearTimeout(avatarSaveTimer);
  avatarSaveTimer = setTimeout(() => {
    avatarSaveTimer = null;
    const btn = document.getElementById('btn-save-avatar');
    // 前のほぞんがまだ動いているときは、終わるのを待ってからにします
    if (btn && btn.dataset.mqBusy === '1') { scheduleAvatarSave(); return; }
    saveAvatarNow(btn, { quiet: true });
  }, AVATAR_AUTOSAVE_MS);
}

/**
 * いまのすがたをサーバーへほぞんします。
 * @param {HTMLElement} btn - 「ほぞんする」ボタン（中でくるくる待ちます）
 * @param {Object} [options] - { quiet: true } 自動ほぞん（成功しても通知を出しません）
 * @returns {Promise<boolean>} ほぞんできたか
 */
async function saveAvatarNow(btn, options) {
  const quiet = !!(options && options.quiet);
  if (avatarSaveTimer) { clearTimeout(avatarSaveTimer); avatarSaveTimer = null; }
  if (!avatarHasUnsavedChanges_()) { updateAvatarSaveState('saved'); return true; }

  // 送ったときの内容を控えておきます。待っているあいだに児童が
  // さらに着せかえても、「送った内容」だけをほぞんずみにするためです。
  const composition = { ...App.pendingAvatar };
  const result = await busyApi(btn, 'ほぞん中', 'saveAvatar', composition);
  if (!result) return false;   // ほぞん中にもう一度押されたとき

  if (result.success) {
    App.data.avatar = composition;
    updateAvatarSaveState();
    if (!quiet) toast(result.message);
    return true;
  }
  updateAvatarSaveState('failed');
  if (quiet) toast(result.message, 'warning');
  else Swal.fire('ほぞんできません', esc(result.message), 'warning');
  return false;
}

async function runGacha(count, btn) {
  const cost = count === 10 ? App.data.gacha10Cost : App.data.gachaCost;
  if (App.data.profile.exp < cost) {
    Swal.fire('けいけんちがたりない！', `ガチャには ${cost} EXP ひつようです。<br>いまのけいけんち: ${App.data.profile.exp}`, 'warning');
    return;
  }
  const confirm = await Swal.fire({
    title: count === 10 ? '10連ガチャ' : 'ガチャをひく',
    html: `<b>${cost} EXP</b> をつかってガチャをひきますか？`,
    icon: 'question', showCancelButton: true, confirmButtonText: 'ひく！', cancelButtonText: 'やめる'
  });
  if (!confirm.isConfirmed) return;

  const machine = document.getElementById('gacha-machine');
  if (machine) {
    machine.classList.remove('opening');
    void machine.offsetWidth;
    machine.classList.add('opening');
  }
  // 待つのはボタンの中だけにします。画面をふさぐと、
  // せっかく回っているガチャの絵が見えなくなってしまいます。
  const result = await busyApi(btn, 'まわしています', 'playGacha', count);
  if (!result) return;
  if (!result.success) {
    Swal.fire('ガチャエラー', esc(result.message), 'warning');
    return;
  }
  applyProfileGains_(result);
  // レアなアイテムが出たときは、はでにおいわいします
  const bestRarity = result.results.some(i => i['レアリティー'] === 'SR') ? 'SR'
    : result.results.some(i => i['レアリティー'] === 'R') ? 'R' : 'N';
  if (machine) starBurst(machine, bestRarity === 'SR' ? 20 : 12);   // ガチャの絵から星がとび出します
  celebrate(bestRarity === 'SR' ? 150 : bestRarity === 'R' ? 70 : 35);
  result.results.forEach(item => {
    if (!item.isDuplicate) App.data.inventory.push(item['アイテムID']);
  });

  const itemsHtml = result.results.map(item => `
    <div class="d-inline-block text-center m-1" style="width:80px;">
      <div class="item-slot mx-auto ${item.isDuplicate ? 'locked' : ''}" style="cursor:default;">
        ${item['レアリティー'] ? `<span class="rarity-tag rarity-${esc(item['レアリティー'])}">${esc(item['レアリティー'])}</span>` : ''}
        ${item.imageUrl ? `<img src="${esc(item.imageUrl)}" width="68" height="68" alt="" decoding="async" referrerpolicy="no-referrer">` : '<i class="bi bi-box"></i>'}
      </div>
      <div class="small text-truncate">${esc(item['アイテム名'])}</div>
      ${item.isDuplicate ? `<div class="small text-warning-emphasis">+${item.awardedPoints}Pt</div>` : '<div class="small text-success fw-bold">NEW!</div>'}
    </div>`).join('');
  Swal.fire({
    title: count === 10 ? '10連ガチャのけっか！' : 'ガチャのけっか！',
    html: `<div>${itemsHtml}</div>${result.summary && result.summary.awardedExchangePoints > 0 ? `<div class="mt-2 small">かさなったぶんは <b>+${result.summary.awardedExchangePoints} 交換Pt</b> になりました</div>` : ''}`,
    confirmButtonText: 'とじる', width: count === 10 ? 640 : undefined
  });
  renderItemGrid(App.data, avatarFilterCategory);
}

          <div class="mb-3">
            <div class="d-flex align-items-center small mb-1">
              <span class="fw-bold">${esc(goal.content)}</span>
              <span class="ms-auto fw-bold ${goal.isComplete ? 'text-success' : 'text-secondary'}">
                ${goal.rawProgress} / ${goal.target}
              </span>
            </div>
            <div class="progress class-gauge">
              <div class="progress-bar ${goal.isComplete ? 'bg-success' : 'bg-info'} progress-bar-striped ${goal.isComplete ? '' : 'progress-bar-animated'}"
                   style="width:${goal.percent}%">${goal.percent}%</div>
            </div>
            ${goal.isComplete
              ? `<div class="small text-success mt-1">たっせい！ホームのミッションからほうしゅうを受け取ろう</div>`
              : `<div class="small text-muted mt-1">あなたの1件が、クラスのゲージを動かします</div>`}
          </div>`).join('')}
      </div>
    </div>`;
}

/** 今週がんばっている友だちに応援スタンプを送るボード */
function renderCheerBoard() {
  const el = document.getElementById('cheer-board-container');
  if (!el) return;
  const board = social().cheerBoard;
  const stamps = social().cheerStamps || [];
  const mine = social().myCheers || {};
  if (!board) { el.innerHTML = ''; return; }

  const received = mine.received > 0
    ? `<div class="small mb-2">もらった応援 <b class="text-danger">${mine.received}</b>（今週 ${mine.receivedThisWeek}）
         ${(mine.byStamp || []).map(s => `<span class="badge bg-light text-dark border ms-1">${stampIcon(s.emoji)} ${s.count}</span>`).join('')}</div>`
    : '';

  el.innerHTML = `
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-header bg-transparent border-0 pt-3 pb-0">
        <h5 class="fw-bold text-danger mb-0"><i class="bi bi-hand-thumbs-up-fill"></i> 今週がんばっている友だち</h5>
      </div>
      <div class="card-body">
        ${received}
        <div class="small text-muted mb-2">今日あと <b>${board.remainingToday}</b> 回おくれます（1日${board.dailyLimit}回まで）</div>
        ${board.highlights.length === 0
          ? emptyMessage('今週はまだだれもきろくしていません')
          : board.highlights.slice(0, 12).map(item => `
            <div class="cheer-target d-flex align-items-center gap-2 mb-2">
              <div class="flex-grow-1">
                <div class="fw-bold">${esc(item.nickname)}</div>
                <div class="small text-muted">今週 ${item.weekRecords}件のきろく ・ 応援 ${item.cheersReceived}</div>
              </div>
              ${item.alreadyCheered
                ? `<span class="badge bg-light text-secondary border">今日おくりました</span>`
                : `<button class="btn btn-sm btn-outline-danger" data-cheer-to="${esc(item.email)}" data-cheer-name="${esc(item.nickname)}">
                     おうえんする
                   </button>`}
            </div>`).join('')}
      </div>
    </div>`;

  el.querySelectorAll('[data-cheer-to]').forEach(btn => {
    btn.addEventListener('click', () => openCheerDialog(btn.dataset.cheerTo, btn.dataset.cheerName, stamps));
  });
}

/**
 * 応援スタンプの絵文字を、自前のアイコンに置きかえます。
 * スタンプは「初期設定」シートで先生が変えられるため、
 * 知らない絵文字が来たときは、そのまま絵文字を出します。
 */
const CHEER_ICONS = { '👏': 'clap', '🔥': 'fire', '💖': 'heart', '💪': 'thumb', '👍': 'thumb', '⭐': 'star', '🌟': 'star', '🏆': 'trophy' };
function stampIcon(emoji) {
  const name = CHEER_ICONS[emoji];
  return name ? icon(name) : `<span class="no-furigana">${esc(emoji)}</span>`;
}

/** スタンプをえらんで送ります（自由記述はありません） */
function openCheerDialog(toEmail, nickname, stamps) {
  Swal.fire({
    title: `${nickname}さんをおうえん`,
    html: `<div class="d-flex flex-wrap justify-content-center gap-2">
      ${stamps.map(s => `
        <button type="button" class="mq-choice-item cheer-stamp" data-stamp="${esc(s.key)}" title="${esc(s.label)}">
          ${stampIcon(s.emoji)}<span>${esc(s.label)}</span>
        </button>`).join('')}
    </div>
    <div class="small text-muted mt-2">スタンプをえらぶと、そのままおくられます</div>`,
    showConfirmButton: false, showCancelButton: true, cancelButtonText: 'やめる',
    didOpen: () => {
      document.querySelectorAll('[data-stamp]').forEach(btn => {
        btn.addEventListener('click', async () => {
          // ダイアログは開いたまま、えらんだスタンプの中で待ちます。
          // 「消えた画面のうしろで、なにかが起きている」を作らないためです。
          const res = await busyApi(btn, '', 'sendCheer', { to: toEmail, stamp: btn.dataset.stamp });
          if (!res) return;
          if (!res.success) { Swal.fire('おくれません', esc(res.message), 'warning'); return; }
          Swal.close();
          App.data.social = res.social;
          App.data.missions = res.missions;
          renderCheerBoard();
          renderMissions(res.missions);
          renderMoreCounts();
          toast(res.message);
        });
      });
    }
  });
}

      </div>

function renderRankings(containerId, rankings) {
  const container = document.getElementById(containerId);
  const medal = rank => rank <= 3
    ? `<span class="rank-badge rank-${rank}">${rank}</span>`
    : `<span class="rank-plain">${rank}</span>`;
  // 1位から順にすべりこんでくるので、発表を見ているような楽しさになります
  const list = (items, valueFormatter) => items.length === 0 ? emptyMessage('まだきろくがありません') :
    `<div class="mq-stagger">` + items.map(item => `<div class="ranking-item">
      <span class="rank-medal">${medal(item.rank || items.indexOf(item) + 1)}</span>
      <span class="flex-grow-1 fw-bold">${esc(item.nickname || item.name)}</span>
      <span class="text-primary fw-bold small">${valueFormatter(item)}</span>
    </div>`).join('') + `</div>`;

  let calcHtml = '';
  Object.keys(rankings.calc || {}).forEach(mode => {
    calcHtml += `<div class="small fw-bold mt-2">${esc(mode)}</div>` +
      list(rankings.calc[mode], i => `${i.value}秒`);
  });

  const card = (title, icon, cls, body, note) => `
    <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
      <h6 class="fw-bold ${cls}"><i class="bi ${icon}"></i> ${title}</h6>
      ${note ? `<div class="small text-muted mb-1">${note}</div>` : ''}
      ${body}
    </div></div>`;

  // 「今週の伸び」「けいぞく」「今週のがんばり」は、上位が固定されがちな絶対値の
  // ランキングとちがって、誰でも1位になれる軸です。上のほうに置いています。
  container.innerHTML =
    card('今週ののび', 'bi-graph-up-arrow', 'text-danger',
      list(rankings.growth || [], i => `+${i.value}件`), '先週よりふえたきろくの数') +
    card('けいぞくチャンピオン', 'bi-fire', 'text-warning-emphasis',
      list(rankings.streak || [], i => `${i.value}日`), '何日れんぞくできろくしたか') +
    card('今週のがんばり', 'bi-lightning-charge-fill', 'text-primary',
      list(rankings.effort || [], i => `${i.value}件`), '今週きろくした数') +
    card('どくしょ王', 'bi-book', 'text-success',
      list(rankings.reading || [], i => `${i.value}ページ`)) +
    card('今日のMVP', 'bi-star-fill', 'text-danger',
      list((rankings.mvp || []).map((r, i) => ({ ...r, rank: i + 1 })), i => `+${i.gainedExp}EXP`)) +
    card('けいけんちトップ5', 'bi-trophy-fill', 'text-warning-emphasis',
      list((rankings.top5 || []).map((r, i) => ({ ...r, rank: i + 1 })), i => `Lv.${i.level} (${i.totalExp}EXP)`)) +
    card('タイピングはやさ', 'bi-keyboard', 'text-primary',
      list(rankings.typing || [], i => `${i.value}打/秒`)) +
    card('今週の学習アプリ時間', 'bi-joystick', 'text-info',
      list(rankings.studyApp || [], i => `${i.value}分`)) +
    (calcHtml ? card('100マスタイム', 'bi-calculator', 'text-success', calcHtml) : '');
}

/* ---------------- イベント ---------------- */

function bindStudentEvents() {
  const gacha1 = document.getElementById('btn-gacha-1');
  const gacha10 = document.getElementById('btn-gacha-10');
  gacha1.addEventListener('click', () => runGacha(1, gacha1));
  gacha10.addEventListener('click', () => runGacha(10, gacha10));

  const addGoalBtn = document.getElementById('home-add-goal-btn');
  if (addGoalBtn) addGoalBtn.addEventListener('click', () => openGoalDialog());

  // ホームからいちばん押されるボタン。「きろく」タブへ連れていきます
  const cta = document.getElementById('home-record-cta');
  if (cta) cta.addEventListener('click', () => tapDoorThen(cta, () => showView('view-records', { push: true })));

  // ふだんは着せかえたあと自動でほぞんされます。このボタンは
  // 「いますぐほぞんしたい」ときと、うまくいかなかったときのやり直し用です。
  const saveAvatarBtn = document.getElementById('btn-save-avatar');
  saveAvatarBtn.addEventListener('click', () => saveAvatarNow(saveAvatarBtn));

  const saveProfileBtn = document.getElementById('btn-save-profile');
  saveProfileBtn.addEventListener('click', async () => {
    const profileData = {
      motto: document.getElementById('profile-motto').value,
      favorite: document.getElementById('profile-favorite').value,
      goal: document.getElementById('profile-goal').value
    };
    const result = await busyApi(saveProfileBtn, 'ほぞん中', 'saveProfile', profileData);
    if (!result) return;
    if (result.success) {
      App.data.userProfile = profileData;
      document.getElementById('home-motto').textContent = profileData.motto ? `「${profileData.motto}」` : '';
      toast(result.message);
    } else {
      Swal.fire('ほぞんできません', esc(result.message), 'warning');
    }
  });
}
