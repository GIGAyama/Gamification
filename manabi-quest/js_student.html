<script>
/* =====================================================================
 * js_student.html — 児童用ビュー
 * ===================================================================== */

/* ---- グラフのライブラリ（必要になってから読み込む） ----------------------
 * 以前は <head> で Google Charts のローダーを読み、ここですぐ
 * google.charts.load() を呼んでいました。そのため、記録タブを一度も開かない
 * 児童の端末でもグラフ用のコードを丸ごとダウンロードしていました。
 *
 * いまは drawTypingChart / drawCalcChart / drawTestChart が呼ばれた時点で
 * はじめて取りにいきます。取りに行けなかったときはグラフの場所が空になるだけで、
 * ほかの記録は今までどおり表で読めます。
 * ---------------------------------------------------------------------- */
let chartsReady = false;
let chartsLoading = null;

/** グラフのライブラリを用意します。使えるようになったら true */
function ensureCharts() {
  if (chartsReady) return Promise.resolve(true);
  if (chartsLoading) return chartsLoading;
  chartsLoading = loadScriptOnce_('https://www.gstatic.com/charts/loader.js')
    .then(() => new Promise(resolve => {
      google.charts.load('current', { packages: ['corechart'], language: 'ja' });
      google.charts.setOnLoadCallback(() => { chartsReady = true; resolve(true); });
    }))
    .catch(e => {
      console.warn('グラフのライブラリを読み込めませんでした（表だけで表示します）:', e && e.message);
      chartsLoading = null;   // つながったときに、もう一度ためせるようにする
      return false;
    });
  return chartsLoading;
}

/**
 * グラフを描く関数の先頭で使います。
 * まだ用意できていなければ読み込みを始め、そろってから同じ関数をもう一度呼びます。
 * @returns {boolean} いま描いてよければ true
 */
function chartsReadyOrLoad_(retry) {
  if (chartsReady) return true;
  ensureCharts().then(ok => { if (ok) retry(); });
  return false;
}

/**
 * 奥の画面につける「もどる」つき見出しの一覧。
 * [ 見出しを入れる場所のID, アイコン名, タイトル, 戻り先のパネルID ]
 * どの画面からでも1タップで1つ上の階層に帰れるようにするためのものです。
 */
const PANEL_HEADS = [
  ['p-more-head', 'clipboard', 'ミッション・めあて', 'p-home'],
  ['p-news-head', 'megaphone', 'おしらせ', 'p-more'],
  ['p-assignments-head', 'clipboard', '先生からの かだい', 'p-more'],
  ['p-missions-head', 'target', 'ミッション', 'p-more'],
  ['p-goals-head', 'flag', 'わたしのめあて', 'p-more'],
  ['p-apps-head', 'gamepad', 'がくしゅうアプリ', 'p-home'],
  ['p-send-head', 'send', 'きろくを おくる', 'p-home'],
  ['p-weekly-head', 'journal', '今週のふり返り', 'p-home'],
  ['p-my-effort-head', 'fire', 'がんばり', 'p-my'],
  ['p-my-records-head', 'books', 'きろくを見かえす', 'p-my'],
  ['p-rec-speed-head', 'keyboard', 'スピード', 'p-my-records'],
  ['p-rec-words-head', 'book', 'ことば', 'p-my-records'],
  ['p-rec-lessons-head', 'note', 'じゅぎょう', 'p-my-records'],
  ['p-my-quest-head', 'gift', 'ガチャ・きせかえ', 'p-my'],
  ['p-gacha-head', 'sparkles', 'ガチャをひく', 'p-my-quest'],
  ['p-avatar-head', 'avatar', 'きせかえ', 'p-my-quest'],
  ['p-profile-head', 'idcard', 'プロフィール', 'p-my-quest'],
  ['p-class-goal-head', 'target', 'クラスの目標', 'p-all'],
  ['p-cheer-head', 'clap', 'おうえんする', 'p-all'],
  ['p-ranking-head', 'trophy', 'ランキング・本だな', 'p-all']
];

function setupPanels() {
  PANEL_HEADS.forEach(([id, iconName, title, back]) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = panelHeader(iconName, title, back);
  });
  bindPanelLinks(document);
  // パネルが開かれたときに、重い読み込みやグラフの描画を行います
  onPanelShown = handlePanelShown;
}

/**
 * パネルを開いたときの処理。
 * グラフは表示されている状態でないと大きさが決まらないので、開いた瞬間に描きます。
 * 重いデータはこのタイミングで初めて取りにいきます。
 */
function handlePanelShown(panelId) {
  if (panelId === 'p-rec-speed') {
    drawTypingChart(App.data.records.typingChart);
    drawCalcChart(App.data.records.calcChart);
    loadStudyAppTab();
  }
  if (panelId === 'p-rec-words') loadAlbumTab();
  if (panelId === 'p-rec-lessons') drawTestChart(App.data.records.test);
  if (panelId === 'p-send') renderStudySendPanels();
  if (panelId === 'p-apps') { renderAppLauncher('apps-launcher'); renderStudySendPanels(); }
}

function initStudentApp(data) {
  setupPanels();
  renderStudentHeader(data.profile);
  renderHome(data);
  renderRecordsView(data);
  renderQuestView(data);
  renderPlazaView(data);
  bindStudentEvents();

  // 学習ポータル（iframe の親ページ）からの通知でパネルを更新する
  Portal.onUpdate = () => { renderStudySendPanels(); renderTodayCard(); };
  Portal.onResult = handlePortalSendResult;

  if (data.bonusApplied) {
    Swal.fire({
      icon: 'success', title: 'ログインボーナス！',
      html: `今日もよく来たね！<br><b>+${data.bonusPoints} EXP</b> ゲット！`,
      confirmButtonText: 'やったー！'
    }).then(() => showNewBadges(data.newlyAwardedBadges));
  } else {
    showNewBadges(data.newlyAwardedBadges);
  }
}

/**
 * レベルアップのお祝い。
 * まず画面いっぱいの演出を見せ、それが終わってからダイアログを出します。
 * （同時に出すと、せっかくの演出がダイアログにかくれてしまいます）
 * @param {number|string} level - あたらしいレベル
 * @returns {Promise} ダイアログを閉じたら解決します
 */
function showLevelUp(level) {
  return levelUpBurst(level).then(() => Swal.fire({
    icon: 'success', title: 'レベルアップ！',
    html: `<b>レベル ${esc(String(level))}</b> になりました！`,
    confirmButtonText: 'やったー！'
  }));
}

function showNewBadges(badges) {
  if (!badges || badges.length === 0) return;
  const names = badges.map(b => `「${esc(b.name)}」`).join('・');
  Swal.fire({
    icon: 'success', title: 'あたらしいバッジ！',
    html: `${names} を手に入れました！<br><span class="text-muted small">ホームのバッジらんを見てみよう</span>`
  });
}

/* ---------------- ヘッダー・ホーム ---------------- */

function renderStudentHeader(profile) {
  document.getElementById('nav-nickname').textContent = profile.nickname;
  document.getElementById('nav-level').textContent = profile.level;
}

/**
 * つぎのレベルまでのバーをのばします。
 * ふえたときだけ、バーの上を光がすべって「のびた！」ことを伝えます。
 * @param {number} progress - 0〜100 のパーセント
 */
function setXpBar_(progress) {
  const bar = document.getElementById('home-progress-bar');
  if (!bar) return;
  const before = parseFloat(bar.style.width) || 0;
  const after = Number(progress) || 0;
  bar.style.width = `${after}%`;
  const wrap = bar.parentElement;
  if (!wrap || after <= before) return;
  wrap.classList.remove('grew');
  void wrap.offsetWidth;   // アニメーションをやり直すためのリセット
  wrap.classList.add('grew');
}

/**
 * 要素がいま画面に出ているか（親が d-none でも false になります）。
 * 「開いているときだけグラフを描く」判定に使います。
 */
function isShown_(id) {
  const el = document.getElementById(id);
  return !!(el && el.offsetParent !== null);
}

function renderHome(data) {
  const p = data.profile;
  if (App.data) App.data.profile = p;
  document.getElementById('home-nickname').textContent = p.nickname;
  // けいけんち・交換Pt・レベルまわりは、操作のあとの部分更新と同じ道を通します
  syncProfileDisplay_();
  const motto = data.userProfile && data.userProfile.motto;
  document.getElementById('home-motto').textContent = motto ? `「${motto}」` : '';

  // ヒーローカードの「れんぞくきろく」。くわしいカレンダーは じぶんのきろく にあります
  const heroStreak = document.getElementById('hero-streak-days');
  if (heroStreak) countUp(heroStreak, ((insights().calendar || {}).streak) || 0);

  renderAvatar(document.getElementById('home-avatar'), data.avatar, data.allItems);
  renderStudySendPanels();
  renderAssignments(data.assignments);
  renderMissions(data.missions);
  renderAnnouncements('home-announcements', data.announcements, false);
  renderActivity(data.recentActivity);
  renderBadges(data.badges, data.allBadges);

  // 成長の可視化・めあて・ふり返りの循環
  renderStreak();
  renderCalendar();
  renderGoals();
  renderWeeklyCard();
  renderGrowthCard();
  renderTotals();
  renderFlashback();

  // 学習アプリへの入口（ひらくのは新しいタブ）
  renderAppsDoor();
  renderAppLauncher('apps-launcher');

  // ホームは「いま一番やってほしいこと」1つだけを大きく出します
  renderTodayCard();
  renderMoreCounts();
}

/* ---------------- ホーム: きょうのやること ---------------- */

/**
 * いま一番やってほしいことを1つだけえらびます。
 *
 * 児童が画面を開いたときに迷わないよう、選択肢をならべるのではなく
 * 「つぎにやること」をアプリ側が1つに決めて大きく出す、という考え方です。
 * 上から順に見て、最初に当てはまったものを返します。
 */
function pickTodayTask() {
  // ① 端末にたまっている学習アプリのきろく（おくるとすぐ けいけんち になる）
  if (Portal.embedded && Portal.connected && Portal.pending > 0) {
    return {
      icon: 'send', label: 'まず これ！',
      title: `きろくを ${Portal.pending}こ おくろう`,
      note: 'おくると けいけんちが もらえるよ',
      go: () => goPanel('p-send')
    };
  }
  // ② 先生からの課題。アプリが用意したミッションより先に出します
  //    （先生が「これをやってね」と出したものが、いちばん優先だからです）
  const assignClaimable = claimableAssignments_().length;
  if (assignClaimable > 0) {
    return {
      icon: 'gift', label: 'ごほうびが あるよ',
      title: `かだいの ごほうびを ${assignClaimable}こ うけとろう`,
      note: 'タップして うけとる',
      go: () => goPanel('p-assignments')
    };
  }
  const pendingAssigns = pendingAssignments_();
  if (pendingAssigns.length > 0) {
    // 期限が近いものから出します（期限なしの課題はいちばん後ろ）。
    // 並べかえには dueSort（yyyy-MM-dd）を使います。画面に出す due は「8/5」の形なので、
    // そのまま文字で比べると 12/1 が 8/5 より前になってしまいます
    const next = pendingAssigns.slice().sort((x, y) => {
      if (!x.dueSort) return 1;
      if (!y.dueSort) return -1;
      return x.dueSort.localeCompare(y.dueSort);
    })[0];
    return {
      icon: 'clipboard', label: '先生から',
      title: next.title,
      note: next.due ? `${next.due}まで・${next.progress}/${next.target}${next.unit}` : `${next.progress}/${next.target}${next.unit}`,
      go: () => goPanel('p-assignments')
    };
  }
  // ③ 受けとっていないミッションのごほうび
  const claimable = (App.data.missions || []).filter(m => m.isComplete && !m.isClaimed).length;
  if (claimable > 0) {
    return {
      icon: 'gift', label: 'ごほうびが あるよ',
      title: `ミッションのごほうびを ${claimable}こ うけとろう`,
      note: 'タップして うけとる',
      go: () => goPanel('p-missions')
    };
  }
  // ④ 今週のふり返り（週の後半で、まだ書いていないとき）
  const weekly = insights().weekly;
  if (weekly && !weekly.done && weekly.due) {
    return {
      icon: 'journal', label: 'そろそろ',
      title: '今週を ふり返ろう',
      note: '3つの しつもんに 答えるだけ',
      go: () => goPanel('p-weekly')
    };
  }
  // ⑤ 今日まだきろくを書いていないとき
  if (!recordedToday_()) {
    return {
      icon: 'pencil', label: 'きょうの やること',
      title: 'きょうのきろくを つけよう',
      note: 'ひとつ書くと けいけんちが もらえるよ',
      go: () => showView('view-records', { push: true })
    };
  }
  // ⑥ めあてがないとき
  if ((goalData().activeGoals || []).length === 0) {
    return {
      icon: 'flag', label: 'つぎは これ',
      title: 'じぶんの めあてを 立てよう',
      note: 'できるようになりたいことを 決めよう',
      go: () => goPanel('p-goals')
    };
  }
  // ⑦ ぜんぶ できている
  const streak = (insights().calendar || {}).streak || 0;
  return {
    done: true, icon: 'party', label: 'きょうは かんぺき！',
    title: 'やることは ぜんぶ おわったよ',
    note: streak > 0 ? `${streak}日れんぞく きろく中！ この調子！` : 'また あした がんばろう'
  };
}

/** 今日すでにきろくを書いたか（がんばりカレンダーの最後の日で判定します） */
function recordedToday_() {
  const weeks = (insights().calendar || {}).weeks || [];
  for (let w = weeks.length - 1; w >= 0; w--) {
    for (let d = weeks[w].length - 1; d >= 0; d--) {
      const day = weeks[w][d];
      if (day.count >= 0) return day.count > 0;   // count < 0 は「未来の日」
    }
  }
  return false;
}

/** 「きょう やること」が、さっきまで やることだったか（演出を出す判定に使います） */
let todayWasPending = false;

function renderTodayCard() {
  const el = document.getElementById('home-today');
  if (!el) return;
  const task = pickTodayTask();
  // やることが「できた」に変わったしゅんかんだけ、カードがうなずいてお祝いします
  const justDone = task.done && todayWasPending;
  todayWasPending = !task.done;
  el.innerHTML = `
    <button type="button" class="mq-today${task.done ? ' done' : ''}"${task.done ? ' disabled' : ''}>
      <span class="today-label">${esc(task.label)}</span>
      <span class="today-title">
        <span class="today-emoji">${icon(task.icon)}</span>
        <span>${esc(task.title)}</span>
      </span>
      <span class="today-note">${esc(task.note)}</span>
    </button>`;
  const card = el.querySelector('.mq-today');
  if (justDone) card.classList.add('just-done');
  if (task.go) card.addEventListener('click', () => { popElement(card); setTimeout(task.go, 90); });
}

/** 「ミッション・めあて」のとびらに出す、気づいてほしい件数のバッジ */
function renderMoreCounts() {
  const claimable = (App.data.missions || []).filter(m => m.isComplete && !m.isClaimed).length;
  const news = (App.data.announcements || []).filter(a => a.personal).length;
  const setCount = (id, n) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = n;
    el.classList.toggle('d-none', n <= 0);
  };
  // 先生からの課題は「まだ出していない」も「ごほうびが待っている」も気づいてほしい件数です
  const assignPending = pendingAssignments_().length;
  const assignClaimable = claimableAssignments_().length;
  setCount('home-more-count', claimable + news + assignPending + assignClaimable);
  setCount('home-assign-count', assignPending + assignClaimable);
  setCount('more-assign-count', assignPending + assignClaimable);
  setCount('more-missions-count', claimable);
  setCount('more-news-count', news);

  const assignNote = document.getElementById('more-assign-note');
  if (assignNote) {
    const total = assignmentList_().length;
    assignNote.textContent = total === 0
      ? 'いまは かだいが ありません'
      : (assignPending > 0 ? `やることが ${assignPending}こ あるよ` : 'ぜんぶ 出したよ！');
  }

  const missionsNote = document.getElementById('more-missions-note');
  if (missionsNote) {
    const done = (App.data.missions || []).filter(m => m.isComplete).length;
    const total = (App.data.missions || []).length;
    missionsNote.textContent = total ? `${done} / ${total} クリア` : 'クリアするとごほうびがもらえる';
  }
  const goalsNote = document.getElementById('more-goals-note');
  if (goalsNote) {
    const active = (goalData().activeGoals || []).length;
    goalsNote.textContent = active ? `いま ${active}こ ちょうせん中` : 'まだ めあてが ありません';
  }
}

/* ---------------- 成長の可視化 ---------------- */

/** ホームのデータのうち、集計まわりをまとめて取り出します */
function insights() {
  return (App.data && App.data.insights) || {};
}

/**
 * 連続きろく日数。毎日の積み重ねが一番見えるところなので、ホームの上のほうに出します。
 */
function renderStreak() {
  const el = document.getElementById('home-streak');
  if (!el) return;
  const cal = insights().calendar || {};
  const streak = cal.streak || 0;
  if (streak <= 0) {
    el.innerHTML = `<div class="streak-badge cold"><span>今日、何か1つきろくしてみよう！</span></div>`;
    return;
  }
  const best = (cal.longestStreak || 0) > streak
    ? `<div class="small text-muted text-center mt-1">さいちょう記録は ${cal.longestStreak}日</div>` : '';
  el.innerHTML = `
    <div class="streak-badge">${icon('fire')}<span>${streak}日れんぞくきろく中！</span></div>${best}`;
}

/**
 * がんばりカレンダー（学習ヒートマップ）。
 * 1列が1週間で、上から日〜土。色が濃いほどその日のきろくが多いことを表します。
 */
function renderCalendar() {
  const el = document.getElementById('home-calendar');
  if (!el) return;
  const cal = insights().calendar;
  if (!cal || !cal.weeks || cal.weeks.length === 0) {
    el.innerHTML = emptyMessage('まだきろくがありません');
    return;
  }
  const cells = cal.weeks.map(week => `
    <div class="heatmap-week">
      ${week.map(day => {
        if (day.count < 0) return `<div class="heatmap-day future"></div>`;
        const title = day.count > 0 ? `${day.label} きろく${day.count}件` : `${day.label} きろくなし`;
        return `<div class="heatmap-day lv${day.level}" title="${esc(title)}"></div>`;
      }).join('')}
    </div>`).join('');

  el.innerHTML = `
    <div class="heatmap mb-2 no-furigana">${cells}</div>
    <div class="d-flex flex-wrap align-items-center gap-3">
      <div class="small text-muted">
        きろくした日 <b class="text-success">${cal.activeDays}日</b> ／ ぜんぶで <b class="text-success">${cal.totalRecords}件</b>
      </div>
      <div class="heatmap-legend ms-auto no-furigana">
        <span>すくない</span>
        <div class="heatmap-day lv1"></div><div class="heatmap-day lv2"></div>
        <div class="heatmap-day lv3"></div><div class="heatmap-day lv4"></div>
        <span>おおい</span>
      </div>
    </div>`;
}

/** わたしの成長カード（今月 vs 先月） */
function renderGrowthCard() {
  const el = document.getElementById('home-growth-card');
  if (!el) return;
  const card = insights().growthCard;
  if (!card) { el.innerHTML = emptyMessage('まだきろくがありません'); return; }

  const arrow = row => row.trend === 'up' ? '▲' : (row.trend === 'down' ? '▼' : '－');
  const diffText = row => {
    if (row.trend === 'same') return 'おなじ';
    const sign = row.diff > 0 ? '+' : '';
    return `${sign}${row.diff}${row.unit}`;
  };
  el.innerHTML = `
    <div class="alert alert-info py-2 mb-3">${esc(card.headline)}</div>
    <div class="d-flex small text-muted fw-bold mb-1">
      <div class="flex-fill"></div>
      <div style="width:5.5rem;" class="text-end">${esc(card.prevLabel)}</div>
      <div style="width:5.5rem;" class="text-end">${esc(card.thisLabel)}</div>
      <div style="width:5.5rem;" class="text-end">かわった分</div>
    </div>
    ${card.rows.map(row => `
      <div class="growth-row">
        <div class="growth-label">${esc(row.label)}</div>
        <div style="width:5.5rem;" class="text-end text-muted small">${row.prev}${esc(row.unit)}</div>
        <div style="width:5.5rem;" class="text-end growth-value">${row.now}${esc(row.unit)}</div>
        <div style="width:5.5rem;" class="text-end growth-diff ${row.trend} no-furigana">${arrow(row)} ${esc(diffText(row))}</div>
      </div>`).join('')}`;
}

/** 学びの総量メーター（実感しやすい単位に置きかえて見せます） */
function renderTotals() {
  const el = document.getElementById('home-totals');
  if (!el) return;
  const totals = insights().totals;
  if (!totals || totals.length === 0) { el.innerHTML = emptyMessage('まだきろくがありません'); return; }
  el.innerHTML = totals.map(item => `
    <div class="total-item">
      <span class="total-icon no-furigana">${item.icon}</span>
      <div class="flex-grow-1">
        <div class="small text-muted">${esc(item.label)}</div>
        ${item.note ? `<div class="small text-secondary">${esc(item.note)}</div>` : ''}
      </div>
      <div class="total-value text-primary">${item.value}<span class="small fw-normal text-muted">${esc(item.unit)}</span></div>
    </div>`).join('');
}

/** ホームに1枚だけ出す「むかしの自分」のふり返り */
function renderFlashback() {
  const el = document.getElementById('home-flashback');
  if (!el) return;
  const entry = insights().flashback;
  if (!entry) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="card shadow-sm border-0 rounded-4 flashback-card">
      <div class="card-body">
        <div class="small fw-bold text-warning-emphasis mb-1">
          <i class="bi bi-hourglass-split"></i> ${esc(entry.agoLabel)}のあなた（${esc(entry.date)} ${esc(entry.source)}）
        </div>
        <div>${esc(entry.text)}</div>
        <div class="small text-muted mt-2">あのころとくらべて、できるようになったことはあるかな？</div>

/* ---------------- めあて（目標）とふり返りの循環 ---------------- */

function goalData() {
  return (App.data && App.data.records && App.data.records.goalData) || { activeGoals: [], achievedGoals: [] };
}

/**
 * 「わたしのめあて」。進捗はきろくから自動で計算されるので、児童は入力しません。
 * 自由記述のめあてだけは自分で「できた！」を押します。
 */
function renderGoals() {
  const el = document.getElementById('home-goals');
  if (!el) return;
  const data = goalData();
  const active = data.activeGoals || [];
  const rate = data.achievement || { achieved: 0, rate: 0 };

  const summary = `
    <div class="mq-hint mb-2">
      たっせいしためあて <b style="color:var(--mq-pink-d);font-size:1.05rem;">${rate.achieved}こ</b>
      ${rate.total > 0 ? `／ たっせい率 <b style="color:var(--mq-pink-d);font-size:1.05rem;">${rate.rate}%</b>` : ''}
    </div>`;

  if (active.length === 0) {
    el.innerHTML = summary + emptyMessage('いま挑戦中のめあてはありません。「たてる」から決めてみよう！');
    return;
  }

  el.innerHTML = summary + active.map(goal => {
    if (goal.manual) {
      return `
        <div class="mission-item">
          <div class="d-flex align-items-center gap-2">
            <div class="flex-grow-1">
              <div class="mq-hint">${esc(goal.period)}のめあて</div>
              <div class="mission-text">${esc(goal.memo || goal.kindLabel)}</div>
            </div>
            <button type="button" class="mq-btn mq-btn-pink" style="min-height:2.4rem;padding:.35rem .9rem;font-size:.9rem;" data-goal-done="${goal.row}">できた！</button>
          </div>
        </div>`;
    }
    const target = goal.kind === 'typing' ? goal.speedGoal : goal.target;
    const percent = goal.percent === null ? 0 : goal.percent;
    const done = percent >= 100;
    return `
      <div class="mission-item${done ? ' complete' : ''}">
        <div class="d-flex flex-wrap align-items-center gap-1 mb-1">
          <span class="mission-text">${esc(goal.kindLabel)}</span>
          <span class="mq-hint">（${esc(goal.period)}）</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="progress flex-grow-1" style="height:14px;border-radius:999px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:${percent}%;border-radius:999px;background:${done ? 'linear-gradient(90deg,#35c47e,#8fe6b7)' : 'linear-gradient(90deg,#f472a0,#ffb0cb)'};"></div>
          </div>
          <span class="fw-bold no-furigana" style="white-space:nowrap;color:${done ? 'var(--mq-green-d)' : 'var(--mq-pink-d)'};">
            ${done ? icon('party') + ' ' : ''}${goal.current} / ${target}${esc(goal.unit)}
          </span>
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('[data-goal-done]').forEach(btn => {
    btn.addEventListener('click', () => completeGoal(Number(btn.dataset.goalDone), btn));
  });
}

/** 自由記述のめあてを「できた！」にします */
async function completeGoal(row, btn) {
  const confirmed = await Swal.fire({
    icon: 'question', title: 'めあて たっせい？',
    text: 'このめあては できましたか？',
    showCancelButton: true, confirmButtonText: 'できた！', cancelButtonText: 'まだ'
  });
  if (!confirmed.isConfirmed) return;
  const res = await busyApi(btn, '', 'completeManualGoal', row);
  if (!res) return;
  if (!res.success) { Swal.fire('できません', esc(res.message), 'warning'); return; }
  App.data.records.goalData = res.goalData;
  App.data.missions = res.missions;
  // 先に画面を新しくしてから、おいわいを出します
  renderGoals();
  renderMissions(res.missions);
  renderMoreCounts();
  renderTodayCard();
  applyProfileGains_(res);
  celebrate(45);
  Swal.fire({ icon: 'success', title: 'やったね！', html: `めあてたっせい！<br><b class="text-primary">+${res.gainedExp} EXP</b>` })
    .then(() => { if (res.leveledUp) showLevelUp(res.newLevel); });
}

/**
 * めあてを立てるダイアログ。種類をえらぶと入力欄が切りかわります。
 */
function openGoalDialog(presetKind) {
  const kinds = (App.data && App.data.goalKinds) || [{ key: 'typing', label: 'タイピングの速さ', unit: '打/秒', manual: false }];
  const options = kinds.map(k => `<option value="${esc(k.key)}">${esc(k.label)}</option>`).join('');

  Swal.fire({
    title: 'めあてを立てよう',
    html: `
      <div class="text-start">
        <label class="form-label small fw-bold">なにをがんばる？</label>
        <select id="goal-kind" class="form-select mb-2">${options}</select>
        <label class="form-label small fw-bold">いつまで？</label>
        <select id="goal-period" class="form-select mb-2">
          <option value="週">今週</option>
          <option value="月">今月</option>
        </select>
        <div id="goal-fields"></div>
      </div>`,
    showCancelButton: true, confirmButtonText: 'セットする', cancelButtonText: 'やめる',
    didOpen: () => {
      const kindSelect = document.getElementById('goal-kind');
      if (presetKind) kindSelect.value = presetKind;
      const fields = document.getElementById('goal-fields');
      const update = () => {
        const kind = kindSelect.value;
        const def = kinds.filter(k => k.key === kind)[0] || {};
        if (kind === 'free') {
          fields.innerHTML = `
            <label class="form-label small fw-bold">めあて（じぶんのことばで）</label>
            <input type="text" id="goal-memo" class="form-control" maxlength="100" placeholder="例: 音読を毎日つづける">`;
        } else if (kind === 'typing') {
          fields.innerHTML = `
            <label class="form-label small fw-bold">速さの目標（打/秒）</label>
            <input type="number" id="goal-speed" class="form-control mb-2" min="0" step="0.1" placeholder="例: 2.5">
            <label class="form-label small fw-bold">正答率の目標（%）</label>
            <input type="number" id="goal-accuracy" class="form-control" min="0" max="100" placeholder="例: 95">`;
        } else {
          fields.innerHTML = `
            <label class="form-label small fw-bold">いくつ？（${esc(def.unit || '')}）</label>
            <input type="number" id="goal-target" class="form-control" min="1" step="1" placeholder="例: 5">`;
        }
      };
      kindSelect.addEventListener('change', update);
      update();
    },
    preConfirm: () => {
      const value = el => { const node = document.getElementById(el); return node ? node.value : ''; };
      return {
        kind: value('goal-kind'),
        period: value('goal-period'),
        memo: value('goal-memo'),
        target: value('goal-target'),
        speedGoal: value('goal-speed'),
        accuracyGoal: value('goal-accuracy')
      };
    }
  }).then(async result => {
    if (!result.isConfirmed) return;
    const res = await apiWithLoading('セット中...', 'saveGoal', result.value);
    if (!res.success) { Swal.fire('セットできません', esc(res.message), 'warning'); return; }
    App.data.records.goalData = res.goalData;
    App.data.missions = res.missions;
    renderGoals();
    renderMissions(res.missions);
    renderTypingTab(App.data.records);
    // ホームの「きょう やること」と とびらの件数も、ここで合わせておきます
    renderMoreCounts();
    renderTodayCard();
    toast(res.message);
  });
}

/* ---------------- 学習アプリを ひらく ---------------- */

/**
 * ならべる学習アプリの一覧（サーバーの STUDY_APP_LINKS から届きます）。
 * 先生がまだスクリプトを新しくしていない間は空になるので、
 * 呼び出し側は「0件ならその場所ごと出さない」ようにしています。
 */
function studyAppLinks_() {
  return ((App.data && App.data.studyApp && App.data.studyApp.links) || []);
}

/**
 * 学習アプリ1つぶんのタイル。
 *
 * 学習アプリは まなびクエストとは別のサイト（GitHub Pages）にあり、
 * この画面の中には入れられません（同一オリジンでないと学習ログを読めないため）。
 * そこで target="_blank" の**ふつうのリンク**にして、新しいタブでひらきます。
 * まなびクエストは開いたまま残るので、あそんだあと ここへ帰ってきて
 * そのまま「きろくを おくる」を押せます。
 *
 * rel="noopener noreferrer" は、ひらいた先のページから この画面を
 * 勝手に別のURLへ飛ばされないようにするためのものです。
 *
 * 絵は、そのアプリが自分で用意しているPWAアイコン（iconUrl）を出します。
 * 児童がホーム画面に入れているアイコンと同じ絵になるので、
 * 名前を読まなくても「いつも使っているあれ」だと分かります。
 * 画像は別サイトから読むため、学校のネットワークで止められることもあります。
 * そのときのために自前のSVG（app.icon）も一緒に置いておき、
 * bindAppIconFallback_() が読み込み失敗を見つけたら そちらに切りかえます。
 */
function appTileHtml(app, compact) {
  const name = app.name || app.label || app.id;
  return `<a class="mq-app app-${esc(app.color || 'blue')}" href="${esc(app.url)}"
    target="_blank" rel="noopener noreferrer"
    aria-label="${esc(name)}を 新しいタブで ひらく">
    <span class="app-icon${app.iconUrl ? ' has-logo' : ''}">
      ${app.iconUrl ? `<img class="app-logo" src="${esc(app.iconUrl)}" alt="" width="192" height="192" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ''}
      ${icon(app.icon || 'gamepad')}
    </span>
    <span class="app-body">
      <span class="app-name">${esc(name)}</span>
      ${compact ? '' : `${app.subject ? `<span class="app-subject">${esc(app.subject)}</span>` : ''}
      ${app.note ? `<span class="app-note">${esc(app.note)}</span>` : ''}`}
    </span>
    <span class="app-open no-furigana">${icon('external')}</span>
  </a>`;
}

/**
 * アプリのアイコン画像が読めなかったときに、自前のSVGへ切りかえます。
 *
 * 画像は別サイト（gigayama.github.io）から読むので、学校のフィルタや
 * オフラインで落ちることがあります。落ちたまま放っておくと
 * タイルの左が空白になり、どのアプリか分からなくなってしまいます。
 * error イベントは親へ伝わらないので、img ごとに直接ひろいます。
 * 読み込みずみで失敗していた場合（キャッシュ）は complete で拾えます。
 */
function bindAppIconFallback_(root) {
  (root || document).querySelectorAll('.app-logo').forEach(img => {
    const box = img.parentElement;
    const fail = () => box && box.classList.add('logo-missing');
    if (img.complete && img.naturalWidth === 0) fail();
    img.addEventListener('error', fail);
  });
}

/**
 * 学習アプリの一覧を描きます。
 * @param {string} containerId - 描く場所
 * @param {Object} [options] - compact: せまい場所（きろくの画面）用の小さいタイル
 * @returns {boolean} 1つでも描けたか
 */
function renderAppLauncher(containerId, options) {
  const el = document.getElementById(containerId);
  if (!el) return false;
  const compact = !!(options && options.compact);
  const apps = studyAppLinks_();
  if (apps.length === 0) {
    el.innerHTML = '';
    el.classList.add('d-none');
    return false;
  }
  el.classList.remove('d-none');
  el.innerHTML = `
    ${compact ? '' : `<div class="mq-card accent-purple mb-3">
      <div class="mq-card-head">
        <span class="mq-card-icon">${icon('external')}</span>
        <h2 class="mq-card-title">あたらしいタブで ひらきます</h2>
      </div>
      <div class="mq-card-body tight">
        <p class="mb-0" style="font-size:.9rem;line-height:1.7;">
          やりたいアプリを えらんでね。まなびクエストは この画面に のこっているので、
          あそんだあと もどってきて「きろくを おくる」を おせば けいけんちに なるよ。
        </p>
      </div>
    </div>`}
    <div class="mq-applist${compact ? ' compact' : ''}">
      ${apps.map(a => appTileHtml(a, compact)).join('')}
    </div>`;
  bindAppIconFallback_(el);
  return true;
}

/** ホームの「がくしゅうアプリ」のとびらは、ならべるアプリがあるときだけ出します */
function renderAppsDoor() {
  const door = document.getElementById('home-apps-door');
  if (!door) return;
  const apps = studyAppLinks_();
  door.classList.toggle('d-none', apps.length === 0);
  const note = door.querySelector('.door-note');
  if (note && apps.length > 0) note.textContent = `${apps.length}この アプリを ひらけるよ`;
}

/* ---------------- 学習アプリのきろくを おくる ---------------- */

/**
 * 「きろくをおくる」パネル。
 * ポータル（gigayama.github.io）の iframe 内で開かれているときは、この画面のボタンから
 * 親ページに送信を依頼できます（学習アプリの localStorage は同一オリジンの親しか読めないため）。
 * 直接Webアプリを開いているときは、ポータルへの案内を表示します。
 */
function studySendPanelHtml() {
  // 受信は学習ポータル経由でいつでもできるので、「先生の受け取り設定待ち」の状態はありません
  const s = (App.data && App.data.studyApp) || {};

  const rewards = [];
  if (s.bonusExp > 0) rewards.push(`<span class="reward-chip text-primary">そうしんボーナス +${s.bonusExp} EXP</span>`);
  if (s.bonusStreakExp > 0) rewards.push(`<span class="reward-chip text-danger">れんぞく${s.nextStreak}日目 +${s.bonusStreakExp} EXP</span>`);
  if (s.bonusPoints > 0) rewards.push(`<span class="reward-chip text-warning-emphasis">交換Pt +${s.bonusPoints}</span>`);
  const rewardHtml = rewards.length
    ? `<div class="mt-2">${rewards.join('')}</div>`
    : `<div class="mt-2 small text-muted">今日はもうボーナスをもらったよ。きろくぶんのEXPはこのあともふえるよ！</div>`;
  const streakHtml = s.streak > 0
    ? `<span class="badge bg-danger ms-2">${icon('fire')} ${s.streak}日れんぞく</span>` : '';

  // ① ポータルの中にいる → その場で送信できる
  if (Portal.embedded && Portal.connected) {
    if (Portal.sending) {
      return `<div class="card send-card"><div class="card-body d-flex align-items-center gap-3">
        <div class="spinner-border text-primary"></div>
        <div class="fw-bold">きろくを おくっています…</div>
      </div></div>`;
    }
    if (Portal.pending > 0) {
      // 出席番号はログイン中のアカウントから分かる（notifyPortalIdentity でポータルに伝えています）。
      // 入力をお願いするのは、それが分からなかったときだけです。
      const ownNumber = /^\d+$/.test(String((App.data && App.data.profile && App.data.profile.number) || ''));
      const needsNumber = !Portal.studentNumber && !ownNumber;
      const action = needsNumber
        ? `<button type="button" class="mq-btn mq-btn-gold send-btn" data-study-number>${icon('calc')} しゅっせきばんごうを 入れる</button>`
        : `<button type="button" class="mq-btn mq-btn-pink mq-btn-lg send-btn" data-study-send>${icon('send')} きろくを おくる</button>`;
      return `<div class="card send-card has-pending"><div class="card-body">
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <span class="send-pending-badge">${Portal.pending}</span>
          <div class="flex-grow-1">
            <div class="fw-bold" style="font-size:1.2rem;">おくれる がくしゅうきろくが ${Portal.pending}件 あるよ！${streakHtml}</div>
            <div class="small text-muted">${needsNumber
              ? 'おくるまえに、しゅっせきばんごうを 入れてね。'
              : 'おくると まなびクエストの けいけんちに なるよ。'}</div>
            ${rewardHtml}
          </div>
          ${action}
        </div>
      </div></div>`;
    }
    return `<div class="card send-card"><div class="card-body d-flex align-items-center gap-3 flex-wrap">
      <div class="flex-grow-1">
        <div class="fw-bold">おくるきろくは ありません${streakHtml}</div>
        <div class="small text-muted">学習アプリであそんだあと、ここに「おくる」ボタンが出るよ。</div>
      </div>
      <button type="button" class="mq-btn mq-btn-ghost" style="min-height:2.5rem;padding:.4rem 1rem;font-size:.92rem;" data-study-refresh>たしかめる</button>
    </div></div>`;
  }

  // ② Webアプリを直接開いている → ポータルへ案内する
  const portalUrl = s.portalUrl;
  return `<div class="card send-card"><div class="card-body d-flex align-items-center gap-3 flex-wrap">
    <div class="flex-grow-1">
      <div class="fw-bold">学習アプリの きろくを おくろう${streakHtml}</div>
      <div class="small text-muted">${portalUrl
        ? '「学習ポータル」からひらくと、この画面のボタンでそのまま おくれるよ。'
        : '先生に「学習ポータル」のURLを教えてもらってね。'}</div>
      ${rewardHtml}
    </div>
    ${portalUrl
      ? `<a class="mq-btn send-btn" href="${esc(portalUrl)}" target="_blank" rel="noopener">ポータルをひらく</a>`
      : ''}
  </div></div>`;
}

/** ホームと「きろく」タブの送信パネルをまとめて描き直します */
function renderStudySendPanels() {
  ['home-send-card', 'apps-launch-send', 'apps-send-card', 'typing-send-card', 'calc-send-card', 'reading-send-card'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = studySendPanelHtml();
    el.classList.toggle('d-none', el.innerHTML.trim() === '');   // 空のときは余白を作らない
    el.querySelectorAll('[data-study-send]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (requestPortalSend()) renderStudySendPanels();
      });
    });
    el.querySelectorAll('[data-study-refresh]').forEach(btn => {
      btn.addEventListener('click', () => postToPortal({ type: 'REQUEST_PENDING' }));
    });
    el.querySelectorAll('[data-study-number]').forEach(btn => {
      btn.addEventListener('click', () => postToPortal({ type: 'REQUEST_NUMBER' }));
    });
  });
}

/** ポータルから送信結果を受け取ったときの演出とデータ更新 */
function handlePortalSendResult(msg) {
  renderStudySendPanels();
  if (!msg.ok) {
    Swal.fire('おくれませんでした', esc(msg.message || 'もういちど ためしてね。'), 'warning');
    return;
  }
  if (!msg.saved) {
    // 受信側がまだ対応していないきろく（仕様 §9.3 の一時エラー）は端末に残してあります。
    // 「なかった」と伝えると気づかれないまま たまり続けるので、分けて知らせます。
    if (msg.kept > 0) {
      toast(`${msg.kept}件は まだ おくれません。きろくは のこしてあるので、先生に つたえてね`, 'warning');
    } else {
      toast('あたらしいきろくは ありませんでした', 'info');
    }
    return;
  }

  const r = msg.reward || {};
  const lines = [`<b>${msg.saved}件</b>の きろくを おくりました！`];
  if (r.typingRecords > 0) lines.push(`${icon('keyboard')} タイピング <b>${r.typingRecords}回分</b> がきろくされたよ`);
  if (r.calcRecords > 0) lines.push(`${icon('calc')} 100マス計算 <b>${r.calcRecords}回分</b> がきろくされたよ`);
  if (r.readingRecords > 0) lines.push(`${icon('book')} どくしょ <b>${r.readingRecords}さつ分</b> がきろくされたよ`);
  if (msg.gainedExp > 0) lines.push(`<b class="text-primary fs-5">+${msg.gainedExp} EXP</b> ゲット！`);
  const detail = [];
  if (r.appExp > 0) detail.push(`学習時間 +${r.appExp}`);
  if (r.typingExp > 0) detail.push(`タイピング +${r.typingExp}`);
  if (r.calcExp > 0) detail.push(`100マスの点数 +${r.calcExp}`);
  if (r.readingExp > 0) detail.push(`よんだページ +${r.readingExp}`);
  if (r.sendExp > 0) detail.push(`そうしんボーナス +${r.sendExp}`);
  if (r.streakExp > 0) detail.push(`れんぞく${r.streak}日目 +${r.streakExp}`);
  if (r.personalBestExp > 0) detail.push(`じこベスト +${r.personalBestExp}`);
  if (r.recordStreakExp > 0) detail.push(`${r.recordStreak}日れんぞくきろく +${r.recordStreakExp}`);
  if (detail.length > 0) lines.push(`<span class="small text-muted">（${detail.join(' / ')}）</span>`);
  if (r.exchangePoints > 0) lines.push(`${icon('gift')} 交換ポイント <b>+${r.exchangePoints}</b>`);
  if (msg.duplicate > 0) lines.push(`<span class="small text-muted">${msg.duplicate}件は おくりずみでした</span>`);
  if (msg.kept > 0) lines.push(`<span class="small text-warning">${msg.kept}件は まだ おくれません（きろくは のこしてあります）</span>`);
  // じこベストは 100マスのタイムと タイピングの速さの 両方が同時に更新されることがあります
  const bests = msg.personalBests || (msg.personalBest ? [msg.personalBest] : []);
  bests.slice().reverse().forEach(b => {
    lines.unshift(`${icon('star')} <b class="text-danger">じこベスト更新！</b> ${esc(b.label)} ${b.value}${esc(b.unit)}（まえは ${b.previous}${esc(b.unit)}）`);
  });
  (msg.achievedGoals || []).forEach(g => {
    lines.unshift(`${icon('trophy')} <b class="text-success">めあて たっせい！</b> ${esc(g.kindLabel)}${g.memo ? `「${esc(g.memo)}」` : ''}${g.exp > 0 ? ` +${g.exp} EXP` : ''}`);
  });

  // おいわいを読んでもらっているあいだに、うしろで最新データを取りにいきます。
  // 読み終えてダイアログを閉じたときには、もう新しい画面になっています。
  const refreshing = refreshStudentData();
  Swal.fire({ icon: 'success', title: bests.length > 0 ? 'きろく更新！' : 'やったね！', html: lines.join('<br>') })
    .then(() => (msg.leveledUp ? showLevelUp(msg.level) : null))
    .then(() => refreshing);
}

/**
 * サーバーの最新データで画面を作り直します。
 *
 * 同じ取得が重なって走らないよう、走っているものがあればそれを使いまわします。
 * （おいわいの演出の裏で始めた取得と、そのあとの操作がぶつかるのを防ぎます）
 */
let studentRefreshing = null;
function refreshStudentData() {
  if (studentRefreshing) return studentRefreshing;
  studentRefreshing = (async () => {
    try {
      const data = await api('getStudentAppData');
      if (!data.success) return;
      App.data = { ...App.data, ...data };
      renderStudentHeader(data.profile);
      renderHome(data);
      renderCalcTab(data.records);
      renderRankings('rankings-container', data.rankings);
      studyAppLoaded = false;
      if (isShown_('rtab-apps')) loadStudyAppTab();
    } catch (e) { /* 表示更新の失敗は致命的ではない */ } finally {
      studentRefreshing = null;
    }
  })();
  return studentRefreshing;
}

/* ---------------- ミッション ---------------- */

/**
 * いま画面に出ているミッション一覧の「かたち」。
 * 中身が変わっていないのに作り直すと、リストが毎回ふわっと出なおして
 * ちらついて見えるので、変わったときだけ描きなおす目印にします。
 */
let missionListSignature = '';

function missionSignature_(missions) {
  return (missions || [])
    .map(m => `${m.id}/${m.progress}/${m.target}/${m.isComplete ? 1 : 0}/${m.isClaimed ? 1 : 0}`)
    .join('|');
}

/** ミッションの右はしに出すもの（すすみ具合／うけとるボタン／うけとりずみ） */
/* ---------------- 先生からの課題 ---------------- */

/** いまの課題データ（ホームの初期データ、または うけとったあとの返事） */
function assignmentList_() {
  return (App.data && App.data.assignments) || [];
}

/** まだ出していない課題（＝やることが のこっている課題） */
function pendingAssignments_() {
  return assignmentList_().filter(a => !a.submitted);
}

/** ごほうびを うけとれる課題 */
function claimableAssignments_() {
  return assignmentList_().filter(a => a.canClaim);
}

/**
 * 課題1件のカードをつくります。
 *
 * 「何をすればいいか」で終わらせず、**そこから すぐ動ける入口**（アプリをひらく／
 * きろくを書きに行く）を同じカードの中に置きます。児童が課題を見たあとで
 * 自分でアプリをさがす必要がないようにするためです。
 */
function assignmentCardHtml_(a) {
  const pct = a.target > 0 ? Math.min(100, Math.floor((a.progress / a.target) * 100)) : 0;
  const action = a.isClaimed
    ? '<span class="mission-claimed">うけとりずみ</span>'
    : (a.canClaim
      ? `<button type="button" class="mq-btn mq-btn-gold assign-claim-btn" data-assignment="${esc(a.id)}">うけとる！</button>`
      : `<span class="mission-progress-text">${a.progress} / ${a.target}${esc(a.unit)}</span>`);

  // 期限が近い・すぎたときだけ色をつけます（ふだんは静かに出します）
  let dueHtml = '';
  if (a.overdue) dueHtml = '<span class="assign-due over">きげんが すぎています</span>';
  else if (a.due) dueHtml = `<span class="assign-due${a.dueSoon ? ' soon' : ''}">${esc(a.due)}まで</span>`;

  let cta = '';
  if (!a.submitted) {
    if (a.kind === 'app' && a.appUrl) {
      cta = `<a class="mq-btn mq-btn-purple" href="${esc(a.appUrl)}" target="_blank" rel="noopener">アプリを ひらく</a>
             <button type="button" class="mq-btn mq-btn-ghost" data-go-panel="p-send">きろくを おくる</button>`;
    } else if (a.kind === 'record' && a.recordType) {
      cta = `<button type="button" class="mq-btn mq-btn-green assign-record-btn" data-record="${esc(a.recordType)}">かきに いく</button>`;
    }
  }

  return `<div class="mission-item assign-item ${a.submitted ? 'complete' : ''} ${a.isClaimed ? 'claimed' : ''} ${a.overdue ? 'overdue' : ''}" data-assignment-id="${esc(a.id)}">
    <div class="d-flex justify-content-between align-items-center gap-2">
      <div class="flex-grow-1">
        <span class="badge bg-warning text-dark mission-type-badge">先生から</span>
        <span class="mission-text ms-1">${esc(a.title)}</span>
        ${dueHtml}
        ${a.description ? `<div class="assign-note">${esc(a.description)}</div>` : ''}
        <div class="progress mt-2" style="height:10px;border-radius:999px;">
          <div class="progress-bar" style="width:${pct}%;border-radius:999px;background:linear-gradient(90deg,#f9a03f,#ffcf8a);"></div>
        </div>
      </div>
      <div class="text-end mission-side">
        <div class="assign-action">${action}</div>
        ${a.reward > 0 ? `<div class="mission-reward">経験値 +${a.reward}</div>` : ''}
      </div>
    </div>
    ${cta ? `<div class="assign-cta">${cta}</div>` : ''}
  </div>`;
}

function renderAssignments(assignments) {
  if (assignments && App.data) App.data.assignments = assignments;
  const container = document.getElementById('home-assignments');
  if (!container) return;
  const list = assignmentList_();
  container.innerHTML = list.length === 0
    ? emptyMessage('いまは 先生からの かだいは ありません')
    : list.map(assignmentCardHtml_).join('');
  // カードの中の「きろくを おくる」は描きなおすたびに新しくなるので、そのつどつなぎます
  bindPanelLinks(container);
  bindAssignmentEvents_(container);
  renderAssignmentDoor();
}

/** ホームの「先生からの かだい」のとびらは、課題が出ているときだけ ならびます */
function renderAssignmentDoor() {
  const door = document.getElementById('home-assign-door');
  if (!door) return;
  const pending = pendingAssignments_().length;
  const claimable = claimableAssignments_().length;
  door.classList.toggle('d-none', pending + claimable === 0);
  const note = door.querySelector('.door-note');
  if (note) {
    note.textContent = claimable > 0
      ? `ごほうびが ${claimable}こ まっているよ`
      : (pending > 0 ? `やることが ${pending}こ あるよ` : 'ぜんぶ おわったよ');
  }
}

/**
 * カードの中のボタンは、親で1回だけ受けます。
 * （中身を書きかえても押せなくならないようにするためです）
 */
function bindAssignmentEvents_(container) {
  if (container.dataset.assignBound === '1') return;
  container.dataset.assignBound = '1';
  container.addEventListener('click', ev => {
    const claim = ev.target.closest('.assign-claim-btn');
    if (claim) { claimAssignmentFrom_(claim); return; }
    const record = ev.target.closest('.assign-record-btn');
    if (record) openRecordFormForAssignment_(record.dataset.record);
  });
}

/**
 * 課題の「かきに いく」から、そのきろくの入力フォームまで一気に連れていきます。
 * とちゅうの「なにを書く？」の画面をとばせるので、課題→行動が1タップでつながります。
 */
function openRecordFormForAssignment_(recordType) {
  showView('view-records', { push: true });
  // ビューの切りかえアニメーションが終わってからフォームをひらきます
  setTimeout(() => openRecordForm(recordType), 120);
}

/**
 * 課題のごほうびを受け取ります（ミッションのうけとりと同じ流れです）。
 * 待つのは押したボタンの中だけで、画面はふさぎません。
 */
async function claimAssignmentFrom_(btn) {
  const assignmentId = btn.dataset.assignment;
  const result = await busyApi(btn, '', 'claimAssignmentReward', assignmentId);
  if (!result) return;   // 処理中の二重タップ
  if (!result.success) {
    // すでに受け取りずみのときは、画面のほうが古いだけなので そっと追いつかせます
    if (result.alreadyClaimed) {
      markAssignmentClaimed_(assignmentId);
      toast(result.message, 'info');
      return;
    }
    Swal.fire('うけとれません', esc(result.message), 'warning');
    return;
  }

  const row = markAssignmentClaimed_(assignmentId);
  applyProfileGains_(result);
  starBurst((row && row.querySelector('.assign-action')) || btn, 14);
  celebrate(45);
  if (result.leveledUp) showLevelUp(result.newLevel);
  else toast(`ごほうびゲット！ +${result.rewardAmount} EXP`);
}

/** うけとったことを、手もとのデータと画面に反映します */
function markAssignmentClaimed_(assignmentId) {
  const target = assignmentList_().filter(a => String(a.id) === String(assignmentId))[0];
  if (target) { target.submitted = true; target.isClaimed = true; target.canClaim = false; }
  renderAssignments();
  renderMoreCounts();
  renderTodayCard();
  return document.querySelector(`#home-assignments .assign-item[data-assignment-id="${assignmentId}"]`);
}

function missionActionHtml_(m) {
  if (m.isClaimed) return '<span class="mission-claimed">うけとりずみ</span>';
  if (m.isComplete) return `<button type="button" class="mq-btn mq-btn-gold claim-btn" data-mission="${esc(m.id)}">うけとる！</button>`;
  return `<span class="mission-progress-text">${m.progress} / ${m.target}</span>`;
}

function renderMissions(missions) {
  const container = document.getElementById('home-missions');
  if (!container) return;
  const list = missions || [];
  if (list.length === 0) {
    missionListSignature = '';
    container.innerHTML = emptyMessage('ミッションはまだありません');
    return;
  }
  const signature = missionSignature_(list);
  // 前とまったく同じなら、なにもしません（見えている画面を、そのまま残します）
  if (signature === missionListSignature && container.querySelector('.mission-item')) return;

  // ミッションの顔ぶれが変わったときだけ、上から順にふわっと出します。
  // 進み具合が変わっただけのときは、その場で書きかわるほうが落ち着いて見えます。
  const idsBefore = missionListSignature.split('|').map(s => s.split('/')[0]).join(',');
  const idsAfter = list.map(m => String(m.id)).join(',');
  container.classList.toggle('mq-stagger', idsBefore !== idsAfter);
  missionListSignature = signature;

  const typeBadge = { 'デイリー': 'bg-info', 'ウィークリー': 'bg-primary', '協力': 'bg-danger' };
  container.innerHTML = list.map(m => {
    const pct = m.target > 0 ? Math.min(100, Math.floor((m.progress / m.target) * 100)) : 0;
    return `<div class="mission-item ${m.isComplete ? 'complete' : ''} ${m.isClaimed ? 'claimed' : ''}" data-mission-id="${esc(m.id)}">
      <div class="d-flex justify-content-between align-items-center gap-2">
        <div class="flex-grow-1">
          <span class="badge ${typeBadge[m.type] || 'bg-secondary'} mission-type-badge">${esc(m.type)}</span>
          <span class="mission-text ms-1">${esc(m.content)}</span>
          <div class="progress mt-2" style="height:10px;border-radius:999px;">
            <div class="progress-bar" style="width:${pct}%;border-radius:999px;background:linear-gradient(90deg,#35c47e,#8fe6b7);"></div>
          </div>
        </div>
        <div class="text-end mission-side">
          <div class="mission-action">${missionActionHtml_(m)}</div>
          <div class="mission-reward">${esc(m.rewardType)} +${m.rewardAmount}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  bindMissionEvents_(container);
}

/**
 * うけとるボタンの反応は、リストの親で1回だけ受けます。
 * 行の中身を差しかえても押せなくならないようにするためです。
 */
function bindMissionEvents_(container) {
  if (container.dataset.claimBound === '1') return;
  container.dataset.claimBound = '1';
  container.addEventListener('click', ev => {
    const btn = ev.target.closest('.claim-btn');
    if (btn) claimMissionFrom_(btn);
  });
}

/** ミッションの行を、いまのデータの状態に合わせて書きかえます */
function updateMissionRow_(missionId) {
  const mission = (App.data.missions || []).find(m => String(m.id) === String(missionId));
  const rows = document.querySelectorAll('#home-missions .mission-item');
  const row = Array.prototype.filter.call(rows, r => r.dataset.missionId === String(missionId))[0];
  if (row && mission) {
    row.classList.toggle('complete', !!mission.isComplete);
    row.classList.toggle('claimed', !!mission.isClaimed);
    const slot = row.querySelector('.mission-action');
    if (slot) {
      slot.innerHTML = missionActionHtml_(mission);
      popElement(slot.firstElementChild);   // 新しい表示が「ぽん」と出ます
    }
  }
  // 画面を作り直したときに、また同じ状態を作れるようにしておきます
  missionListSignature = missionSignature_(App.data.missions);
  return row;
}

/** ごほうびを受け取ったことを、手もとのデータと画面に反映します */
function markMissionClaimed_(missionId) {
  const mission = (App.data.missions || []).find(m => String(m.id) === String(missionId));
  if (mission) { mission.isComplete = true; mission.isClaimed = true; }
  const row = updateMissionRow_(missionId);
  // ホームの「きょう やること」や、とびらの件数バッジも、その場で合わせます
  renderMoreCounts();
  renderTodayCard();
  return row;
}

/**
 * ミッションのごほうびを受け取ります。
 *
 * 待つのは押したボタンの中だけ（画面はふさぎません）。
 * サーバーの返事が来たら、まず「うけとりずみ」に書きかえてから演出を出します。
 * 受け取りに必要なものはすべて返事に入っているので、
 * このあとデータを取りなおすことはありません。
 */
async function claimMissionFrom_(btn) {
  const missionId = btn.dataset.mission;
  const result = await busyApi(btn, '', 'claimMissionReward', missionId);
  if (!result) return;   // 処理中の二重タップ
  if (!result.success) {
    // すでに受け取りずみだったときは、画面のほうが古いだけなので、そっと追いつかせます
    if (result.alreadyClaimed) {
      markMissionClaimed_(missionId);
      toast(result.message, 'info');
      return;
    }
    Swal.fire('うけとれません', esc(result.message), 'warning');
    return;
  }

  // ① さきに画面を新しい状態にします（演出のうしろに古いボタンが残らないように）
  const row = markMissionClaimed_(missionId);
  applyProfileGains_(result);
  // ② そのうえで、おいわいします
  starBurst((row && row.querySelector('.mission-action')) || btn, 14);
  celebrate(45);
  // レベルアップしたときは、そちらのお祝いだけにします（トーストと重ねません）
  if (result.leveledUp) {
    showLevelUp(result.newLevel);
  } else {
    const gain = result.rewardType === '経験値' ? `+${result.rewardAmount} EXP` : `+${result.rewardAmount} 交換Pt`;
    toast(`ごほうびゲット！ ${gain}`);
  }
}

/**
 * サーバーの返事に入っていた けいけんち・交換Pt・レベルを、手もとのデータに取りこみます。
 * ごほうび・ガチャ・こうかんなど、数がふえる操作すべてがここを通ります。
 */
function applyProfileGains_(res) {
  const p = App.data.profile;
  if (!p || !res) return;
  const num = v => (v !== undefined && v !== null ? Number(v) : null);
  const exp = num(res.newExp !== undefined ? res.newExp : res.newPoints);
  const totalExp = num(res.newTotalExp);
  const points = num(res.newExchangePoints);
  if (exp !== null) p.exp = exp;
  if (totalExp !== null) p.totalExp = totalExp;
  if (points !== null) p.exchangePoints = points;
  if (res.levelInfo) {
    p.level = res.levelInfo.level;
    p.progress = res.levelInfo.progress;
    p.currentLevelExp = res.levelInfo.currentLevelExp;
    p.nextLevelExp = res.levelInfo.nextLevelExp;
  } else if (res.newLevel) {
    p.level = res.newLevel;
  }
  syncProfileDisplay_();
}

/** けいけんち・交換Pt・レベル・つぎのレベルまでのバーを、いまのデータにそろえます */
function syncProfileDisplay_() {
  const p = (App.data && App.data.profile) || {};
  countUp(document.getElementById('home-exp'), p.exp);
  countUp(document.getElementById('home-exchange'), p.exchangePoints);
  countUp(document.getElementById('quest-exchange'), p.exchangePoints);
  const set = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
  set('home-level', p.level);

/**
 * 教科ごとのとりくみを表すレーダーチャート。
 * Google Charts にレーダーがないため、SVG を自前で組み立てています。
 */
function drawRadarChart(containerId, axes) {
  const container = document.getElementById(containerId);
  if (!container || axes.length < 3) return;

  const size = 320, center = size / 2, radius = size / 2 - 46;
  const angleFor = i => (Math.PI * 2 * i / axes.length) - Math.PI / 2;
  const pointAt = (i, ratio) => {
    const angle = angleFor(i);
    return [center + Math.cos(angle) * radius * ratio, center + Math.sin(angle) * radius * ratio];
  };

  // 外枠のグリッド（4段階）
  const grids = [0.25, 0.5, 0.75, 1].map(ratio => {
    const points = axes.map((a, i) => pointAt(i, ratio).join(',')).join(' ');
    return `<polygon class="radar-grid" points="${points}"></polygon>`;
  }).join('');

  const spokes = axes.map((a, i) => {
    const [x, y] = pointAt(i, 1);
    return `<line class="radar-axis" x1="${center}" y1="${center}" x2="${x}" y2="${y}"></line>`;
  }).join('');

  const area = `<polygon class="radar-area" points="${
    axes.map((a, i) => pointAt(i, Math.max(0.02, a.value / 100)).join(',')).join(' ')
  }"></polygon>`;

  const labels = axes.map((a, i) => {
    const [x, y] = pointAt(i, 1.18);
    const anchor = Math.abs(x - center) < 8 ? 'middle' : (x > center ? 'start' : 'end');
    return `<text class="radar-label" x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle">${esc(a.subject)}</text>`;
  }).join('');

  container.innerHTML =
    `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="教科ごとのとりくみ">${grids}${spokes}${area}${labels}</svg>`;
}

/* ---- 入力フォームをつくるための小さな部品 ---- */

/** ＋−ボタンつきの数入力（小さな数字キーをさわらずに増やせます） */
function stepper(id, options) {
  const o = options || {};
  const min = o.min === undefined ? 0 : o.min;
  const step = o.step || 1;
  return `<div class="mq-stepper" data-stepper-for="${id}" data-step="${step}"${o.max !== undefined ? ` data-max="${o.max}"` : ''} data-min="${min}">
    <button type="button" class="mq-step-btn" data-delta="-1" aria-label="へらす">${icon('minus')}</button>
    <input type="number" class="mq-input" id="${id}" min="${min}"${o.max !== undefined ? ` max="${o.max}"` : ''} step="${step}" inputmode="decimal"${o.value !== undefined ? ` value="${o.value}"` : ''} placeholder="0">
    <button type="button" class="mq-step-btn" data-delta="1" aria-label="ふやす">${icon('plus')}</button>
  </div>`;
}

/**
 * 押して選ぶ選択肢。プルダウンより中身が見えるので、児童が迷いにくくなります。
 * @param {string} id - えらんだ値は #id の data-value に入ります
 * @param {Array} choices - [{ value, label, icon, mark }]
 */
function choiceGroup(id, choices, options) {
  const o = options || {};
  const first = o.value !== undefined ? o.value : choices[0].value;
  return `<div class="mq-choice${o.grow === false ? '' : ' grow'}" id="${id}" data-value="${esc(first)}">
    ${choices.map(c => `<button type="button" class="mq-choice-item${c.value === first ? ' on' : ''}" data-value="${esc(c.value)}">
      ${c.icon ? `<span class="choice-emoji">${icon(c.icon)}</span>` : ''}${c.mark ? `<span class="choice-mark no-furigana" aria-hidden="true">${c.mark}</span>` : ''}<span>${esc(c.label)}</span>
    </button>`).join('')}
  </div>`;
}

/** プルダウン（選択肢が多くてボタンにできないとき） */
function selectField(id, values, options) {
  const o = options || {};
  return `<select class="mq-select" id="${id}">${
    values.map(v => {
      const value = typeof v === 'object' ? v.value : v;
      const label = typeof v === 'object' ? v.label : v;
      return `<option value="${esc(value)}"${value === o.value ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')
  }</select>`;
}

/** 小さな見出しつきの入力欄（1つのステップに2つならべるときに使います） */
function subField(labelText, inner) {
  return `<div class="mq-field"><div class="mq-label">${esc(labelText)}</div>${inner}</div>`;
}

/** ふり返り入力の「書き出しヒント」チップ群を生成します */
function starterChips(targetId, phrases) {
  return `<div class="starter-chips mt-2" data-starter-for="${targetId}">
    <div class="mq-hint mb-1">${icon('bulb')} かきだしのヒント（タップすると入ります）</div>
    <div class="mq-choice">
      ${phrases.map(p => `<button type="button" class="mq-choice-item starter-chip" style="min-height:2.4rem;padding:.35rem .8rem;font-size:.92rem;font-weight:500;" data-phrase="${esc(p)}">${esc(p)}…</button>`).join('')}
    </div>
  </div>`;
}

/** 書き出しヒントのクリックで、対象のふり返り欄に文言を挿入します */
function bindStarterChips(area) {
  area.querySelectorAll('.starter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const wrap = chip.closest('.starter-chips');
      const ta = wrap && document.getElementById(wrap.dataset.starterFor);
      if (!ta) return;
      const sep = ta.value.trim().length ? '\n' : '';
      ta.value = ta.value.replace(/\s+$/, '') + sep + chip.dataset.phrase;
      ta.focus();
    });
  });
}

/** 選択肢ボタンとステッパーを動くようにします */
function bindFormWidgets(area) {
  area.querySelectorAll('.mq-choice').forEach(group => {
    group.querySelectorAll('.mq-choice-item').forEach(item => {
      item.addEventListener('click', () => {
        group.dataset.value = item.dataset.value;
        group.querySelectorAll('.mq-choice-item').forEach(b => b.classList.toggle('on', b === item));
      });
    });
  });
  area.querySelectorAll('.mq-stepper').forEach(group => {
    const input = document.getElementById(group.dataset.stepperFor);
    if (!input) return;
    const step = Number(group.dataset.step) || 1;
    const min = group.dataset.min === '' ? null : Number(group.dataset.min);
    const max = group.dataset.max === undefined ? null : Number(group.dataset.max);
    group.querySelectorAll('.mq-step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const current = input.value === '' ? (min === null ? 0 : min) : Number(input.value);
        let next = current + step * Number(btn.dataset.delta);
        if (min !== null && next < min) next = min;
        if (max !== null && next > max) next = max;
        // 0.1きざみのときに小数の誤差が出ないようにまるめます
        input.value = String(Math.round(next * 100) / 100);
        input.dispatchEvent(new Event('change'));
      });
    });
  });
}

 * すべてのステップは最初からDOMに置いてあり、表示だけを切りかえるので、

/**
 * きろくの種類ごとの しつもんリスト。
 * 1ステップにつき、入力するものは1〜2こまでにしています。
 * @returns {Array} [{ icon, question, html, hint, require }]
 */
function recordSteps(type) {
  switch (type) {
    // タイピング・100マス計算・どくしょは、Typa／100マス計算アプリ／
    // どくしょ ちょきんばこ のきろくから自動で入るため、入力フォームを持ちません
    // （RECORD_TYPES の appOnly。サーバー側の saveRecord も受け付けません）

    case 'growth': return [
      { icon: 'sprout', question: 'どんなことが できるように なった？',
        html: `<input type="text" class="mq-input" id="f-content" placeholder="れい: なわとびの二重とびができた">`, require: 'f-content' },
      { icon: 'comment', question: 'どうやって できるように なった？',
        html: `<textarea class="mq-textarea" id="f-gcomment" placeholder="がんばったこと・コツ"></textarea>
          ${starterChips('f-gcomment', ['まいにち', 'コツは', 'つぎは'])}` }
    ];

    case 'study': return [
      { icon: 'bulb', question: 'なにを しらべた？',
        html: `<input type="text" class="mq-input" id="f-theme" placeholder="テーマ・ふしぎに思ったこと">`, require: 'f-theme' },
      { icon: 'bulb', question: 'なにが わかった？',
        html: `<textarea class="mq-textarea" id="f-summary" placeholder="しらべて分かったこと"></textarea>
          ${starterChips('f-summary', ['しらべてみると', 'おどろいたのは', 'まとめると'])}` },
      { icon: 'arrow-right', question: 'つぎは なにを やってみたい？',
        html: `<input type="text" class="mq-input" id="f-next" placeholder="つぎに知りたいこと">` }
    ];

    case 'lesson': return [
      { icon: 'books', question: 'なんの じゅぎょう？', html: selectField('f-subject', SUBJECTS) },
      { icon: 'target', question: 'めあては たっせいできた？', html: choiceGroup('f-q1', [
          { value: '◎ できた', label: 'できた', mark: '◎' },
          { value: '◯ だいたいできた', label: 'だいたい', mark: '◯' },
          { value: '△ むずかしかった', label: 'むずかしかった', mark: '△' }
        ]) },
      { icon: 'hand', question: 'すすんで 学べた？', html: choiceGroup('f-selfeval', [
          { value: '◎', label: 'とても', mark: '◎' },
          { value: '◯', label: 'まあまあ', mark: '◯' },
          { value: '△', label: 'あまり', mark: '△' }
        ]) },
      { icon: 'hand', question: '手を あげたのは 何回？', html: stepper('f-hands', { min: 0, step: 1, value: 0 }) },
      { icon: 'bulb', question: '今日 わかったことは？',
        html: `<input type="text" class="mq-input" id="f-q2" placeholder="今日いちばん分かったこと">` },
      { icon: 'note', question: 'くわしく ふり返ってみよう',
        html: `<textarea class="mq-textarea" id="f-reflection" placeholder="なにをどう学んだか、つぎにいかしたいことなど"></textarea>
          ${starterChips('f-reflection', ['今日わかったのは', 'まえとくらべて', 'むずかしかったのは', 'つぎにがんばりたいのは'])}`,
        hint: 'くわしく書くと、ふり返りボーナスの けいけんちが もらえます' }
    ];

    case 'test': {
      const units = App.data.testUnits || {};
      const testSubjects = Object.keys(units);
      return [
        { icon: 'books', question: 'なんの テスト？', html: selectField('f-tsubject', testSubjects.length ? testSubjects : SUBJECTS) },
        { icon: 'exam', question: 'どの 単元？', html: `<select class="mq-select" id="f-unit"></select>` },
        { icon: 'target', question: 'テストのまえに 立てた目標は？',
          html: `<div class="row g-3">
            <div class="col-6">${subField('知識', stepper('f-expected1', { min: 0, max: 100, step: 5 }))}</div>
            <div class="col-6">${subField('思考', stepper('f-expected2', { min: 0, max: 100, step: 5 }))}</div>
          </div>`,
          hint: '目標がないときは 0 のままでも だいじょうぶ' },
        { icon: 'score', question: 'テストの 点数は？',
          html: `<div class="row g-3">
            <div class="col-6">${subField('知識', stepper('f-score1', { min: 0, max: 100, step: 5 }))}</div>
            <div class="col-6">${subField('思考', stepper('f-score2', { min: 0, max: 100, step: 5 }))}</div>
          </div>` },
        { icon: 'note', question: 'ふり返ってみよう',
          html: `<textarea class="mq-textarea" id="f-treflection" placeholder="よくできたところ、つぎにがんばりたいところ"></textarea>
            ${starterChips('f-treflection', ['よくできたのは', 'まちがえたのは', '目標とくらべて', 'つぎのテストでは'])}` }
      ];
    }

    case 'moral': {
      const materials = App.data.moralMaterials || [];
      const materialField = materials.length
        ? selectField('f-material', materials.map(m => ({ value: m.number, label: `${m.number}. ${m.name}` })))
        : `<select class="mq-select" id="f-material"><option value="">（教材リストが未登録です）</option></select>`;
      return [
        { icon: 'book', question: 'どの おはなし？', html: materialField },
        { icon: 'comment', question: 'じぶんは どう思った？',
          html: `<textarea class="mq-textarea" id="f-thought" placeholder="どう思った？ どうしてそう思った？"></textarea>
            ${starterChips('f-thought', ['わたしは〜だと思う。なぜなら', 'もし自分だったら', '大切だと思ったのは'])}` },
        { icon: 'heart', question: '学習して 気づいたことは？',
          html: `<textarea class="mq-textarea" id="f-mreflection" placeholder="これから大切にしたいこと"></textarea>
            ${starterChips('f-mreflection', ['今日の学習で気づいたのは', 'これからは', '友だちの考えを聞いて'])}` }
      ];
    }
  }
  return [];
}

/** フォームから送信データを組み立てます */
function collectFormData(type) {
  const v = id => (document.getElementById(id) ? document.getElementById(id).value : '');
  // 押して選ぶタイプの選択肢は、えらんだ値を data-value に持っています
  const c = id => (document.getElementById(id) ? document.getElementById(id).dataset.value : '');
  switch (type) {
    case 'growth': return { content: v('f-content'), comment: v('f-gcomment') };
    case 'study': return { theme: v('f-theme'), summary: v('f-summary'), next: v('f-next') };
    case 'lesson': return {
      subject: v('f-subject'), q1: c('f-q1'), q2: v('f-q2'),
      selfEval: c('f-selfeval'), handRaises: v('f-hands'), reflection: v('f-reflection')
    };
    case 'test': return {
      subject: v('f-tsubject'), unit: v('f-unit'),
      expected1: v('f-expected1'), expected2: v('f-expected2'), score1: v('f-score1'), score2: v('f-score2'),
      reflection: v('f-treflection')
    };
    case 'moral': return { materialNumber: v('f-material'), myThought: v('f-thought'), reflection: v('f-mreflection') };
  }
  return {};
}

/** いま開いている入力フォームの状態 */
const RecordForm = { type: null, steps: [], index: 0 };

/** ③ 1問ずつ答えていく入力画面をひらきます */
function openRecordForm(type) {
  const steps = recordSteps(type);
  if (steps.length === 0) return;
  const style = RECORD_STYLES[type];
  RecordForm.type = type;
  RecordForm.steps = steps;
  RecordForm.index = 0;

  const panel = document.getElementById('p-rec-form');
  panel.innerHTML = panelHeader(style.icon, RECORD_LABELS[type], 'p-rec-group') + `
    <div class="mq-dots no-furigana" aria-hidden="true">${steps.map(() => '<i></i>').join('')}</div>
    <div class="mq-progress no-furigana" aria-hidden="true"><span id="step-progress"></span></div>
    <div class="mq-card ${style.accent}">
      <div class="mq-card-body">
        <div class="mq-steps">
          ${steps.map((s, i) => `
            <div class="mq-step" data-step="${i}">
              <div class="mq-step-question">
                <span class="q-emoji">${icon(s.icon)}</span>
                <span>${esc(s.question)}</span>
              </div>
              ${s.html}
              ${s.hint ? `<div class="mq-step-hint">${esc(s.hint)}</div>` : ''}
            </div>`).join('')}
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="button" class="mq-btn mq-btn-ghost" id="step-prev">
            ${icon('arrow-left')} まえ
          </button>
          <button type="button" class="mq-btn ${style.btn} mq-btn-lg flex-fill" id="step-next">つぎへ</button>
        </div>
      </div>
    </div>`;

  bindPanelLinks(panel);
  bindStarterChips(panel);
  bindFormWidgets(panel);
  bindRecordFormExtras(type);

  document.getElementById('step-prev').addEventListener('click', () => {
    if (RecordForm.index === 0) {
      navDrop('panel:p-rec-group');
      goPanel('p-rec-group', { back: true });
      return;
    }
    gotoStep(RecordForm.index - 1);
  });
  document.getElementById('step-next').addEventListener('click', onStepNext);

  showStep(0, false);
  goPanel('p-rec-form');
}

/** ステップを1つ表示します */
function showStep(index, back) {
  const panel = document.getElementById('p-rec-form');
  const steps = panel.querySelectorAll('.mq-step');
  steps.forEach((el, i) => {
    el.classList.remove('on', 'anim-fwd', 'anim-back');
    if (i === index) {
      void el.offsetWidth;   // アニメーションをやり直すためのリセット
      el.classList.add('on', back ? 'anim-back' : 'anim-fwd');
    }
  });
  const previous = RecordForm.index;
  RecordForm.index = index;

  // 進み具合の点。いま答えおわった点だけは「ぽん」とはじけさせます
  panel.querySelectorAll('.mq-dots i').forEach((dot, i) => {
    const done = i < index;
    const justAnswered = done && !back && i === previous;
    dot.classList.remove('just-done');
    if (justAnswered) void dot.offsetWidth;   // アニメーションをやり直すためのリセット
    dot.classList.toggle('done', done);
    dot.classList.toggle('now', i === index);
    if (justAnswered) dot.classList.add('just-done');
  });

  // のびていくバー。あと何問なのかが、数えなくても分かります
  const bar = document.getElementById('step-progress');
  if (bar) bar.style.width = `${Math.round((index / RecordForm.steps.length) * 100)}%`;

  const isLast = index === RecordForm.steps.length - 1;
  const next = document.getElementById('step-next');
  next.innerHTML = isLast
    ? icon('check') + ' きろくする'
    : 'つぎへ ' + icon('arrow-right');
  // さいしょのしつもんでは、「まえ」は「やめる」（種類えらびへ戻る）になります
  const prev = document.getElementById('step-prev');
  prev.innerHTML = index === 0
    ? 'やめる'
    : icon('arrow-left') + ' まえ';

  // いちばん上の入力欄にカーソルを置いて、すぐ書きはじめられるようにします
  const active = panel.querySelector('.mq-step.on');
  const firstInput = active && active.querySelector('input[type=text], textarea');
  if (firstInput && !('ontouchstart' in window)) firstInput.focus();
}

/** ステップを進む・戻る（範囲の外へは行きません） */
function gotoStep(index) {
  if (index < 0 || index >= RecordForm.steps.length) return;
  showStep(index, index < RecordForm.index);
}

/** 「つぎへ」を押したとき。最後のステップなら保存します */
function onStepNext() {
  const step = RecordForm.steps[RecordForm.index];
  if (step && step.require) {
    const input = document.getElementById(step.require);
    const value = input ? String(input.value).trim() : '';
    if (!value || Number(value) === 0 && input.type === 'number') {
      const panel = document.querySelector('#p-rec-form .mq-step.on');
      popElement(panel);
      toast('ここを 入れてね', 'warning');
      if (input) input.focus();
      return;
    }
  }
  if (RecordForm.index < RecordForm.steps.length - 1) {
    gotoStep(RecordForm.index + 1);
    return;
  }
  submitRecordForm(RecordForm.type, document.getElementById('step-next'));
}

/** 入力フォームの中の、種類ごとの追加のうごき（単元の連動など） */
function bindRecordFormExtras(type) {
  // ※ タイピングの目標表示はここにありました。タイピングの入力フォームを廃止したため、
  //   めあての確認とセットは「きろくを見かえす → はやさ」タブに移しています。

  // テスト: 教科 → 単元の連動
  const tsubject = document.getElementById('f-tsubject');
  if (tsubject) {
    const updateUnits = () => {
      const units = (App.data.testUnits || {})[tsubject.value] || [];
      document.getElementById('f-unit').innerHTML = units.length
        ? units.map(u => `<option>${esc(u)}</option>`).join('')
        : '<option>単元テスト</option>';
    };
    tsubject.addEventListener('change', updateUnits);
    updateUnits();
  }
}

/** 入力しおわったきろくをサーバーへ送り、おいわいの演出を出します */
async function submitRecordForm(type, btn) {
  const formData = collectFormData(type);
  const result = await busyApi(btn, 'ほぞん中', 'saveRecord', { type, formData });
  if (!result) return;   // 処理中の二重タップ
  if (!result.success) {
    Swal.fire('ほぞんできません', esc(result.message), 'warning');
    return;
  }
  App.data.records = result.records;
  App.data.missions = result.missions;
  renderTypingTab(result.records);
  renderCalcTab(result.records);
  renderReadingTab(result.records);
  renderNotesTab(result.records);
  renderLessonTab(result.records);
  renderMissions(result.missions);
  // 書いたきろくが課題だったときは、その場で「うけとる！」に変わります
  renderAssignments(result.assignments);
  renderMoreCounts();
  renderGoals();
  applyProfileGains_(result);

  // 書きおわったら「なにを きろくする？」の入口までもどします
  navDropPrefix('panel:');
  goPanel('p-rec-menu', { silent: true });

  // おいわいを読んでもらっているあいだに、うしろで最新データを取りにいきます。
  // 待ってから取りにいくと、ダイアログを閉じたあとにもう一度待たされてしまいます。
  const refreshing = refreshStudentData();

  // がんばったときほど、はでにおいわいします
  celebrate(result.personalBest || (result.achievedGoals || []).length ? 110 : 55);

  let html = `きろくしました！`;
  if (result.gainedExp > 0) html += `<br><b class="text-primary">+${result.gainedExp} EXP</b> ゲット！`;
  if (result.reflectionBonus > 0) html += `<br>✨ <b class="text-success">ふり返りがすばらしい！</b><br>（深く考えて書けたので +${result.reflectionBonus} EXP のボーナス）`;
  if (result.streakBonus) {
    html += `<br>${icon('fire')} <b class="text-warning-emphasis">${result.streakBonus.streak}日れんぞくきろく！</b>（+${result.streakBonus.exp} EXP）`;
  }
  (result.achievedGoals || []).forEach(goal => {
    html = `${icon('trophy')} <b>めあてたっせい！</b>（${esc(goal.kindLabel)}）<br>` + html;
  });
  if (result.personalBest) {
    const b = result.personalBest;
    html = `${icon('star')} <b class="text-danger">じこベスト更新！</b><br>${esc(b.label)} ${b.value}${esc(b.unit)}（まえは ${b.previous}${esc(b.unit)}）<br>` + html;
    if (b.exp > 0) html += `<br>（じこベストボーナス +${b.exp} EXP）`;
  }
  if (result.aiCoach) {
    html += `<hr class="my-2"><div class="text-start small"><b>${icon('bulb')} AIコーチから</b><br>${esc(result.aiCoach)}</div>`;
  }

  Swal.fire({ icon: 'success', title: result.personalBest ? 'きろく更新！' : 'やったね！', html })
    .then(() => (result.leveledUp ? showLevelUp(result.newLevel) : null))
    .then(() => refreshing);
}

function renderTypingTab(records) {
  const goal = records.goalData.currentGoal;
  const best = records.typingBest;
  const goalHtml = goal
    ? `<span class="badge bg-primary">${icon('target')} ${[goal.speedGoal ? `速さ ${goal.speedGoal}` : '', goal.accuracyGoal ? `正答率 ${goal.accuracyGoal}%` : ''].filter(Boolean).join(' / ')}</span>`
    : `<button class="btn btn-sm btn-outline-primary" id="typing-tab-goal-btn">目標をセット</button>`;
  const achievedHtml = records.goalData.achievedGoals.length > 0
    ? `<div class="small text-muted mt-1">たっせいした目標: ${records.goalData.achievedGoals.length}こ ${icon('trophy')}</div>` : '';

  document.getElementById('rtab-typing').innerHTML = `
    <div id="typing-send-card" class="mb-3"></div>
    <div class="alert alert-light border small">
      ${icon('keyboard')} タイピングのきろくは、<b>Typa（タイパ）</b>のきろくをおくると自動でふえるよ。
      速さは「正しく打てた数 ÷ びょう」なので、まちがえずに打つほど のびるよ。
    </div>
    <div class="card record-form-card shadow-sm mb-3">
      <div class="card-body d-flex flex-wrap gap-3 align-items-center">
        <div>${goalHtml}${achievedHtml}</div>
        ${best ? `<div class="ms-auto small">ベスト: <b class="text-danger">${best.bestSpeed} 打/秒</b> ／ 正答率 <b class="text-danger">${best.bestAccuracy}%</b></div>` : ''}

    </div>
    <div class="card record-form-card shadow-sm mb-3"><div class="card-body"><div id="typing-chart" style="width:100%;height:300px;"></div></div></div>
    <div class="card record-form-card shadow-sm"><div class="card-body p-0">${recordTable(
      ['日付', '速さ(打/秒)', '正答率(%)'],
      records.typing.map(r => [r.date, r.speed, r.accuracy]))}</div></div>`;
  const goalBtn = document.getElementById('typing-tab-goal-btn');
  if (goalBtn) goalBtn.addEventListener('click', () => openGoalDialog('typing'));
  renderStudySendPanels();
  if (isShown_('rtab-typing')) drawTypingChart(records.typingChart);

      <div class="small text-muted">めあて: ${esc(r.q1 || '-')} ／ 主体性: ${esc(r.selfEval || '-')} ／ 挙手: ${esc(String(r.handRaises || 0))}回</div>
      ${r.aiCoach ? `<div class="small bg-light rounded p-2 mt-1">${icon('bulb')} AIコーチから: ${esc(r.aiCoach)}</div>` : ''}
    </div></div>`).join('') || emptyMessage('まだきろくがありません');
  const goalDiffBadge = (score, expected) => {
    if (score === '' || score === null || expected === '' || expected === null) return '';
    const d = Number(score) - Number(expected);
    if (isNaN(d)) return '';
    const cls = d >= 0 ? 'bg-success' : 'bg-danger';
    return ` <span class="badge ${cls}" title="目標 ${esc(String(expected))}点">目標${d > 0 ? '+' : ''}${d}</span>`;
  };
  const testHtml = records.test.map(r => `
    <div class="card record-form-card shadow-sm mb-2"><div class="card-body py-2">
      <div class="d-flex justify-content-between"><b>${icon('exam')} ${esc(r.subject)} / ${esc(r.unit)}</b><span class="small text-muted">${r.date}</span></div>
      <div class="small">点数: <b>${esc(String(r.score1 ?? ''))}</b>${goalDiffBadge(r.score1, r.expected1)}${r.score2 !== '' && r.score2 !== null ? ` ・ <b>${esc(String(r.score2))}</b>${goalDiffBadge(r.score2, r.expected2)}` : ''}</div>
      ${r.reflection ? `<div class="small">${esc(r.reflection)}</div>` : ''}
      ${r.aiCoach ? `<div class="small bg-light rounded p-2 mt-1">${icon('bulb')} AIコーチから: ${esc(r.aiCoach)}</div>` : ''}
    </div></div>`).join('') || emptyMessage('まだきろくがありません');
  const moralHtml = records.moral.map(r => `
    <div class="card record-form-card shadow-sm mb-2"><div class="card-body py-2">
      <div class="d-flex justify-content-between"><b>${icon('heart')} ${esc(r.materialName)}</b><span class="small text-muted">${r.date}</span></div>
      <div class="small">${esc(r.myThought)}</div>
      ${r.feedback ? `<div class="small bg-light rounded p-2 mt-1">${icon('comment')} 先生AIから: ${esc(r.feedback)}</div>` : ''}
    </div></div>`).join('') || emptyMessage('まだきろくがありません');
  document.getElementById('rtab-lesson').innerHTML = `
    <div class="row g-3">
      <div class="col-lg-4"><h6 class="fw-bold text-primary">✍️ じゅぎょうのふり返り</h6>${lessonHtml}</div>
      <div class="col-lg-4"><h6 class="fw-bold text-danger">${icon('exam')} テストのふり返り</h6>
        <div class="card record-form-card shadow-sm mb-2"><div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="fw-bold mb-0 small">点数と目標のグラフ</h6><div id="test-chart-selector"></div>
          </div>
          <div id="test-chart" style="width:100%;height:260px;"></div>
        </div></div>
        ${testHtml}</div>
      <div class="col-lg-4"><h6 class="fw-bold" style="color:#d63384;">${icon('heart')} どうとくノート</h6>${moralHtml}</div>
    </div>`;
  if (isShown_('rtab-lesson')) drawTestChart(records.test);
}

function recordTable(headers, rows) {
  if (rows.length === 0) return emptyMessage('まだきろくがありません');
  return `<div class="table-responsive custom-scrollbar" style="max-height:380px;">
    <table class="table table-striped table-sm table-record mb-0">
      <thead class="table-light sticky-top"><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}</tbody>

function drawTypingChart(chartData) {

  if (!chartsReadyOrLoad_(() => drawTypingChart(chartData))) return;
  const el = document.getElementById('typing-chart');

function drawCalcChart(chartDataByQuestions) {
  if (!chartDataByQuestions) return;
  if (!chartsReadyOrLoad_(() => drawCalcChart(chartDataByQuestions))) return;
  const el = document.getElementById('calc-chart');
  const selectorArea = document.getElementById('calc-chart-selector');
  if (!el || !selectorArea) return;
  const keys = Object.keys(chartDataByQuestions);
  if (keys.length === 0) { el.innerHTML = emptyMessage('グラフにできるきろくがまだありません'); return; }

  if (!selectorArea.querySelector('select')) {
    selectorArea.innerHTML = `<select class="form-select form-select-sm" id="calc-q-select">

  }

  const data = google.visualization.arrayToDataTable(chartDataByQuestions[selected]);
