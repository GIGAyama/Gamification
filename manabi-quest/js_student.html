<script>
/* =====================================================================
 * js_student.html — 児童用ビュー
 * ===================================================================== */

let chartsReady = false;
google.charts.load('current', { packages: ['corechart'], language: 'ja' });
google.charts.setOnLoadCallback(() => { chartsReady = true; });

function initStudentApp(data) {
  renderStudentHeader(data.profile);
  renderHome(data);
  renderRecordsView(data);
  renderQuestView(data);
  renderPlazaView(data);
  bindStudentEvents();

  // 学習ポータル（iframe の親ページ）からの通知でパネルを更新する
  Portal.onUpdate = () => renderStudySendPanels();
  Portal.onResult = handlePortalSendResult;

  if (data.bonusApplied) {
    Swal.fire({
      icon: 'success', title: 'ログインボーナス！',
      html: `今日もよく来たね！<br><b>+${data.bonusPoints} EXP</b> ゲット！`,
      confirmButtonText: 'やったー！'
    }).then(() => showNewBadges(data.newlyAwardedBadges));
  } else {
    showNewBadges(data.newlyAwardedBadges);
  }
}

function showNewBadges(badges) {
  if (!badges || badges.length === 0) return;
  const names = badges.map(b => `「${esc(b.name)}」`).join('・');
  Swal.fire({
    icon: 'success', title: 'あたらしいバッジ！',
    html: `${names} を手に入れました！<br><span class="text-muted small">ホームのバッジらんを見てみよう</span>`
  });
}

/* ---------------- ヘッダー・ホーム ---------------- */

function renderStudentHeader(profile) {
  document.getElementById('nav-nickname').textContent = profile.nickname;
  document.getElementById('nav-level').textContent = profile.level;
}

function renderHome(data) {
  const p = data.profile;
  document.getElementById('home-nickname').textContent = p.nickname;
  document.getElementById('home-level').textContent = p.level;
  document.getElementById('home-exp').textContent = p.exp;
  document.getElementById('home-exchange').textContent = p.exchangePoints;
  document.getElementById('home-progress-text').textContent = `${p.currentLevelExp} / ${p.nextLevelExp}`;
  document.getElementById('home-progress-bar').style.width = `${p.progress}%`;
  const motto = data.userProfile && data.userProfile.motto;
  document.getElementById('home-motto').textContent = motto ? `「${motto}」` : '';

  renderAvatar(document.getElementById('home-avatar'), data.avatar, data.allItems);
  renderStudySendPanels();
  renderMissions(data.missions);
  renderAnnouncements('home-announcements', data.announcements, false);
  renderActivity(data.recentActivity);
  renderBadges(data.badges, data.allBadges);

  // 成長の可視化・めあて・ふり返りの循環
  renderStreak();
  renderCalendar();
  renderGoals();
  renderWeeklyCard();
  renderGrowthCard();
  renderTotals();
  renderFlashback();
}

/* ---------------- 成長の可視化 ---------------- */

/** ホームのデータのうち、集計まわりをまとめて取り出します */
function insights() {
  return (App.data && App.data.insights) || {};
}

/**
 * 連続きろく日数。毎日の積み重ねが一番見えるところなので、ホームの上のほうに出します。
 */
function renderStreak() {
  const el = document.getElementById('home-streak');
  if (!el) return;
  const cal = insights().calendar || {};
  const streak = cal.streak || 0;
  if (streak <= 0) {
    el.innerHTML = `<div class="streak-badge cold"><span>今日、何か1つきろくしてみよう！</span></div>`;
    return;
  }
  const best = (cal.longestStreak || 0) > streak
    ? `<div class="small text-muted text-center mt-1">さいちょう記録は ${cal.longestStreak}日</div>` : '';
  el.innerHTML = `
    <div class="streak-badge"><span>🔥</span><span>${streak}日れんぞくきろく中！</span></div>${best}`;
}

/**
 * がんばりカレンダー（学習ヒートマップ）。
 * 1列が1週間で、上から日〜土。色が濃いほどその日のきろくが多いことを表します。
 */
function renderCalendar() {
  const el = document.getElementById('home-calendar');
  if (!el) return;
  const cal = insights().calendar;
  if (!cal || !cal.weeks || cal.weeks.length === 0) {
    el.innerHTML = emptyMessage('まだきろくがありません');
    return;
  }
  const cells = cal.weeks.map(week => `
    <div class="heatmap-week">
      ${week.map(day => {
        if (day.count < 0) return `<div class="heatmap-day future"></div>`;
        const title = day.count > 0 ? `${day.label} きろく${day.count}件` : `${day.label} きろくなし`;
        return `<div class="heatmap-day lv${day.level}" title="${esc(title)}"></div>`;
      }).join('')}
    </div>`).join('');

  el.innerHTML = `
    <div class="heatmap mb-2 no-furigana">${cells}</div>
    <div class="d-flex flex-wrap align-items-center gap-3">
      <div class="small text-muted">
        きろくした日 <b class="text-success">${cal.activeDays}日</b> ／ ぜんぶで <b class="text-success">${cal.totalRecords}件</b>
      </div>
      <div class="heatmap-legend ms-auto no-furigana">
        <span>すくない</span>
        <div class="heatmap-day lv1"></div><div class="heatmap-day lv2"></div>
        <div class="heatmap-day lv3"></div><div class="heatmap-day lv4"></div>
        <span>おおい</span>
      </div>
    </div>`;
}

/** わたしの成長カード（今月 vs 先月） */
function renderGrowthCard() {
  const el = document.getElementById('home-growth-card');
  if (!el) return;
  const card = insights().growthCard;
  if (!card) { el.innerHTML = emptyMessage('まだきろくがありません'); return; }

  const arrow = row => row.trend === 'up' ? '▲' : (row.trend === 'down' ? '▼' : '－');
  const diffText = row => {
    if (row.trend === 'same') return 'おなじ';
    const sign = row.diff > 0 ? '+' : '';
    return `${sign}${row.diff}${row.unit}`;
  };
  el.innerHTML = `
    <div class="alert alert-info py-2 mb-3">${esc(card.headline)}</div>
    <div class="d-flex small text-muted fw-bold mb-1">
      <div class="flex-fill"></div>
      <div style="width:5.5rem;" class="text-end">${esc(card.prevLabel)}</div>
      <div style="width:5.5rem;" class="text-end">${esc(card.thisLabel)}</div>
      <div style="width:5.5rem;" class="text-end">かわった分</div>
    </div>
    ${card.rows.map(row => `
      <div class="growth-row">
        <div class="growth-label">${esc(row.label)}</div>
        <div style="width:5.5rem;" class="text-end text-muted small">${row.prev}${esc(row.unit)}</div>
        <div style="width:5.5rem;" class="text-end growth-value">${row.now}${esc(row.unit)}</div>
        <div style="width:5.5rem;" class="text-end growth-diff ${row.trend} no-furigana">${arrow(row)} ${esc(diffText(row))}</div>
      </div>`).join('')}`;
}

/** 学びの総量メーター（実感しやすい単位に置きかえて見せます） */
function renderTotals() {
  const el = document.getElementById('home-totals');
  if (!el) return;
  const totals = insights().totals;
  if (!totals || totals.length === 0) { el.innerHTML = emptyMessage('まだきろくがありません'); return; }
  el.innerHTML = totals.map(item => `
    <div class="total-item">
      <span class="total-icon no-furigana">${item.icon}</span>
      <div class="flex-grow-1">
        <div class="small text-muted">${esc(item.label)}</div>
        ${item.note ? `<div class="small text-secondary">${esc(item.note)}</div>` : ''}
      </div>
      <div class="total-value text-primary">${item.value}<span class="small fw-normal text-muted">${esc(item.unit)}</span></div>
    </div>`).join('');
}

/** ホームに1枚だけ出す「むかしの自分」のふり返り */
function renderFlashback() {
  const el = document.getElementById('home-flashback');
  if (!el) return;
  const entry = insights().flashback;
  if (!entry) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="card shadow-sm border-0 rounded-4 flashback-card">
      <div class="card-body">
        <div class="small fw-bold text-warning-emphasis mb-1">
          <i class="bi bi-hourglass-split"></i> ${esc(entry.agoLabel)}のあなた（${esc(entry.date)} ${esc(entry.source)}）
        </div>
        <div>${esc(entry.text)}</div>
        <div class="small text-muted mt-2">あのころとくらべて、できるようになったことはあるかな？</div>
      </div>
    </div>`;
}

/* ---------------- めあて（目標）とふり返りの循環 ---------------- */

function goalData() {
  return (App.data && App.data.records && App.data.records.goalData) || { activeGoals: [], achievedGoals: [] };
}

/**
 * 「わたしのめあて」。進捗はきろくから自動で計算されるので、児童は入力しません。
 * 自由記述のめあてだけは自分で「できた！」を押します。
 */
function renderGoals() {
  const el = document.getElementById('home-goals');
  if (!el) return;
  const data = goalData();
  const active = data.activeGoals || [];
  const rate = data.achievement || { achieved: 0, rate: 0 };

  const summary = `
    <div class="small text-muted mb-2">
      たっせいしためあて <b class="text-danger">${rate.achieved}こ</b>
      ${rate.total > 0 ? `／ たっせい率 <b class="text-danger">${rate.rate}%</b>` : ''}
    </div>`;

  if (active.length === 0) {
    el.innerHTML = summary + emptyMessage('いま挑戦中のめあてはありません。「めあてを立てる」から決めてみよう！');
    return;
  }

  el.innerHTML = summary + active.map(goal => {
    if (goal.manual) {
      return `
        <div class="border rounded-3 p-2 mb-2">
          <div class="d-flex align-items-center gap-2">
            <div class="flex-grow-1">
              <div class="small text-muted">${esc(goal.period)}のめあて</div>
              <div class="fw-bold">${esc(goal.memo || goal.kindLabel)}</div>
            </div>
            <button class="btn btn-sm btn-danger" data-goal-done="${goal.row}">できた！</button>
          </div>
        </div>`;
    }
    const target = goal.kind === 'typing' ? goal.speedGoal : goal.target;
    const percent = goal.percent === null ? 0 : goal.percent;
    return `
      <div class="border rounded-3 p-2 mb-2">
        <div class="d-flex align-items-center small mb-1">
          <span class="fw-bold">${esc(goal.kindLabel)}</span>
          <span class="text-muted ms-2">（${esc(goal.period)}）</span>
          <span class="ms-auto fw-bold ${percent >= 100 ? 'text-success' : 'text-danger'}">
            ${goal.current}${esc(goal.unit)} / ${target}${esc(goal.unit)}
          </span>
        </div>
        <div class="progress" style="height:10px;">
          <div class="progress-bar ${percent >= 100 ? 'bg-success' : 'bg-danger'}" style="width:${percent}%"></div>
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('[data-goal-done]').forEach(btn => {
    btn.addEventListener('click', () => completeGoal(Number(btn.dataset.goalDone)));
  });
}

/** 自由記述のめあてを「できた！」にします */
async function completeGoal(row) {
  const confirmed = await Swal.fire({
    icon: 'question', title: 'めあて たっせい？',
    text: 'このめあては できましたか？',
    showCancelButton: true, confirmButtonText: 'できた！', cancelButtonText: 'まだ'
  });
  if (!confirmed.isConfirmed) return;
  const res = await apiWithLoading('ほぞん中...', 'completeManualGoal', row);
  if (!res.success) { Swal.fire('できません', esc(res.message), 'warning'); return; }
  App.data.records.goalData = res.goalData;
  App.data.missions = res.missions;
  renderGoals();
  renderMissions(res.missions);
  Swal.fire({ icon: 'success', title: 'やったね！', html: `めあてたっせい！<br><b class="text-primary">+${res.gainedExp} EXP</b>` });
}

/**
 * めあてを立てるダイアログ。種類をえらぶと入力欄が切りかわります。
 */
function openGoalDialog(presetKind) {
  const kinds = (App.data && App.data.goalKinds) || [{ key: 'typing', label: 'タイピングの速さ', unit: '打/秒', manual: false }];
  const options = kinds.map(k => `<option value="${esc(k.key)}">${esc(k.label)}</option>`).join('');

  Swal.fire({
    title: '🎯 めあてを立てよう',
    html: `
      <div class="text-start">
        <label class="form-label small fw-bold">なにをがんばる？</label>
        <select id="goal-kind" class="form-select mb-2">${options}</select>
        <label class="form-label small fw-bold">いつまで？</label>
        <select id="goal-period" class="form-select mb-2">
          <option value="週">今週</option>
          <option value="月">今月</option>
        </select>
        <div id="goal-fields"></div>
      </div>`,
    showCancelButton: true, confirmButtonText: 'セットする', cancelButtonText: 'やめる',
    didOpen: () => {
      const kindSelect = document.getElementById('goal-kind');
      if (presetKind) kindSelect.value = presetKind;
      const fields = document.getElementById('goal-fields');
      const update = () => {
        const kind = kindSelect.value;
        const def = kinds.filter(k => k.key === kind)[0] || {};
        if (kind === 'free') {
          fields.innerHTML = `
            <label class="form-label small fw-bold">めあて（じぶんのことばで）</label>
            <input type="text" id="goal-memo" class="form-control" maxlength="100" placeholder="例: 音読を毎日つづける">`;
        } else if (kind === 'typing') {
          fields.innerHTML = `
            <label class="form-label small fw-bold">速さの目標（打/秒）</label>
            <input type="number" id="goal-speed" class="form-control mb-2" min="0" step="0.1" placeholder="例: 2.5">
            <label class="form-label small fw-bold">正答率の目標（%）</label>
            <input type="number" id="goal-accuracy" class="form-control" min="0" max="100" placeholder="例: 95">`;
        } else {
          fields.innerHTML = `
            <label class="form-label small fw-bold">いくつ？（${esc(def.unit || '')}）</label>
            <input type="number" id="goal-target" class="form-control" min="1" step="1" placeholder="例: 5">`;
        }
      };
      kindSelect.addEventListener('change', update);
      update();
    },
    preConfirm: () => {
      const value = el => { const node = document.getElementById(el); return node ? node.value : ''; };
      return {
        kind: value('goal-kind'),
        period: value('goal-period'),
        memo: value('goal-memo'),
        target: value('goal-target'),
        speedGoal: value('goal-speed'),
        accuracyGoal: value('goal-accuracy')
      };
    }
  }).then(async result => {
    if (!result.isConfirmed) return;
    const res = await apiWithLoading('セット中...', 'saveGoal', result.value);
    if (!res.success) { Swal.fire('セットできません', esc(res.message), 'warning'); return; }
    App.data.records.goalData = res.goalData;
    App.data.missions = res.missions;
    toast(res.message);
    renderGoals();
    renderMissions(res.missions);
    renderTypingTab(App.data.records);
  });
}

/**
 * 今週のふり返りカード。書いていない週の後半（木曜以降）に目立たせます。
 */
function renderWeeklyCard() {
  const el = document.getElementById('home-weekly-card');
  if (!el) return;
  const weekly = insights().weekly;
  if (!weekly) { el.innerHTML = ''; return; }

  if (weekly.done) {
    el.innerHTML = `
      <div class="alert alert-success mb-0 d-flex align-items-center gap-2">
        <span class="no-furigana">✅</span>
        <div class="flex-grow-1">今週のふり返りは書けています。えらい！</div>
        <button class="btn btn-sm btn-outline-success" id="weekly-history-btn">これまでのふり返り</button>
      </div>`;
  } else {
    const s = weekly.summary || {};
    el.innerHTML = `
      <div class="card shadow-sm border-0 rounded-4 ${weekly.due ? 'border-start border-4 border-warning' : ''}">
        <div class="card-body">
          <h5 class="fw-bold text-warning-emphasis mb-2"><i class="bi bi-journal-check"></i> 今週のふり返り</h5>
          <div class="small text-muted mb-2">
            今週は きろく <b>${s.records || 0}件</b>／きろくした日 <b>${s.activeDays || 0}日</b>
            ${s.newRecords > 0 ? `／じこベスト更新 <b class="text-danger">${s.newRecords}回</b>` : ''}
            ${s.achievedGoals > 0 ? `／めあてたっせい <b class="text-danger">${s.achievedGoals}こ</b>` : ''}
          </div>
          <button class="btn btn-warning fw-bold" id="weekly-write-btn">
            <i class="bi bi-pencil"></i> 今週をふり返る
          </button>
          <button class="btn btn-outline-secondary ms-2" id="weekly-history-btn">これまでのふり返り</button>
        </div>
      </div>`;
    const writeBtn = document.getElementById('weekly-write-btn');
    if (writeBtn) writeBtn.addEventListener('click', openWeeklyReflectionDialog);
  }
  const historyBtn = document.getElementById('weekly-history-btn');
  if (historyBtn) historyBtn.addEventListener('click', showWeeklyHistory);
}

/** 週のまとめを見せたうえで、3つの質問に答えてもらいます */
function openWeeklyReflectionDialog() {
  const weekly = insights().weekly || {};
  const s = weekly.summary || {};
  Swal.fire({
    title: '今週のふり返り',
    width: 640,
    html: `
      <div class="text-start">
        <div class="alert alert-light border small mb-3">
          今週のあなた: きろく <b>${s.records || 0}件</b>（${s.activeDays || 0}日）
          ／ 読んだページ <b>${s.readingPages || 0}</b>
          ／ 学習アプリ <b>${s.appMinutes || 0}分</b>
          ${s.streak > 0 ? `<br>🔥 いま <b>${s.streak}日</b> れんぞくきろく中！` : ''}
        </div>
        <label class="form-label small fw-bold">① 今週できるようになったことは？</label>
        <textarea id="weekly-learned" class="form-control mb-2" rows="2" maxlength="300"></textarea>
        <label class="form-label small fw-bold">② むずかしかったことは？</label>
        <textarea id="weekly-hard" class="form-control mb-2" rows="2" maxlength="300"></textarea>
        <label class="form-label small fw-bold">③ 来週のめあては？（そのまま「めあて」になります）</label>
        <input type="text" id="weekly-next" class="form-control" maxlength="100">
      </div>`,
    showCancelButton: true, confirmButtonText: 'かきおわった', cancelButtonText: 'あとで',
    preConfirm: () => ({
      learned: document.getElementById('weekly-learned').value,
      hard: document.getElementById('weekly-hard').value,
      nextGoal: document.getElementById('weekly-next').value
    })
  }).then(async result => {
    if (!result.isConfirmed) return;
    const res = await apiWithLoading('ほぞん中...', 'saveWeeklyReflection', result.value);
    if (!res.success) { Swal.fire('ほぞんできません', esc(res.message), 'warning'); return; }

    App.data.insights = App.data.insights || {};
    App.data.insights.weekly = res.weekly;
    App.data.records.goalData = res.goalData;
    App.data.missions = res.missions;
    renderWeeklyCard();
    renderGoals();
    renderMissions(res.missions);

    let html = `今週のふり返りを書きました！<br><b class="text-primary">+${res.gainedExp} EXP</b>`;
    if (res.goalRegistered) html += `<br>🎯 来週のめあてをセットしました`;
    Swal.fire({ icon: 'success', title: 'よくがんばりました！', html }).then(() => {
      if (res.leveledUp) {
        Swal.fire({ icon: 'success', title: '🎉 レベルアップ！', html: `<b>レベル ${res.newLevel}</b> になりました！` });
      }
    });
  });
}

/** これまでの週次ふり返りを一覧で見せます */
function showWeeklyHistory() {
  const weekly = insights().weekly || {};
  const history = weekly.history || [];
  Swal.fire({
    title: 'これまでのふり返り',
    width: 640,
    html: history.length === 0
      ? '<p class="text-muted">まだありません。</p>'
      : `<div class="text-start">${history.map(h => `
          <div class="card album-card shadow-sm mb-2"><div class="card-body p-3">
            <div class="small text-muted">${esc(h.date)} の週</div>
            ${h.learned ? `<div><b>できたこと:</b> ${esc(h.learned)}</div>` : ''}
            ${h.hard ? `<div><b>むずかしかったこと:</b> ${esc(h.hard)}</div>` : ''}
            ${h.nextGoal ? `<div><b>次のめあて:</b> ${esc(h.nextGoal)}</div>` : ''}
          </div></div>`).join('')}</div>`,
    confirmButtonText: 'とじる'
  });
}

/* ---------------- 学習アプリのきろくを おくる ---------------- */

/**
 * 「きろくをおくる」パネル。
 * ポータル（gigayama.github.io）の iframe 内で開かれているときは、この画面のボタンから
 * 親ページに送信を依頼できます（学習アプリの localStorage は同一オリジンの親しか読めないため）。
 * 直接Webアプリを開いているときは、ポータルへの案内を表示します。
 */
function studySendPanelHtml() {
  // 受信は学習ポータル経由でいつでもできるので、「先生の受け取り設定待ち」の状態はありません
  const s = (App.data && App.data.studyApp) || {};

  const rewards = [];
  if (s.bonusExp > 0) rewards.push(`<span class="reward-chip text-primary">そうしんボーナス +${s.bonusExp} EXP</span>`);
  if (s.bonusStreakExp > 0) rewards.push(`<span class="reward-chip text-danger">れんぞく${s.nextStreak}日目 +${s.bonusStreakExp} EXP</span>`);
  if (s.bonusPoints > 0) rewards.push(`<span class="reward-chip text-warning-emphasis">交換Pt +${s.bonusPoints}</span>`);
  const rewardHtml = rewards.length
    ? `<div class="mt-2">${rewards.join('')}</div>`
    : `<div class="mt-2 small text-muted">今日はもうボーナスをもらったよ。きろくぶんのEXPはこのあともふえるよ！</div>`;
  const streakHtml = s.streak > 0
    ? `<span class="badge bg-danger ms-2">🔥 ${s.streak}日れんぞく</span>` : '';

  // ① ポータルの中にいる → その場で送信できる
  if (Portal.embedded && Portal.connected) {
    if (Portal.sending) {
      return `<div class="card send-card"><div class="card-body d-flex align-items-center gap-3">
        <div class="spinner-border text-primary"></div>
        <div class="fw-bold">きろくを おくっています…</div>
      </div></div>`;
    }
    if (Portal.pending > 0) {
      // 出席番号はログイン中のアカウントから分かる（notifyPortalIdentity でポータルに伝えています）。
      // 入力をお願いするのは、それが分からなかったときだけです。

/** ポータルから送信結果を受け取ったときの演出とデータ更新 */
function handlePortalSendResult(msg) {
  renderStudySendPanels();
  if (!msg.ok) {
    Swal.fire('おくれませんでした', esc(msg.message || 'もういちど ためしてね。'), 'warning');
    return;
  }
  if (!msg.saved) {
    // 受信側がまだ対応していないきろく（仕様 §9.3 の一時エラー）は端末に残してあります。
    // 「なかった」と伝えると気づかれないまま たまり続けるので、分けて知らせます。
    if (msg.kept > 0) {
      toast(`${msg.kept}件は まだ おくれません。きろくは のこしてあるので、先生に つたえてね`, 'warning');
    } else {
      toast('あたらしいきろくは ありませんでした', 'info');
    }
    return;
  }

  const r = msg.reward || {};
  const lines = [`<b>${msg.saved}件</b>の きろくを おくりました！`];
  if (r.calcRecords > 0) lines.push(`🧮 100マス計算 <b>${r.calcRecords}回分</b> がきろくされたよ`);
  if (msg.gainedExp > 0) lines.push(`<b class="text-primary fs-5">+${msg.gainedExp} EXP</b> ゲット！`);
  const detail = [];
  if (r.appExp > 0) detail.push(`学習時間 +${r.appExp}`);
  if (r.calcExp > 0) detail.push(`100マスの点数 +${r.calcExp}`);
  if (r.sendExp > 0) detail.push(`そうしんボーナス +${r.sendExp}`);
  if (r.streakExp > 0) detail.push(`れんぞく${r.streak}日目 +${r.streakExp}`);
  if (r.personalBestExp > 0) detail.push(`じこベスト +${r.personalBestExp}`);
  if (r.recordStreakExp > 0) detail.push(`${r.recordStreak}日れんぞくきろく +${r.recordStreakExp}`);
  if (detail.length > 0) lines.push(`<span class="small text-muted">（${detail.join(' / ')}）</span>`);
  if (r.exchangePoints > 0) lines.push(`🎁 交換ポイント <b>+${r.exchangePoints}</b>`);
  if (msg.duplicate > 0) lines.push(`<span class="small text-muted">${msg.duplicate}件は おくりずみでした</span>`);
  if (msg.kept > 0) lines.push(`<span class="small text-warning">${msg.kept}件は まだ おくれません（きろくは のこしてあります）</span>`);
  if (msg.personalBest) {
    const b = msg.personalBest;
    lines.unshift(`🌟 <b class="text-danger">じこベスト更新！</b> ${esc(b.label)} ${b.value}${esc(b.unit)}（まえは ${b.previous}${esc(b.unit)}）`);
  }

  Swal.fire({ icon: 'success', title: msg.personalBest ? 'きろく更新！' : 'やったね！', html: lines.join('<br>') }).then(() => {
    if (msg.leveledUp) {
      Swal.fire({ icon: 'success', title: '🎉 レベルアップ！', html: `<b>レベル ${msg.level}</b> になりました！` })
        .then(refreshStudentData);
    } else {
      refreshStudentData();
    }
  });
}

/**
 * 教科ごとのとりくみを表すレーダーチャート。
 * Google Charts にレーダーがないため、SVG を自前で組み立てています。
 */
function drawRadarChart(containerId, axes) {
  const container = document.getElementById(containerId);
  if (!container || axes.length < 3) return;

  const size = 320, center = size / 2, radius = size / 2 - 46;
  const angleFor = i => (Math.PI * 2 * i / axes.length) - Math.PI / 2;
  const pointAt = (i, ratio) => {
    const angle = angleFor(i);
    return [center + Math.cos(angle) * radius * ratio, center + Math.sin(angle) * radius * ratio];
  };

  // 外枠のグリッド（4段階）
  const grids = [0.25, 0.5, 0.75, 1].map(ratio => {
    const points = axes.map((a, i) => pointAt(i, ratio).join(',')).join(' ');
    return `<polygon class="radar-grid" points="${points}"></polygon>`;
  }).join('');

  const spokes = axes.map((a, i) => {
    const [x, y] = pointAt(i, 1);
    return `<line class="radar-axis" x1="${center}" y1="${center}" x2="${x}" y2="${y}"></line>`;
  }).join('');

  const area = `<polygon class="radar-area" points="${
    axes.map((a, i) => pointAt(i, Math.max(0.02, a.value / 100)).join(',')).join(' ')
  }"></polygon>`;

  const labels = axes.map((a, i) => {
    const [x, y] = pointAt(i, 1.18);
    const anchor = Math.abs(x - center) < 8 ? 'middle' : (x > center ? 'start' : 'end');
    return `<text class="radar-label" x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle">${esc(a.subject)}</text>`;
  }).join('');

  container.innerHTML =
    `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="教科ごとのとりくみ">${grids}${spokes}${area}${labels}</svg>`;
}

/** ふり返り入力の「書き出しヒント」チップ群を生成します */
function starterChips(targetId, phrases) {
  return `<div class="starter-chips mt-1" data-starter-for="${targetId}">
    <span class="small text-muted me-1"><i class="bi bi-lightbulb"></i> かきだしのヒント:</span>
    ${phrases.map(p => `<button type="button" class="btn btn-sm btn-outline-secondary starter-chip py-0 px-2 mb-1 me-1" data-phrase="${esc(p)}">${esc(p)}…</button>`).join('')}
  </div>`;
}

/** 書き出しヒントのクリックで、対象のふり返り欄に文言を挿入します */
function bindStarterChips(area) {
  area.querySelectorAll('.starter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const wrap = chip.closest('.starter-chips');
      const ta = wrap && document.getElementById(wrap.dataset.starterFor);
      if (!ta) return;
      const sep = ta.value.trim().length ? '\n' : '';
      ta.value = ta.value.replace(/\s+$/, '') + sep + chip.dataset.phrase;
      ta.focus();
    });
  });
}

/** フォームから送信データを組み立てます */
function collectFormData(type) {
  const v = id => (document.getElementById(id) ? document.getElementById(id).value : '');
  switch (type) {
    case 'typing': return { correct: v('f-correct'), total: v('f-total'), time: v('f-time') };
    case 'reading': return {
      title: v('f-title'), genre: v('f-genre'), pages: v('f-pages'),
      rating: document.getElementById('f-rating').dataset.value, comment: v('f-comment')
    };
    case 'growth': return { content: v('f-content'), comment: v('f-gcomment') };
    case 'study': return { theme: v('f-theme'), summary: v('f-summary'), next: v('f-next') };
    case 'lesson': return {
      subject: v('f-subject'), q1: v('f-q1'), q2: v('f-q2'),
      selfEval: v('f-selfeval'), handRaises: v('f-hands'), reflection: v('f-reflection')
    };
    case 'test': return {
      subject: v('f-tsubject'), unit: v('f-unit'),
      expected1: v('f-expected1'), expected2: v('f-expected2'), score1: v('f-score1'), score2: v('f-score2'),
      reflection: v('f-treflection')
    };
    case 'moral': return { materialNumber: v('f-material'), myThought: v('f-thought'), reflection: v('f-mreflection') };
  }
  return {};
}

const RECORD_LABELS = {
  typing: 'タイピング', reading: 'どくしょ', growth: 'せいちょうのきろく',
  study: 'じしゅ学習', lesson: 'じゅぎょうのふり返り', test: 'テストのふり返り', moral: 'どうとくノート'
};

/** 入力フォームを閉じます（「やめる」・保存完了・「戻る」操作から呼びます） */
function closeRecordForm(fromBack) {
  const area = document.getElementById('record-form-area');
  if (area) area.innerHTML = '';
  if (!fromBack) navDrop('record-form');
}

function openRecordForm(type) {
  const area = document.getElementById('record-form-area');
  // 「戻る」でフォームを閉じられるようにする
  navPush('record-form', () => closeRecordForm(true));
  area.innerHTML = `
    <div class="card record-form-card shadow-sm">
      <div class="card-header text-success"><i class="bi bi-pencil"></i> ${RECORD_LABELS[type]}のきろく</div>
      <div class="card-body">
        ${recordFormHtml(type)}
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-success fw-bold flex-fill" id="record-submit-btn"><i class="bi bi-check-circle"></i> きろくする</button>
          <button class="btn btn-outline-secondary" id="record-cancel-btn">やめる</button>
        </div>
      </div>
    </div>`;
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
  bindStarterChips(area);

  // タイピング: 目標表示 + 目標セットボタン
  if (type === 'typing') {
    const goalInfo = document.getElementById('typing-goal-info');
    const goal = App.data.records.goalData.currentGoal;
    if (goal) {
      const parts = [];
      if (goal.speedGoal) parts.push(`速さ ${goal.speedGoal} 打/秒`);
      if (goal.accuracyGoal) parts.push(`正答率 ${goal.accuracyGoal}%`);
      goalInfo.innerHTML = `🎯 いまの目標: <b>${parts.join(' ・ ')}</b>`;
    } else {
      goalInfo.innerHTML = `🎯 目標がまだありません。 <button class="btn btn-sm btn-outline-primary" id="set-goal-btn">目標をセットする</button>`;
      const btn = document.getElementById('set-goal-btn');
      if (btn) btn.addEventListener('click', () => openGoalDialog('typing'));
    }
  }

  // 読書: 星評価
  const rating = document.getElementById('f-rating');
  if (rating) {
    const update = value => {
      rating.dataset.value = value;
      rating.querySelectorAll('.star').forEach(star => {
        star.classList.toggle('off', Number(star.dataset.star) > value);
      });
    };
    rating.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => update(Number(star.dataset.star)));
    });
    update(3);
  }

  // テスト: 教科 → 単元の連動
  const tsubject = document.getElementById('f-tsubject');
  if (tsubject) {
    const updateUnits = () => {
      const units = (App.data.testUnits || {})[tsubject.value] || [];
      document.getElementById('f-unit').innerHTML = units.length
        ? units.map(u => `<option>${esc(u)}</option>`).join('')
        : '<option>単元テスト</option>';
    };
    tsubject.addEventListener('change', updateUnits);
    updateUnits();
  }

  document.getElementById('record-cancel-btn').addEventListener('click', () => closeRecordForm(false));
  document.getElementById('record-submit-btn').addEventListener('click', async () => {
    const formData = collectFormData(type);
    const result = await apiWithLoading('ほぞん中...', 'saveRecord', { type, formData });
    if (!result.success) {
      Swal.fire('ほぞんできません', esc(result.message), 'warning');
      return;
    }
    closeRecordForm(false);
    App.data.records = result.records;
    App.data.missions = result.missions;
    renderTypingTab(result.records);
    renderCalcTab(result.records);
    renderReadingTab(result.records);
    renderNotesTab(result.records);
    renderLessonTab(result.records);
    renderMissions(result.missions);
    renderGoals();
    if (result.newExp !== null && result.newExp !== undefined) {
      App.data.profile.exp = result.newExp;
      App.data.profile.totalExp = result.newTotalExp;
      document.getElementById('home-exp').textContent = result.newExp;
    }

    let html = `きろくしました！`;
    if (result.gainedExp > 0) html += `<br><b class="text-primary">+${result.gainedExp} EXP</b> ゲット！`;
    if (result.reflectionBonus > 0) html += `<br>✨ <b class="text-success">ふり返りがすばらしい！</b><br>（深く考えて書けたので +${result.reflectionBonus} EXP のボーナス）`;
    if (result.streakBonus) {
      html += `<br>🔥 <b class="text-warning-emphasis">${result.streakBonus.streak}日れんぞくきろく！</b>（+${result.streakBonus.exp} EXP）`;
    }
    (result.achievedGoals || []).forEach(goal => {
      html = `🏆 <b>めあてたっせい！</b>（${esc(goal.kindLabel)}）<br>` + html;
    });
    if (result.personalBest) {
      const b = result.personalBest;
      html = `🌟 <b class="text-danger">じこベスト更新！</b><br>${esc(b.label)} ${b.value}${esc(b.unit)}（まえは ${b.previous}${esc(b.unit)}）<br>` + html;
      if (b.exp > 0) html += `<br>（じこベストボーナス +${b.exp} EXP）`;
    }
    if (result.aiCoach) {
      html += `<hr class="my-2"><div class="text-start small"><b>🤖 AIコーチから</b><br>${esc(result.aiCoach)}</div>`;
    }

    Swal.fire({ icon: 'success', title: result.personalBest ? 'きろく更新！' : 'やったね！', html }).then(() => {
      if (result.leveledUp) {
        Swal.fire({ icon: 'success', title: '🎉 レベルアップ！', html: `<b>レベル ${result.newLevel}</b> になりました！` })
          .then(() => refreshMissions());
      } else {
        refreshMissions();
      }
    });
  });
}

      ${r.aiCoach ? `<div class="small bg-light rounded p-2 mt-1">🤖 AIコーチから: ${esc(r.aiCoach)}</div>` : ''}
    </div></div>`).join('') || emptyMessage('まだきろくがありません');
  const goalDiffBadge = (score, expected) => {
    if (score === '' || score === null || expected === '' || expected === null) return '';
    const d = Number(score) - Number(expected);
    if (isNaN(d)) return '';
    const cls = d >= 0 ? 'bg-success' : 'bg-danger';
    return ` <span class="badge ${cls}" title="目標 ${esc(String(expected))}点">目標${d > 0 ? '+' : ''}${d}</span>`;
  };
  const testHtml = records.test.map(r => `
    <div class="card record-form-card shadow-sm mb-2"><div class="card-body py-2">
      <div class="d-flex justify-content-between"><b>📝 ${esc(r.subject)} / ${esc(r.unit)}</b><span class="small text-muted">${r.date}</span></div>
      <div class="small">点数: <b>${esc(String(r.score1 ?? ''))}</b>${goalDiffBadge(r.score1, r.expected1)}${r.score2 !== '' && r.score2 !== null ? ` ・ <b>${esc(String(r.score2))}</b>${goalDiffBadge(r.score2, r.expected2)}` : ''}</div>
      ${r.reflection ? `<div class="small">${esc(r.reflection)}</div>` : ''}
      ${r.aiCoach ? `<div class="small bg-light rounded p-2 mt-1">🤖 AIコーチから: ${esc(r.aiCoach)}</div>` : ''}
    </div></div>`).join('') || emptyMessage('まだきろくがありません');
  const moralHtml = records.moral.map(r => `
    <div class="card record-form-card shadow-sm mb-2"><div class="card-body py-2">
      <div class="d-flex justify-content-between"><b>💖 ${esc(r.materialName)}</b><span class="small text-muted">${r.date}</span></div>
      <div class="small">${esc(r.myThought)}</div>
      ${r.feedback ? `<div class="small bg-light rounded p-2 mt-1">💬 先生AIから: ${esc(r.feedback)}</div>` : ''}
    </div></div>`).join('') || emptyMessage('まだきろくがありません');
  document.getElementById('rtab-lesson').innerHTML = `
    <div class="row g-3">
      <div class="col-lg-4"><h6 class="fw-bold text-primary">✍️ じゅぎょうのふり返り</h6>${lessonHtml}</div>
      <div class="col-lg-4"><h6 class="fw-bold text-danger">📝 テストのふり返り</h6>
        <div class="card record-form-card shadow-sm mb-2"><div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="fw-bold mb-0 small">点数と目標のグラフ</h6><div id="test-chart-selector"></div>
          </div>
          <div id="test-chart" style="width:100%;height:260px;"></div>
        </div></div>
        ${testHtml}</div>
      <div class="col-lg-4"><h6 class="fw-bold" style="color:#d63384;">💖 どうとくノート</h6>${moralHtml}</div>
    </div>`;
  if (!document.getElementById('rtab-lesson').classList.contains('d-none')) drawTestChart(records.test);
}

function drawTypingChart(chartData) {
  if (!chartsReady || !chartData || chartData.length < 2) return;
  const el = document.getElementById('typing-chart');
  if (!el) return;
  const data = google.visualization.arrayToDataTable(chartData);
  new google.visualization.LineChart(el).draw(data, {
    curveType: 'function', legend: { position: 'bottom' },
    series: { 0: { targetAxisIndex: 0 }, 1: { targetAxisIndex: 1 } },
    vAxes: { 0: { title: '速さ (打/秒)' }, 1: { title: '正答率 (%)', maxValue: 100 } },
    chartArea: { width: '80%', height: '65%' }
  });
}

function drawCalcChart(chartDataByQuestions) {
  if (!chartsReady || !chartDataByQuestions) return;
  const el = document.getElementById('calc-chart');
  const selectorArea = document.getElementById('calc-chart-selector');
  if (!el || !selectorArea) return;
  const keys = Object.keys(chartDataByQuestions);
  if (keys.length === 0) { el.innerHTML = emptyMessage('グラフにできるきろくがまだありません'); return; }

  if (!selectorArea.querySelector('select')) {
    selectorArea.innerHTML = `<select class="form-select form-select-sm" id="calc-q-select">
      ${keys.map(k => `<option value="${esc(k)}">${esc(k)}問</option>`).join('')}</select>`;
    document.getElementById('calc-q-select').addEventListener('change', () => drawCalcChart(chartDataByQuestions));
  }
  const selected = document.getElementById('calc-q-select').value || keys[0];
  const data = google.visualization.arrayToDataTable(chartDataByQuestions[selected]);
  new google.visualization.LineChart(el).draw(data, {
    curveType: 'function', legend: { position: 'bottom' },
    vAxis: { title: 'タイム (秒)' },
    chartArea: { width: '80%', height: '65%' }
  });
}

/** テストの点数と目標点の推移グラフ（教科ごと） */
function drawTestChart(testRecords) {
  if (!chartsReady) return;
  const el = document.getElementById('test-chart');
  const selectorArea = document.getElementById('test-chart-selector');
  if (!el || !selectorArea) return;

  const subjects = [...new Set((testRecords || []).map(r => r.subject))];
  if (subjects.length === 0) { el.innerHTML = emptyMessage('グラフにできるきろくがまだありません'); return; }

  if (!selectorArea.querySelector('select')) {
    selectorArea.innerHTML = `<select class="form-select form-select-sm" id="test-subject-select">
      ${subjects.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>`;
    document.getElementById('test-subject-select').addEventListener('change', () => drawTestChart(testRecords));
  }
  const selected = document.getElementById('test-subject-select').value || subjects[0];

  const toNum = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  // records は新しい順なので、時系列（古い順）に並べ替えてプロット
  const rows = testRecords.filter(r => r.subject === selected).slice().reverse()
    .map(r => [r.unit, toNum(r.score1), toNum(r.expected1), toNum(r.score2), toNum(r.expected2)]);
  if (rows.length === 0) { el.innerHTML = emptyMessage('グラフにできるきろくがまだありません'); return; }

  const data = google.visualization.arrayToDataTable(
    [['単元', '点数(知識)', '目標(知識)', '点数(思考)', '目標(思考)']].concat(rows));
  new google.visualization.LineChart(el).draw(data, {
    curveType: 'function', legend: { position: 'bottom' }, pointSize: 5,
    vAxis: { title: '点数', minValue: 0, maxValue: 100 },
    series: {
      0: { color: '#dc3545' }, 1: { color: '#dc3545', lineDashStyle: [4, 4] },
      2: { color: '#0d6efd' }, 3: { color: '#0d6efd', lineDashStyle: [4, 4] }
    },
    chartArea: { width: '80%', height: '60%' }
  });
}

function renderItemGrid(data, filterCategory) {
  const grid = document.getElementById('inventory-grid');
  const filterArea = document.getElementById('item-category-filter');
  const owned = new Set(data.inventory);
  const categories = data.itemCategories || [];

  filterArea.innerHTML = [`<button class="btn btn-sm ${!filterCategory ? 'btn-primary' : 'btn-outline-primary'} me-1 mb-1 cat-btn" data-cat="">すべて</button>`]
    .concat(categories.map(c =>
      `<button class="btn btn-sm ${filterCategory === c ? 'btn-primary' : 'btn-outline-primary'} me-1 mb-1 cat-btn" data-cat="${esc(c)}">${esc(c)}</button>`))
    .join('');
  filterArea.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => renderItemGrid(data, btn.dataset.cat || undefined));
  });

  const items = (data.allItems || []).filter(item => !filterCategory || item['カテゴリ'] === filterCategory);
  if (items.length === 0) { grid.innerHTML = emptyMessage('アイテムがまだ登録されていません'); return; }

  grid.innerHTML = items.map(item => {
    const id = item['アイテムID'];
    const has = owned.has(id);
    const cost = Number(item['必要交換ポイント'] || 0);
    const equipped = App.pendingAvatar[item['カテゴリ']] === id;
    const rarity = item['レアリティー'];
    return `<div class="item-slot ${equipped ? 'equipped' : ''} ${has ? '' : 'locked'}"
      data-item="${esc(String(id))}" data-cat="${esc(item['カテゴリ'] || '')}" data-owned="${has}" data-cost="${cost}"
      title="${esc(item['アイテム名'])}${has ? '' : (cost > 0 ? `（${cost}Ptでこうかん）` : '（ガチャでゲット）')}">
      ${rarity ? `<span class="rarity-tag rarity-${esc(rarity)}">${esc(rarity)}</span>` : ''}
      ${item.imageUrl ? `<img src="${esc(item.imageUrl)}" referrerpolicy="no-referrer">` : `<i class="bi bi-box text-muted"></i>`}
      ${!has && cost > 0 ? `<span class="cost-tag">${cost}Pt</span>` : ''}
    </div>`;
  }).join('');

  grid.querySelectorAll('.item-slot').forEach(slot => {
    slot.addEventListener('click', () => onItemClick(slot, data));
  });
}

function onItemClick(slot, data) {
  const itemId = slot.dataset.item;
  const category = slot.dataset.cat;
  const owned = slot.dataset.owned === 'true';
  const cost = Number(slot.dataset.cost);
  const item = data.allItems.find(i => String(i['アイテムID']) === itemId);

  if (owned) {
    // 装備の切り替え
    if (App.pendingAvatar[category] === item['アイテムID']) {
      delete App.pendingAvatar[category];
    } else {
      App.pendingAvatar[category] = item['アイテムID'];
    }
    renderAvatarPreview();
    renderItemGrid(data, undefined);
    return;
  }
  if (cost > 0) {
    Swal.fire({
      title: 'アイテムこうかん',
      html: `「<b>${esc(item['アイテム名'])}</b>」を <b>${cost} 交換Pt</b> でこうかんしますか？<br><span class="small text-muted">いまの交換Pt: ${App.data.profile.exchangePoints}</span>`,
      icon: 'question', showCancelButton: true, confirmButtonText: 'こうかんする', cancelButtonText: 'やめる'
    }).then(async result => {
      if (!result.isConfirmed) return;
      const res = await apiWithLoading('こうかん中...', 'exchangeItem', item['アイテムID']);
      if (res.success) {
        App.data.profile.exchangePoints = res.newExchangePoints;
        App.data.inventory.push(item['アイテムID']);
        document.getElementById('home-exchange').textContent = res.newExchangePoints;
        document.getElementById('quest-exchange').textContent = res.newExchangePoints;
        toast(res.message);
        renderItemGrid(App.data, undefined);
      } else {
        Swal.fire('こうかんできません', esc(res.message), 'warning');
      }
    });
  } else {
    toast('このアイテムはガチャでゲットできるよ！', 'info');
  }
}

function renderAvatarPreview() {
  renderAvatar(document.getElementById('avatar-layers'), App.pendingAvatar, App.data.allItems);
  renderAvatar(document.getElementById('home-avatar'), App.pendingAvatar, App.data.allItems);
}

async function runGacha(count) {
  const cost = count === 10 ? App.data.gacha10Cost : App.data.gachaCost;
  if (App.data.profile.exp < cost) {
    Swal.fire('けいけんちがたりない！', `ガチャには ${cost} EXP ひつようです。<br>いまのけいけんち: ${App.data.profile.exp}`, 'warning');
    return;
  }
  const confirm = await Swal.fire({
    title: count === 10 ? '10連ガチャ' : 'ガチャをひく',
    html: `<b>${cost} EXP</b> をつかってガチャをひきますか？`,
    icon: 'question', showCancelButton: true, confirmButtonText: 'ひく！', cancelButtonText: 'やめる'
  });
  if (!confirm.isConfirmed) return;

  const result = await apiWithLoading('ガチャをまわしています...', 'playGacha', count);
  if (!result.success) {
    Swal.fire('ガチャエラー', esc(result.message), 'warning');
    return;
  }
  App.data.profile.exp = result.newPoints;
  if (result.newExchangePoints !== undefined) App.data.profile.exchangePoints = result.newExchangePoints;
  document.getElementById('home-exp').textContent = App.data.profile.exp;
  document.getElementById('home-exchange').textContent = App.data.profile.exchangePoints;
  document.getElementById('quest-exchange').textContent = App.data.profile.exchangePoints;
  result.results.forEach(item => {
    if (!item.isDuplicate) App.data.inventory.push(item['アイテムID']);
  });

  const itemsHtml = result.results.map(item => `
    <div class="d-inline-block text-center m-1" style="width:80px;">
      <div class="item-slot mx-auto ${item.isDuplicate ? 'locked' : ''}" style="cursor:default;">
        ${item['レアリティー'] ? `<span class="rarity-tag rarity-${esc(item['レアリティー'])}">${esc(item['レアリティー'])}</span>` : ''}
        ${item.imageUrl ? `<img src="${esc(item.imageUrl)}" referrerpolicy="no-referrer">` : '<i class="bi bi-box"></i>'}
      </div>
      <div class="small text-truncate">${esc(item['アイテム名'])}</div>
      ${item.isDuplicate ? `<div class="small text-warning-emphasis">+${item.awardedPoints}Pt</div>` : '<div class="small text-success fw-bold">NEW!</div>'}
    </div>`).join('');
  Swal.fire({
    title: count === 10 ? '10連ガチャのけっか！' : 'ガチャのけっか！',
    html: `<div>${itemsHtml}</div>${result.summary && result.summary.awardedExchangePoints > 0 ? `<div class="mt-2 small">かさなったぶんは <b>+${result.summary.awardedExchangePoints} 交換Pt</b> になりました</div>` : ''}`,
    confirmButtonText: 'とじる', width: count === 10 ? 640 : undefined
  });
  renderItemGrid(App.data, undefined);
}

    items.map(item => `<div class="ranking-item">
      <span class="rank-medal">${medal(item.rank || items.indexOf(item) + 1)}</span>
      <span class="flex-grow-1 fw-bold">${esc(item.nickname || item.name)}</span>
      <span class="text-primary fw-bold small">${valueFormatter(item)}</span>
    </div>`).join('');

  let calcHtml = '';
  Object.keys(rankings.calc || {}).forEach(mode => {
    calcHtml += `<div class="small fw-bold mt-2">${esc(mode)}</div>` +
      list(rankings.calc[mode], i => `${i.value}秒`);
  });

  const card = (title, icon, cls, body, note) => `
    <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
      <h6 class="fw-bold ${cls}"><i class="bi ${icon}"></i> ${title}</h6>
      ${note ? `<div class="small text-muted mb-1">${note}</div>` : ''}
      ${body}
    </div></div>`;

  // 「今週の伸び」「けいぞく」「今週のがんばり」は、上位が固定されがちな絶対値の
  // ランキングとちがって、誰でも1位になれる軸です。上のほうに置いています。
  container.innerHTML =
    card('今週ののび', 'bi-graph-up-arrow', 'text-danger',
      list(rankings.growth || [], i => `+${i.value}件`), '先週よりふえたきろくの数') +
    card('けいぞくチャンピオン', 'bi-fire', 'text-warning-emphasis',
      list(rankings.streak || [], i => `${i.value}日`), '何日れんぞくできろくしたか') +
    card('今週のがんばり', 'bi-lightning-charge-fill', 'text-primary',
      list(rankings.effort || [], i => `${i.value}件`), '今週きろくした数') +
    card('どくしょ王', 'bi-book', 'text-success',
      list(rankings.reading || [], i => `${i.value}ページ`)) +
    card('今日のMVP', 'bi-star-fill', 'text-danger',
      list((rankings.mvp || []).map((r, i) => ({ ...r, rank: i + 1 })), i => `+${i.gainedExp}EXP`)) +
    card('けいけんちトップ5', 'bi-trophy-fill', 'text-warning-emphasis',
      list((rankings.top5 || []).map((r, i) => ({ ...r, rank: i + 1 })), i => `Lv.${i.level} (${i.totalExp}EXP)`)) +
    card('タイピングはやさ', 'bi-keyboard', 'text-primary',
      list(rankings.typing || [], i => `${i.value}打/秒`)) +
    card('今週の学習アプリ時間', 'bi-joystick', 'text-info',
      list(rankings.studyApp || [], i => `${i.value}分`)) +
    (calcHtml ? card('100マスタイム', 'bi-calculator', 'text-success', calcHtml) : '');
}

/* ---------------- イベント ---------------- */

function bindStudentEvents() {
  document.getElementById('btn-gacha-1').addEventListener('click', () => runGacha(1));
  document.getElementById('btn-gacha-10').addEventListener('click', () => runGacha(10));

  const addGoalBtn = document.getElementById('home-add-goal-btn');
  if (addGoalBtn) addGoalBtn.addEventListener('click', () => openGoalDialog());

  document.getElementById('btn-save-avatar').addEventListener('click', async () => {
    const result = await apiWithLoading('ほぞん中...', 'saveAvatar', App.pendingAvatar);
    if (result.success) { App.data.avatar = { ...App.pendingAvatar }; toast(result.message); }
    else Swal.fire('ほぞんできません', esc(result.message), 'warning');
  });

  document.getElementById('btn-save-profile').addEventListener('click', async () => {
    const profileData = {
      motto: document.getElementById('profile-motto').value,
      favorite: document.getElementById('profile-favorite').value,
      goal: document.getElementById('profile-goal').value
    };
    const result = await apiWithLoading('ほぞん中...', 'saveProfile', profileData);
    if (result.success) {
      App.data.userProfile = profileData;
      document.getElementById('home-motto').textContent = profileData.motto ? `「${profileData.motto}」` : '';
      toast(result.message);
    } else {
      Swal.fire('ほぞんできません', esc(result.message), 'warning');
    }
  });
}
</script>
