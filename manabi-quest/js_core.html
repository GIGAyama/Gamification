<script>
/* =====================================================================
 * js_core.html — SPA基盤（状態管理・API・共通UI）
 * ===================================================================== */

/** アプリ全体の状態 */
const App = {
  role: null,      // 'student' | 'teacher'
  data: null,      // サーバーから受け取った初期データ
  pendingAvatar: null // 保存前のアバター構成
};

/** google.script.run を Promise でラップ */
function api(funcName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err && err.message ? err.message : '通信エラーが発生しました')))
      [funcName](...args);
  });
}

/* ---------------------------------------------------------------------
 * 学習ポータル連携（gigayama.github.io の iframe に埋め込まれたとき）
 * -------------------------------------------------------------------
 * 学習アプリの学習ログは、同一オリジンのポータルページからしか読み出せません
 * （ブラウザのストレージ分離により、サードパーティ iframe からは読めない）。
 * そこでポータルを親ページ、このアプリを iframe とし、
 * アプリ内の「きろくをおくる」ボタンは postMessage で親に送信を依頼します。
 * 埋め込みでない場合（Webアプリを直接開いた場合）は、ポータルURLへの案内を出します。
 * ------------------------------------------------------------------- */
const Portal = {
  embedded: false,      // ポータルの iframe 内で動いているか
  connected: false,     // ポータルとハンドシェイクできたか
  origin: null,         // ポータルのオリジン（検証済み）
  pending: 0,           // 端末にたまっている未送信のきろく件数
  studentNumber: '',    // ポータルに入力されている出席番号
  sending: false,
  sendTimer: null,      // 応答がないまま待機表示が固まるのを防ぐタイマー
  onUpdate: null,       // 状態が変わったときに児童画面が再描画するためのコールバック
  onResult: null        // 送信結果を受け取ったときのコールバック
};

/* ---------------------------------------------------------------------
 * 画面階層（戻る操作）
 * -------------------------------------------------------------------
 * このアプリは1ページの中でタブ・フォーム・ダイアログを切り替える SPA なので、
 * 「1つ前の画面」はブラウザの履歴ではなくアプリが覚えておく必要があります。
 * ここでは開いた順に復元手順を積んでおき、次の3つの操作から同じ goBackOne() を呼びます。
 *   ① 画面下部のナビゲーションバーの「もどる」
 *   ② 画面の左右の端から中央へのスワイプ
 *   ③ ポータル（親ページ）が受け取ったブラウザ/端末の戻る操作（NAV_BACK）
 * 状態が変わるたびにポータルへ NAV_STATE を送り、下部バーの見た目をそろえます。
 * ------------------------------------------------------------------- */
const Nav = {
  stack: [],          // { key, back() } を開いた順に積む
  suppress: false,    // 復元中に新しい履歴を積まないためのフラグ
  lastBackAt: 0,      // 二重発火を防ぐための直前の時刻
  lastBackSource: null,
  MAX: 30
};

/** ダイアログが開いているか（SweetAlert2） */
function isDialogOpen_() {
  return typeof Swal !== 'undefined' && typeof Swal.isVisible === 'function' && Swal.isVisible();
}

/** 1つ前の画面へ戻れるか */
function navCanGoBack() {
  return Nav.stack.length > 0 || isDialogOpen_();
}

/** 履歴を1つ積みます（同じ画面の連打は積みません） */
function navPush(key, back) {
  if (Nav.suppress) return;
  const top = Nav.stack[Nav.stack.length - 1];
  if (top && top.key === key) return;
  Nav.stack.push({ key, back });
  if (Nav.stack.length > Nav.MAX) Nav.stack.shift();
  navNotify();
}

/** 積んである履歴のうち、指定キーの一番新しいものを取り除きます（画面を自分で閉じたとき用） */
function navDrop(key) {
  for (let i = Nav.stack.length - 1; i >= 0; i--) {
    if (Nav.stack[i].key === key) {
      Nav.stack.splice(i, 1);
      navNotify();
      return;
    }
  }
}

/** 現在の状態をポータルと画面下部のバーに反映します */
function navNotify() {
  const canGoBack = navCanGoBack();
  postToPortal({ type: 'NAV_STATE', depth: Nav.stack.length, canGoBack });
  const btn = document.getElementById('app-back-btn');
  if (btn) btn.disabled = !canGoBack;
}

/** 1つ前の画面へ戻ります。戻れたら true */
function goBackOne() {
  if (isDialogOpen_()) { Swal.close(); navNotify(); return true; }
  const entry = Nav.stack.pop();
  if (!entry) { navNotify(); return false; }
  Nav.suppress = true;
  try {
    entry.back();
  } catch (e) {
    console.warn('画面を戻せませんでした:', e && e.message);
  } finally {
    Nav.suppress = false;
  }
  navNotify();
  return true;
}

/**
 * 「戻る」要求の入口。
 * 画面端のスワイプは、端末によってはブラウザの戻る操作も一緒に起こします。
 * 「1回の操作」が別々の入口から二重に届いたときだけ無視し、
 * 同じ入口の連打（もどるを2回押して2階層あがる等）はそのまま受け付けます。
 */
function requestBack(source) {
  const now = Date.now();
  if (source !== Nav.lastBackSource && now - Nav.lastBackAt < 600) return false;
  Nav.lastBackAt = now;
  Nav.lastBackSource = source;
  return goBackOne();
}

/**
 * 画面の左右の端から中央へのスワイプで戻ります。
 * ポータルに埋め込まれているときは、ポータル側の細い帯（画面のいちばん端）と
 * このハンドラ（その内側）の両方でスワイプを拾えるようにしています。
 */
function initEdgeSwipeBack() {
  const EDGE = 32;        // 端からこの範囲で始めたスワイプだけを「戻る」とみなす
  const THRESHOLD = 60;   // 中央方向へこれだけ動かしたら成立
  let startX = 0, startY = 0, startedAt = 0, direction = null;

  document.addEventListener('touchstart', event => {
    direction = null;
    if (event.touches.length !== 1) return;
    const touch = event.touches[0];
    const width = window.innerWidth || document.documentElement.clientWidth;
    if (touch.clientX <= EDGE) direction = 'left';
    else if (touch.clientX >= width - EDGE) direction = 'right';
    else return;
    startX = touch.clientX;
    startY = touch.clientY;
    startedAt = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', event => {
    if (!direction) return;
    const dir = direction;
    direction = null;
    const touch = event.changedTouches[0];
    if (!touch) return;
    const travel = dir === 'left' ? (touch.clientX - startX) : (startX - touch.clientX);
    const drift = Math.abs(touch.clientY - startY);
    if (travel >= THRESHOLD && drift < 80 && Date.now() - startedAt < 1200) requestBack('gesture');
  }, { passive: true });

  document.addEventListener('touchcancel', () => { direction = null; }, { passive: true });
}

/**
 * Webアプリを直接ひらいたとき（ポータルの iframe ではないとき）の履歴ガード。
 * 履歴にダミーを1つ積んでおき、ブラウザの戻る操作をアプリ内の「戻る」に変換します。
 * これでアプリが閉じたり、思わぬページへ飛んだりしません。
 * ポータル経由のときはポータル側が同じ役目を担うので、ここでは何もしません。
 */
function initStandaloneHistoryGuard() {
  if (document.body.classList.contains('embedded')) return;
  try {
    history.pushState({ mq: 'guard' }, '');
  } catch (e) {
    return;   // サンドボックスの制約で積めない環境では、下部バーとスワイプだけで戻ります
  }
  window.addEventListener('popstate', () => {
    try { history.pushState({ mq: 'guard' }, ''); } catch (e) { /* 続行 */ }
    requestBack('history');
  });
}

/** ポータルとして許可するオリジン（GitHub Pages のみ） */
function isPortalOrigin_(origin) {
  return typeof origin === 'string' && /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.github\.io$/i.test(origin);
}

/**
 * ポータル（いちばん外側のページ）へメッセージを送ります。
 *
 * ※ 宛先は window.parent ではなく window.top です。
 *   GAS の Webアプリは「script.google.com のページ」の中の
 *   「googleusercontent.com の iframe」でユーザーコードを動かすため、
 *   ポータルに埋め込むと次のような入れ子になります。
 *       ポータル(github.io) ＞ script.google.com ＞ googleusercontent.com（このコード）
 *   window.parent は script.google.com のページであってポータルではありません。
 */
function postToPortal(message) {
  if (window.self === window.top) return false;   // いちばん外側なら送り先がない
  try {
    window.top.postMessage({ source: 'manabi-quest', ...message }, Portal.origin || '*');
    return true;
  } catch (e) {
    return false;
  }
}

/** ポータルとのメッセージ受信を開始します */
function initPortalBridge() {
  // GAS は常にサンドボックスの iframe で動くので window.top との比較では
  // 「ポータルに埋め込まれているか」を判定できません。
  // サーバー側が ?embed=1 のときに付ける body.embedded を正とします。
  Portal.embedded = document.body.classList.contains('embedded');

  window.addEventListener('message', event => {
    // いちばん外側のページ かつ GitHub Pages のオリジンからのメッセージだけを受け付ける
    if (event.source !== window.top || !isPortalOrigin_(event.origin)) return;
    const msg = event.data;
    if (!msg || typeof msg !== 'object' || msg.source !== 'manabi-portal') return;
    Portal.origin = event.origin;
    Portal.connected = true;

    switch (msg.type) {
      case 'PORTAL_READY':
      case 'PENDING_CHANGED':
        Portal.pending = Number(msg.pending) || 0;
        Portal.studentNumber = String(msg.studentNumber || '');
        Portal.sending = false;
        if (Portal.onUpdate) Portal.onUpdate(msg);
        break;
      case 'SEND_STARTED':
        Portal.sending = true;
        if (Portal.onUpdate) Portal.onUpdate(msg);
        break;
      case 'SEND_RESULT':
        Portal.sending = false;
        clearTimeout(Portal.sendTimer);
        Portal.pending = Number(msg.pending) || 0;
        if (Portal.onResult) Portal.onResult(msg);
        else if (Portal.onUpdate) Portal.onUpdate(msg);
        break;
      case 'NAV_BACK':
        // ポータルが受け取った戻る操作（下部バー・スワイプ・ブラウザの戻る）
        requestBack('portal');
        break;
      case 'RELAY_POST':
        // ポータルから預かった学習ログを、ログイン済みのこの画面から送る
        relayStudyLog_(msg);
        break;
    }
  });

  postToPortal({ type: 'APP_READY' });
}

/**
 * ポータルから預かった学習ログをサーバーへ中継します。
 *
 * ポータル(github.io)から Webアプリへ直接 POST する方法は、デプロイの
 * 「アクセスできるユーザー」を『全員』にできる場合しか使えません
 * （組織アカウントではポリシーで選べないことがあります）。
 * この画面はすでに学校アカウントでログインした状態で動いているので、
 * ここから google.script.run で呼べば『組織内』のデプロイのままで送信できます。
 */
function relayStudyLog_(msg) {
  const reply = payload => postToPortal({ type: 'RELAY_RESULT', reqId: msg.reqId, ...payload });
  api('receiveStudyLogFromPortal', msg.body)
    .then(result => reply({ ok: true, result }))
    .catch(err => reply({ ok: false, message: (err && err.message) || '送信できませんでした。' }));
}

/** ポータルにきろくの送信を依頼します（アプリ内のボタンから呼びます） */
function requestPortalSend() {
  if (!Portal.embedded || !Portal.connected) return false;
  Portal.sending = true;
  // ポータルから結果が返らなくても、待機表示のまま固まらないようにする
  clearTimeout(Portal.sendTimer);
  Portal.sendTimer = setTimeout(() => {
    if (!Portal.sending) return;
    Portal.sending = false;
    if (Portal.onUpdate) Portal.onUpdate({ type: 'SEND_TIMEOUT' });
  }, 30000);
  return postToPortal({ type: 'REQUEST_SEND' });
}

/** HTMLエスケープ */
function esc(text) {
  if (text === null || text === undefined) return '';
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

/** トースト表示 */
function toast(title, icon = 'success') {
  Swal.fire({
    toast: true, position: 'top-end', icon, title,
    showConfirmButton: false, timer: 2200, timerProgressBar: true
  });
}

/** ローディング付きでAPIを呼ぶ */
async function apiWithLoading(message, funcName, ...args) {
  Swal.fire({
    title: message, allowOutsideClick: false, allowEscapeKey: false,
    didOpen: () => Swal.showLoading()
  });
  try {
    const result = await api(funcName, ...args);
    Swal.close();
    return result;
  } catch (e) {
    Swal.close();
    Swal.fire('エラー', esc(e.message), 'error');
    throw e;
  }
}

/** いま表示しているメインビューのID */
let currentViewId = null;

/**
 * ビュー切り替え。
 * @param {string} viewId
 * @param {Object} [options] - { push: true } で「戻る」履歴に前の画面を積みます
 *                             （タブのタップなど、児童・先生の操作で移動したとき）
 */
function showView(viewId, options) {
  if (options && options.push && currentViewId && currentViewId !== viewId) {
    const previous = currentViewId;   // クロージャに値を閉じ込める（変数を参照しない）
    navPush('view:' + previous, () => showView(previous));
  }
  document.querySelectorAll('.spa-view').forEach(v => v.classList.add('d-none'));
  const view = document.getElementById(viewId);
  if (view) view.classList.remove('d-none');
  document.querySelectorAll('.nav-tab').forEach(tab => {
    const active = tab.dataset.view === viewId;
    tab.classList.toggle('active-tab', active);
    tab.classList.toggle('text-secondary', !active);
  });
  currentViewId = viewId;
  // タブを切り替えたら、いつも画面の先頭から見せる
  window.scrollTo({ top: 0, behavior: 'auto' });
  navNotify();
}

/** 日付の表示整形 (ISO文字列 → M/d) */
function fmtDate(isoString) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

/** 汎用: 空メッセージ */
function emptyMessage(text) {
  return `<div class="text-center text-muted small py-3">${esc(text)}</div>`;
}

/* ---------------------------------------------------------------------
 * アバター描画（児童・広場・教員で共通利用）
 * ------------------------------------------------------------------- */

/**
 * アバター構成をレイヤー描画します。
 * @param {HTMLElement} container
 * @param {Object} composition - { カテゴリ: アイテムID }
 * @param {Object[]} allItems
 */
function renderAvatar(container, composition, allItems) {
  container.innerHTML = '';
  const itemMap = {};
  (allItems || []).forEach(item => { itemMap[item['アイテムID']] = item; });
  const entries = Object.entries(composition || {}).filter(([, id]) => id);
  if (entries.length === 0) {
    container.innerHTML = '<div class="avatar-placeholder"><i class="bi bi-person-fill"></i></div>';
    return;
  }
  entries.forEach(([, itemId]) => {
    const item = itemMap[itemId];
    if (item && item.imageUrl) {
      const img = document.createElement('img');
      img.className = 'avatar-layer';
      img.src = item.imageUrl;
      img.alt = item['アイテム名'] || '';
      img.referrerPolicy = 'no-referrer';
      container.appendChild(img);
    }
  });
  if (container.children.length === 0) {
    container.innerHTML = '<div class="avatar-placeholder"><i class="bi bi-person-fill"></i></div>';
  }
}

/* ---------------------------------------------------------------------
 * 初期化
 * ------------------------------------------------------------------- */

/* ---------------------------------------------------------------------
 * ふりがな（ルビ）自動付与エンジン（児童画面のみ）
 * kuroshiro + kuromoji で、画面に出る漢字の上へひらがなのルビを付けます。
 * 児童が入力したふり返り・本のタイトル・AIコメントなど動的なテキストにも対応。
 * ライブラリが読み込めない環境ではルビなしで通常どおり動作します（安全側）。
 * ------------------------------------------------------------------- */
const Furigana = {
  ready: false,
  writing: false,       // 自分のDOM書き換え中はObserverを無視する
  kuroshiro: null,
  cache: new Map(),     // エスケープ済み原文 → ルビHTML
  pending: new Set(),
  scheduled: false,
  // ルビを付けない要素（入力欄・選択肢・グラフ・既存ルビ・スクリプト等）
  SKIP_TAGS: new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEXTAREA', 'INPUT', 'SELECT', 'OPTION', 'RUBY', 'RT', 'RP', 'CODE', 'svg', 'SVG'])
};

/**
 * kuromoji は辞書URLを path.join で連結するため「https://」が「https:/」に潰れ、
 * GAS のサンドボックス（googleusercontent.com）ではこれが自ドメイン相対として
 * 解決されて全辞書ファイルが 404 になる。辞書取得の XHR に限り、URL を正しい
 * CDN の絶対URLへ戻すパッチを当てる。戻り値は解除用の関数。
 */
function patchKuromojiDictUrl_() {
  const origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    if (typeof url === 'string') {
      const i = url.indexOf('cdn.jsdelivr.net/npm/kuromoji@');
      if (i !== -1) url = 'https://' + url.slice(i);
    }
    return origOpen.call(this, method, url, ...rest);
  };
  return () => { XMLHttpRequest.prototype.open = origOpen; };
}

/** 児童画面向けにふりがなエンジンを起動します（教員画面では呼びません） */
async function initFurigana() {
  try {
    if (Furigana.ready || typeof Kuroshiro === 'undefined' || typeof KuromojiAnalyzer === 'undefined') return;
    const KuroshiroCtor = Kuroshiro.default || Kuroshiro;
    const AnalyzerCtor = KuromojiAnalyzer.default || KuromojiAnalyzer;
    const kuroshiro = new KuroshiroCtor();
    const unpatch = patchKuromojiDictUrl_();
    try {
      // 辞書（約6MB）が読めない・遅すぎる環境ではルビなしで続行する
      await Promise.race([
        kuroshiro.init(new AnalyzerCtor({ dictPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/' })),
        new Promise((_, reject) => setTimeout(() => reject(new Error('辞書の読み込みがタイムアウトしました')), 60000))
      ]);
    } finally {
      unpatch();
    }
    Furigana.kuroshiro = kuroshiro;
    Furigana.ready = true;
    document.body.classList.add('furigana-on');

    await furiganizeTree(document.body);
    startFuriganaObserver();
  } catch (e) {
    console.warn('ふりがな機能を初期化できませんでした（ルビなしで動作します）:', e && e.message);
  }
}

/** 漢字を含むか */
function hasKanji_(s) { return /[\u3400-\u9fff\uf900-\ufaff]/.test(s); }

/** テキストノードの祖先にルビ非対象の要素があるか */
function isFuriganaSkipped_(node) {
  let el = node.parentNode;
  while (el && el !== document) {
    if (el.nodeType === 1) {
      if (Furigana.SKIP_TAGS.has(el.tagName)) return true;
      if (el.classList && el.classList.contains('no-furigana')) return true;
      if (el.id && /-chart$/.test(el.id)) return true; // Google Charts の描画先
    }
    el = el.parentNode;
  }
  return false;
}

/** 指定要素以下の、漢字を含むテキストノードを集めます */
function collectKanjiTextNodes_(root) {
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !hasKanji_(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      if (isFuriganaSkipped_(node)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  return nodes;
}

/** 原文をふりがな付きHTMLに変換します（HTMLエスケープしてから変換し安全に注入） */
async function toFuriganaHtml_(rawText) {
  const escaped = esc(rawText);
  if (Furigana.cache.has(escaped)) return Furigana.cache.get(escaped);
  const html = await Furigana.kuroshiro.convert(escaped, { to: 'hiragana', mode: 'furigana' });
  Furigana.cache.set(escaped, html);
  return html;
}

/** 指定要素以下の漢字にルビを付けます */
async function furiganizeTree(root) {
  if (!Furigana.ready || !root) return;
  const nodes = collectKanjiTextNodes_(root);
  for (const node of nodes) {
    if (!node.parentNode) continue; // すでに置換・削除済み
    let html;
    try {
      html = await toFuriganaHtml_(node.nodeValue);
    } catch (e) {
      continue;
    }
    if (!node.parentNode) continue;
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    Furigana.writing = true;
    node.parentNode.replaceChild(tpl.content, node);
    Furigana.writing = false;
  }
}

/** DOMの変化を監視し、あとから追加された漢字にも自動でルビを付けます */
function startFuriganaObserver() {
  const observer = new MutationObserver(mutations => {
    if (!Furigana.ready || Furigana.writing) return;
    for (const m of mutations) {
      m.addedNodes.forEach(node => {
        if (node.nodeType === 1) Furigana.pending.add(node);
        else if (node.nodeType === 3 && node.parentNode) Furigana.pending.add(node.parentNode);
      });
    }
    if (Furigana.pending.size > 0 && !Furigana.scheduled) {
      Furigana.scheduled = true;
      requestAnimationFrame(flushFuriganaQueue_);
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
}

/** 監視でたまった要素をまとめて処理します */
async function flushFuriganaQueue_() {
  Furigana.scheduled = false;
  const roots = [...Furigana.pending];
  Furigana.pending.clear();
  for (const root of roots) {
    if (root && root.isConnected) await furiganizeTree(root);
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  // ポータルとの接続は初期データの取得より先に始めておく
  initPortalBridge();

  // タブクリックの共通ハンドラ（タップでの移動は「戻る」履歴に積む）
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => showView(tab.dataset.view, { push: true }));
  });

  // 画面下部のナビゲーションバー（ポータルに埋め込まれていないときに表示）
  const backBtn = document.getElementById('app-back-btn');
  if (backBtn) backBtn.addEventListener('click', () => requestBack('button'));

  // 画面端からのスワイプで戻る
  initEdgeSwipeBack();
  initStandaloneHistoryGuard();

  // PC のキーボード（Alt + ←）でも戻れるようにする
  document.addEventListener('keydown', e => {
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); requestBack('key'); }
  });

  navNotify();

  try {
    const result = await api('getInitialAppData');
    document.getElementById('initial-loading-view').classList.add('d-none');

    if (!result.success) {
      document.getElementById('error-message').textContent = result.message || 'データの読み込みに失敗しました。';
      showView('error-view');
      return;
    }

    App.role = result.role;
    App.data = result.data;
    document.getElementById('main-nav').style.display = '';

    if (result.role === 'teacher') {
      document.getElementById('teacher-tabs').classList.remove('d-none');
      initTeacherApp(result.data);
      showView('view-t-dashboard');
    } else {
      document.getElementById('student-tabs').classList.remove('d-none');
      document.getElementById('nav-level-badge').classList.remove('d-none');
      initStudentApp(result.data);
      showView('view-home');
      initFurigana(); // 児童画面だけ漢字にふりがなを付ける（教員画面では呼ばない）
    }
  } catch (e) {
    document.getElementById('initial-loading-view').classList.add('d-none');
    document.getElementById('error-message').textContent = esc(e.message);
    showView('error-view');
  }
});
</script>
