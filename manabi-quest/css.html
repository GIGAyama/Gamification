<style>
  /* =================================================================
   * デザイントークン
   * 色・大きさ・角丸・影を1か所にまとめています。
   * 見た目を変えたいときは、まずここの値を書きかえてください。
   * ================================================================= */
  :root {
    /* -- 基本色（既存のクラスからも参照しています） -- */
    --mq-primary: #4a90e2;
    --mq-radius: 1rem;

    /* -- パレット（児童画面のカードやボタンの色わけに使います） -- */
    --mq-blue:   #4a90e2;  --mq-blue-d:   #2f6fbf;  --mq-blue-s:   #eaf3ff;
    --mq-green:  #2fb673;  --mq-green-d:  #1f8f57;  --mq-green-s:  #e6f8ef;
    --mq-orange: #f5942a;  --mq-orange-d: #d0770f;  --mq-orange-s: #fff2e0;
    --mq-pink:   #ef5f92;  --mq-pink-d:   #cc3b71;  --mq-pink-s:   #ffedf3;
    --mq-purple: #8b7cf6;  --mq-purple-d: #6a57e0;  --mq-purple-s: #f0edff;
    --mq-cyan:   #21b6c8;  --mq-cyan-d:   #128e9d;  --mq-cyan-s:   #e2f8fb;
    --mq-gold:   #f0b429;  --mq-gold-d:   #c98f0d;  --mq-gold-s:   #fff6dd;

    /* -- 文字・線・面 -- */
    --mq-ink:    #2f3d4f;
    --mq-ink-2:  #5b6b80;
    --mq-muted:  #8a99a8;
    --mq-line:   #dbe6f3;
    --mq-surface:#ffffff;
    --mq-canvas: #eef4fb;

    /* -- 角丸・影 -- */
    --mq-radius-lg: 1.25rem;
    --mq-radius-md: .9rem;
    --mq-shadow:    0 .35rem .9rem rgba(47, 61, 79, .10);
    --mq-shadow-lg: 0 .8rem 1.6rem rgba(47, 61, 79, .16);

    /* -- カードのアクセント（.accent-* クラスで上書きします） -- */
    --mq-accent:      linear-gradient(90deg, #5b9df5, #8bc0ff);
    --mq-accent-color: var(--mq-blue-d);
    --mq-accent-soft:  var(--mq-blue-s);
  }

  /* -----------------------------------------------------------------
   * 文字サイズの切りかえ（低学年でも読める大きさにできます）
   * html 要素に付くクラスで rem の基準を変えるので、画面ぜんぶが
   * いっしょに大きくなります。既定（クラスなし）はブラウザの設定どおり。
   * ----------------------------------------------------------------- */
  html.mq-size-l  { font-size: 112.5%; }  /* 標準16pxのとき 18px */
  html.mq-size-xl { font-size: 125%; }    /* 標準16pxのとき 20px */

  body {
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    color: var(--mq-ink);
    /* 画面端からのスワイプ（戻る操作）で、ページが横に流れないようにする */
    overscroll-behavior-x: none;
  }

  /* =================================================================
   * メインの表示領域
   * どの端末でもコンテンツの幅を最大限に使えるよう、Bootstrap の .container
   * （固定幅）ではなく可変幅にしています。大画面では読みやすい幅で止めます。
   * ================================================================= */
  .app-main {
    width: 100%;
    max-width: 1440px;
    margin-left: auto;
    margin-right: auto;
    /* 左右の余白は Bootstrap の行ガター（--bs-gutter-x の半分 = .75rem）以上にします。
       これより狭いと .row の負のマージンがはみ出して横スクロールが出ます。 */
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  @media (max-width: 767.98px) {
    .app-main {
      padding-left: .75rem;
      padding-right: .75rem;
      padding-top: .85rem !important;
      padding-bottom: 1rem !important;
    }
    /* ナビゲーションの高さを詰めて、そのぶんコンテンツを広くする */
    #main-nav { padding-top: .15rem !important; padding-bottom: .15rem !important; }
    #main-nav .navbar-brand { font-size: 1rem; }
    #main-nav #nav-user-info { font-size: .85rem; gap: .5rem !important; }
    /* ブランド行はスクロールで隠し、タブは画面上部に貼り付けて常に押せるようにする */
    #main-nav { position: static !important; }
    #student-tabs, #teacher-tabs { position: sticky; top: 0; z-index: 1020; }
  }
  @media (min-width: 1600px) {
    .app-main { max-width: 1600px; }
  }

  /* ---- 画面下部のナビゲーションバー（Webアプリを直接ひらいたとき） ---- */
  .app-backbar {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 1030;
    align-items: center;
    gap: .75rem;
    padding: .4rem .9rem;
    padding-bottom: calc(.4rem + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid #dee2e6;
    box-shadow: 0 -2px 10px rgba(0, 0, 0, .06);
  }
  .app-back-btn {
    border: 1px solid #cfe0f5;
    background: #f4f9ff;
    color: var(--mq-primary);
    font-weight: bold;
    font-family: inherit;
    border-radius: 999px;
    padding: .5rem 1.4rem;
    font-size: 1rem;
    min-height: 44px;
  }
  .app-back-btn:disabled { color: #adb5bd; background: #f1f3f5; border-color: #e9ecef; }
  .app-backbar-hint { font-size: .72rem; color: #8a99a8; }
  /* ポータル（PWA）の中では、ポータル側の下部バーを使う */
  body.embedded .app-backbar { display: none !important; }
  @media (max-width: 991.98px), (pointer: coarse) {
    body:not(.embedded) .app-backbar { display: flex; }
    /* 下部バーに隠れないぶんの余白 */
    body:not(.embedded) { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
    body:not(.embedded) .app-backbar-hint { display: none; }
  }
  @media (min-width: 992px) and (pointer: coarse) {
    body:not(.embedded) .app-backbar-hint { display: inline; }
  }

  /* ---- 文字サイズ切りかえボタン（ヘッダーの中） ---- */
  .mq-sizer {
    display: inline-flex;
    align-items: center;
    gap: .15rem;
    background: rgba(255, 255, 255, .18);
    border-radius: 999px;
    padding: .1rem;
  }
  .mq-sizer button {
    border: 0; background: transparent; color: #fff;
    font-family: inherit; font-weight: 700; line-height: 1;
    border-radius: 999px; padding: .25rem .5rem; min-width: 2rem; min-height: 2rem;
  }
  .mq-sizer button.on { background: #fff; color: var(--mq-blue-d); }
  .mq-sizer button:nth-child(1) { font-size: .78rem; }
  .mq-sizer button:nth-child(2) { font-size: .95rem; }
  .mq-sizer button:nth-child(3) { font-size: 1.15rem; }

  /* ---- ナビゲーションタブ ---- */
  .nav-tab {
    border-bottom: 3px solid transparent !important;
    white-space: nowrap;
    transition: color .15s, border-color .15s, background-color .15s;
  }
  .nav-tab.active-tab {
    color: var(--bs-primary) !important;
    border-bottom-color: var(--bs-primary) !important;
    background-color: rgba(74, 144, 226, .06);
  }
  .nav-tab:hover { background-color: rgba(74, 144, 226, .08); }

  /* 児童用タブは絵文字を大きく、文字を下に置いて押しやすくします */
  #student-tabs .nav-tab { display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .5rem .25rem !important; }
  #student-tabs .nav-tab .tab-emoji { font-size: 1.45rem; line-height: 1.1; filter: grayscale(.55) opacity(.7); transition: filter .15s, transform .15s; }
  #student-tabs .nav-tab.active-tab .tab-emoji { filter: none; transform: scale(1.12); }
  #student-tabs .nav-tab .tab-label { font-size: .78rem; }

  /* タブを変えたときも、すっと入れかわって見えるようにします */
  .spa-view:not(.d-none) { animation: mq-view-in .26s cubic-bezier(.2,.85,.3,1) both; }
  @keyframes mq-view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* =================================================================
   * ホームの「きょう やること」カード
   * いま一番やってほしいこと「1つだけ」を、大きく出します。
   * ================================================================= */
  .mq-today {
    position: relative; overflow: hidden;
    display: block; width: 100%; text-align: left;
    border: 0; border-radius: var(--mq-radius-lg);
    padding: 1.15rem 1.2rem;
    font-family: inherit; color: #fff;
    background: linear-gradient(135deg, #ff9d4d, #f2653f 60%, #e8467a);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .12), var(--mq-shadow-lg);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .mq-today:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,.12), var(--mq-shadow); }
  .mq-today.done {
    background: linear-gradient(135deg, #4fd08a, #22a05f);
    cursor: default;
  }
  .mq-today .today-label {
    display: inline-flex; align-items: center; gap: .3rem;
    background: rgba(255, 255, 255, .22); border-radius: 999px;
    padding: .15rem .7rem; font-size: .82rem; font-weight: 700;
    margin-bottom: .5rem;
  }
  .mq-today .today-title {
    display: flex; align-items: center; gap: .6rem;
    font-size: 1.35rem; font-weight: 700; line-height: 1.45;
  }
  .mq-today .today-emoji { font-size: 2.2rem; line-height: 1; }
  .mq-today .today-note { display: block; font-size: .9rem; opacity: .92; margin-top: .35rem; }
  /* さそうように、ゆっくり息をするアイコン */
  .mq-today:not(.done) .today-emoji { animation: mq-breathe 2.4s ease-in-out infinite; }
  @keyframes mq-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14) rotate(-6deg); } }

  /* ---- カード・ボタン ---- */
  .hover-lift { transition: transform .15s ease, box-shadow .15s ease; }
  .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }

  /* =================================================================
   * パネル（1画面ずつの階層移動）
   * 奥に入るときは右から、戻るときは左からすべりこみます。
   * 中の要素も少しずつ遅らせて出すことで、目線が上から下へ流れます。
   * ================================================================= */
  .mq-panel { display: none; }
  .mq-panel.on { display: block; }
  .mq-panel.anim-fwd  { animation: mq-panel-fwd .3s cubic-bezier(.2,.85,.3,1) both; }
  .mq-panel.anim-back { animation: mq-panel-back .3s cubic-bezier(.2,.85,.3,1) both; }
  @keyframes mq-panel-fwd  { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes mq-panel-back { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }

  /* パネルの中身が順番に浮きあがってくる演出 */
  .mq-panel.anim-fwd > *, .mq-panel.anim-back > * { animation: mq-rise .34s cubic-bezier(.2,.85,.3,1) both; }
  .mq-panel.anim-fwd > *:nth-child(1), .mq-panel.anim-back > *:nth-child(1) { animation-delay: .02s; }
  .mq-panel.anim-fwd > *:nth-child(2), .mq-panel.anim-back > *:nth-child(2) { animation-delay: .07s; }
  .mq-panel.anim-fwd > *:nth-child(3), .mq-panel.anim-back > *:nth-child(3) { animation-delay: .12s; }
  .mq-panel.anim-fwd > *:nth-child(4), .mq-panel.anim-back > *:nth-child(4) { animation-delay: .17s; }
  .mq-panel.anim-fwd > *:nth-child(n+5), .mq-panel.anim-back > *:nth-child(n+5) { animation-delay: .22s; }
  @keyframes mq-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---- パネルの見出し（もどるボタンつき） ---- */
  .mq-panel-head {
    display: flex; align-items: center; gap: .6rem;
    margin-bottom: 1rem;
  }
  .mq-back-btn {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: .25rem;
    border: 2px solid var(--mq-line); border-radius: 999px;
    background: #fff; color: var(--mq-ink-2);
    font-family: inherit; font-weight: 700; font-size: .95rem;
    padding: .45rem 1rem; min-height: 2.9rem;
    box-shadow: 0 3px 0 #e4ecf5;
    transition: transform .08s, box-shadow .08s;
  }
  .mq-back-btn:active { transform: translateY(3px); box-shadow: none; }
  .mq-panel-title {
    flex: 1 1 auto; margin: 0;
    font-size: 1.3rem; font-weight: 700; color: var(--mq-ink);
  }

  /* =================================================================
   * 「とびら」ボタン
   * 次の階層へ進むための、大きな1行ボタン。
   * 1画面に3つまでしか置きません。
   * ================================================================= */
  .mq-door {
    --door: var(--mq-blue);
    --door-soft: var(--mq-blue-s);
    display: flex; align-items: center; gap: .9rem; width: 100%;
    text-align: left;
    padding: 1rem 1.1rem;
    margin-bottom: .9rem;
    border: 2px solid var(--door-soft);
    border-radius: var(--mq-radius-lg);
    background: linear-gradient(135deg, #fff 40%, var(--door-soft));
    color: var(--mq-ink);
    font-family: inherit;
    box-shadow: 0 5px 0 var(--door-soft), var(--mq-shadow);
    transition: transform .1s ease, box-shadow .1s ease, border-color .15s;
  }
  .mq-door:hover { border-color: var(--door); }
  .mq-door:active { transform: translateY(5px); box-shadow: 0 0 0 var(--door-soft), var(--mq-shadow); }
  .mq-door .door-icon {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    width: 3.4rem; height: 3.4rem; border-radius: 1rem;
    background: #fff; box-shadow: inset 0 0 0 2px var(--door-soft);
    font-size: 2rem; line-height: 1;
  }
  .mq-door .door-body { flex: 1 1 auto; min-width: 0; }
  .mq-door .door-title { display: block; font-size: 1.2rem; font-weight: 700; line-height: 1.4; }
  .mq-door .door-note { display: block; font-size: .84rem; color: var(--mq-muted); }
  .mq-door .door-arrow { flex: 0 0 auto; font-size: 1.4rem; color: var(--door); font-weight: 700; }
  .mq-door .door-count {
    flex: 0 0 auto;
    min-width: 1.9rem; height: 1.9rem; padding: 0 .45rem;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; background: #e8467a; color: #fff;
    font-size: .95rem; font-weight: 700;
  }
  .mq-door.door-blue   { --door: var(--mq-blue);   --door-soft: var(--mq-blue-s); }
  .mq-door.door-green  { --door: var(--mq-green);  --door-soft: var(--mq-green-s); }
  .mq-door.door-orange { --door: var(--mq-orange); --door-soft: var(--mq-orange-s); }
  .mq-door.door-pink   { --door: var(--mq-pink);   --door-soft: var(--mq-pink-s); }
  .mq-door.door-purple { --door: var(--mq-purple); --door-soft: var(--mq-purple-s); }
  .mq-door.door-cyan   { --door: var(--mq-cyan);   --door-soft: var(--mq-cyan-s); }
  .mq-door.door-gold   { --door: var(--mq-gold);   --door-soft: var(--mq-gold-s); }

  /* ---- ガチャの絵（押すまえにゆらゆらして、さそいます） ---- */
  .gacha-machine {
    font-size: 5rem; line-height: 1;
    animation: mq-wiggle 2.6s ease-in-out infinite;
  }
  @keyframes mq-wiggle {
    0%, 70%, 100% { transform: rotate(0deg) scale(1); }
    76% { transform: rotate(-9deg) scale(1.06); }
    84% { transform: rotate(9deg) scale(1.06); }
    92% { transform: rotate(-5deg) scale(1.03); }
  }
  .gacha-machine.opening { animation: mq-gacha-open .8s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes mq-gacha-open {
    0% { transform: scale(1) rotate(0); }
    35% { transform: scale(.82) rotate(-12deg); }
    70% { transform: scale(1.45) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* =================================================================
   * ステップ入力（1画面に1つの質問だけ）
   * 「たくさんの入力欄がならんだ紙」ではなく、
   * 1問ずつ答えていくゲームのような形にしています。
   * ================================================================= */
  .mq-steps { position: relative; }
  .mq-step { display: none; }
  .mq-step.on { display: block; }
  .mq-step.anim-fwd  { animation: mq-step-fwd .26s cubic-bezier(.2,.85,.3,1) both; }
  .mq-step.anim-back { animation: mq-step-back .26s cubic-bezier(.2,.85,.3,1) both; }
  @keyframes mq-step-fwd  { from { opacity: 0; transform: translateX(30px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes mq-step-back { from { opacity: 0; transform: translateX(-30px) scale(.985); } to { opacity: 1; transform: none; } }

  .mq-step-question {
    display: flex; align-items: center; gap: .6rem;
    font-size: 1.35rem; font-weight: 700; line-height: 1.5;
    color: var(--mq-ink);
    margin-bottom: 1rem;
  }
  .mq-step-question .q-emoji { font-size: 2rem; line-height: 1; }
  .mq-step-hint { font-size: .9rem; color: var(--mq-muted); margin-top: .6rem; }

  /* 進み具合の点。いま何問目かが分かります */
  .mq-dots { display: flex; justify-content: center; gap: .45rem; margin-bottom: 1rem; }
  .mq-dots i {
    width: .6rem; height: .6rem; border-radius: 999px;
    background: var(--mq-line);
    transition: transform .25s cubic-bezier(.3,1.6,.5,1), background-color .25s;
  }
  .mq-dots i.done { background: var(--mq-green); }
  .mq-dots i.now { background: var(--mq-blue); transform: scale(1.7); }

  /* =================================================================
   * 児童画面の共通カード（.mq-card）
   * 上に色の帯・左に大きな絵文字アイコンを置いて、
   * 「ここは何のカードか」を一目で分かるようにします。
   * 色は .accent-* クラスで切りかえます。
   * ================================================================= */
  .mq-card {
    position: relative;
    background: var(--mq-surface);
    border: 0;
    border-radius: var(--mq-radius-lg);
    box-shadow: var(--mq-shadow);
    overflow: hidden;
  }
  .mq-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: var(--mq-accent);
  }
  .mq-card-head {
    display: flex; align-items: center; gap: .65rem;
    padding: 1rem 1rem .35rem;
  }
  .mq-card-icon {
    flex: 0 0 auto;
    width: 2.6rem; height: 2.6rem;
    border-radius: var(--mq-radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; line-height: 1;
    background: var(--mq-accent-soft);
  }
  .mq-card-title {
    flex: 1 1 auto;
    margin: 0;
    font-size: 1.15rem; font-weight: 700;
    color: var(--mq-accent-color);
  }
  .mq-card-note { font-size: .82rem; color: var(--mq-muted); }
  .mq-card-body { padding: .5rem 1rem 1rem; }
  .mq-card-body.tight { padding-top: 0; }

  .accent-blue   { --mq-accent: linear-gradient(90deg,#5b9df5,#8bc0ff); --mq-accent-color: var(--mq-blue-d);   --mq-accent-soft: var(--mq-blue-s); }
  .accent-green  { --mq-accent: linear-gradient(90deg,#35c47e,#8fe6b7); --mq-accent-color: var(--mq-green-d);  --mq-accent-soft: var(--mq-green-s); }
  .accent-orange { --mq-accent: linear-gradient(90deg,#f9a03f,#ffcf8a); --mq-accent-color: var(--mq-orange-d); --mq-accent-soft: var(--mq-orange-s); }
  .accent-pink   { --mq-accent: linear-gradient(90deg,#f472a0,#ffb0cb); --mq-accent-color: var(--mq-pink-d);   --mq-accent-soft: var(--mq-pink-s); }
  .accent-purple { --mq-accent: linear-gradient(90deg,#9a8bff,#c9c0ff); --mq-accent-color: var(--mq-purple-d); --mq-accent-soft: var(--mq-purple-s); }
  .accent-cyan   { --mq-accent: linear-gradient(90deg,#28c3d6,#93e9f2); --mq-accent-color: var(--mq-cyan-d);   --mq-accent-soft: var(--mq-cyan-s); }
  .accent-gold   { --mq-accent: linear-gradient(90deg,#f7c63f,#ffe6a1); --mq-accent-color: var(--mq-gold-d);   --mq-accent-soft: var(--mq-gold-s); }

  /* 見出し（カードの外で場面を区切るとき） */
  .mq-section-title {
    display: flex; align-items: center; gap: .5rem;
    font-size: 1.05rem; font-weight: 700; color: var(--mq-ink-2);
    margin: 1.5rem 0 .6rem;
  }
  .mq-section-title::after {
    content: ''; flex: 1 1 auto; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--mq-line), transparent);
  }
  .mq-section-title:first-child { margin-top: 0; }

  /* =================================================================
   * ボタン（押した感じのある立体ボタン）
   * ================================================================= */
  .mq-btn {
    --btn-bg: linear-gradient(180deg, #5da2f7, #3a78d8);
    --btn-edge: #2a5fae;
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    border: 0; border-radius: 999px;
    padding: .75rem 1.5rem;
    min-height: 3rem;
    font-family: inherit; font-weight: 700; font-size: 1.05rem;
    color: #fff; background: var(--btn-bg);
    box-shadow: 0 4px 0 var(--btn-edge), 0 6px 12px rgba(47, 61, 79, .18);
