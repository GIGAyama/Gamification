<style>
  :root {
    --mq-primary: #4a90e2;
    --mq-radius: 1rem;
  }

  body {
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    /* 画面端からのスワイプ（戻る操作）で、ページが横に流れないようにする */
    overscroll-behavior-x: none;
  }

  /* =================================================================
   * メインの表示領域
   * どの端末でもコンテンツの幅を最大限に使えるよう、Bootstrap の .container
   * （固定幅）ではなく可変幅にしています。大画面では読みやすい幅で止めます。
   * ================================================================= */
  .app-main {
    width: 100%;
    max-width: 1440px;
    margin-left: auto;
    margin-right: auto;
    /* 左右の余白は Bootstrap の行ガター（--bs-gutter-x の半分 = .75rem）以上にします。
       これより狭いと .row の負のマージンがはみ出して横スクロールが出ます。 */
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  @media (max-width: 767.98px) {
    .app-main {
      padding-left: .75rem;
      padding-right: .75rem;
      padding-top: .85rem !important;
      padding-bottom: 1rem !important;
    }
    /* ナビゲーションの高さを詰めて、そのぶんコンテンツを広くする */
    #main-nav { padding-top: .15rem !important; padding-bottom: .15rem !important; }
    #main-nav .navbar-brand { font-size: 1rem; }
    #main-nav #nav-user-info { font-size: .85rem; gap: .5rem !important; }
    /* ブランド行はスクロールで隠し、タブは画面上部に貼り付けて常に押せるようにする */
    #main-nav { position: static !important; }
    #student-tabs, #teacher-tabs { position: sticky; top: 0; z-index: 1020; }
  }
  @media (min-width: 1600px) {
    .app-main { max-width: 1600px; }
  }

  /* ---- 画面下部のナビゲーションバー（Webアプリを直接ひらいたとき） ---- */
  .app-backbar {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 1030;
    align-items: center;
    gap: .75rem;
    padding: .4rem .9rem;
    padding-bottom: calc(.4rem + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid #dee2e6;
    box-shadow: 0 -2px 10px rgba(0, 0, 0, .06);
  }
  .app-back-btn {
    border: 1px solid #cfe0f5;
    background: #f4f9ff;
    color: var(--mq-primary);
    font-weight: bold;
    font-family: inherit;
    border-radius: 999px;
    padding: .5rem 1.4rem;
    font-size: 1rem;
    min-height: 44px;
  }
  .app-back-btn:disabled { color: #adb5bd; background: #f1f3f5; border-color: #e9ecef; }
  .app-backbar-hint { font-size: .72rem; color: #8a99a8; }
  /* ポータル（PWA）の中では、ポータル側の下部バーを使う */
  body.embedded .app-backbar { display: none !important; }
  @media (max-width: 991.98px), (pointer: coarse) {
    body:not(.embedded) .app-backbar { display: flex; }
    /* 下部バーに隠れないぶんの余白 */
    body:not(.embedded) { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
    body:not(.embedded) .app-backbar-hint { display: none; }
  }
  @media (min-width: 992px) and (pointer: coarse) {
    body:not(.embedded) .app-backbar-hint { display: inline; }
  }

  /* ---- ナビゲーションタブ ---- */
  .nav-tab {
    border-bottom: 3px solid transparent !important;
    white-space: nowrap;
    transition: color .15s, border-color .15s, background-color .15s;
  }
  .nav-tab.active-tab {
    color: var(--bs-primary) !important;
    border-bottom-color: var(--bs-primary) !important;
    background-color: rgba(74, 144, 226, .06);
  }
  .nav-tab:hover { background-color: rgba(74, 144, 226, .08); }

  /* ---- カード・ボタン ---- */
  .hover-lift { transition: transform .15s ease, box-shadow .15s ease; }
  .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }

  /* ---- アバター ---- */
  .avatar-frame {
    width: 150px; height: 150px;
    border: 3px dashed #cfe2ff; border-radius: 50%;
    position: relative; overflow: hidden; background: #f8fbff;
  }
  .avatar-frame .avatar-layer,
  #avatar-layers .avatar-layer,
  .plaza-avatar .avatar-layer {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .plaza-avatar {
    width: 90px; height: 90px;
    border-radius: 50%; background: #f8fbff;
    border: 2px solid #e3edf9;
    position: relative; overflow: hidden;
    margin: 0 auto;
  }
  .avatar-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #b6cdea; font-size: 2.5rem;
  }

  /* ---- アイテム ---- */
  .item-slot {
    width: 68px; height: 68px;
    border: 2px solid #e9ecef; border-radius: .75rem;
    background: #fff; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, transform .1s;
    overflow: hidden;
  }
  .item-slot:hover { transform: scale(1.05); }
  .item-slot.equipped { border-color: var(--bs-success); box-shadow: 0 0 0 2px rgba(25,135,84,.25); }
  .item-slot.locked { opacity: .45; cursor: default; }
  .item-slot img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .item-slot .rarity-tag {
    position: absolute; top: 2px; left: 2px;
    font-size: .55rem; padding: 1px 4px; border-radius: 4px;
    color: #fff; font-weight: bold;
  }
  .rarity-N { background: #8a99a8; }
  .rarity-R { background: #4a90e2; }
  .rarity-SR { background: linear-gradient(45deg, #f5a623, #e94e77); }
  .item-slot .cost-tag {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(255,193,7,.9); color: #212529;
    font-size: .6rem; font-weight: bold; text-align: center;
  }

  /* ---- ミッション ---- */
  .mission-item {
    border: 1px solid #e9ecef; border-radius: .75rem;
    padding: .6rem .8rem; margin-bottom: .5rem; background: #fff;
  }
  .mission-item.complete { background: #fffcf0; border-color: #ffe69c; }
  .mission-item.claimed { opacity: .55; }
  .mission-type-badge { font-size: .65rem; }

  /* ---- バッジ ---- */
  .badge-icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffe9a8, #ffc107);
    color: #7a5c00; font-size: 1.5rem;
    box-shadow: 0 2px 5px rgba(0,0,0,.15);
  }
  .badge-icon.locked { background: #e9ecef; color: #adb5bd; box-shadow: none; }
  .badge-icon img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  /* ---- ランキング ---- */
  .ranking-item {
    display: flex; align-items: center; gap: .6rem;
    padding: .4rem .6rem; border-radius: .5rem;
  }
  .ranking-item:nth-child(odd) { background: #f8f9fa; }
  .rank-medal { font-weight: bold; width: 2rem; text-align: center; }

  /* ---- スクロールバー ---- */
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 3px; }

  /* ---- 記録フォームカード ---- */
  .record-form-card { border: 0; border-radius: var(--mq-radius); }
  .record-form-card .card-header {
    background: transparent; border: 0; font-weight: bold; padding-bottom: 0;
  }
  .record-menu-btn {
    border-radius: var(--mq-radius);
    padding: 1rem .5rem;
    text-align: center; width: 100%;
    border: 2px solid #e9ecef; background: #fff;
    transition: transform .1s, border-color .15s;
  }
  .record-menu-btn:hover { transform: translateY(-2px); border-color: var(--bs-primary); }
  .record-menu-btn .emoji { font-size: 1.8rem; display: block; }

  .table-record td, .table-record th { font-size: .85rem; }

  /* ---- 学習アプリのきろく送信パネル ---- */
  .send-card {
    border: 0; border-radius: var(--mq-radius);
    background: linear-gradient(135deg, #eaf3ff, #f6ecff);
    box-shadow: 0 .25rem .75rem rgba(74, 144, 226, .18);
  }
  .send-card.has-pending { background: linear-gradient(135deg, #fff3d6, #ffe6ec); }
  .send-card .send-btn { border-radius: 999px; padding: .7rem 1.6rem; font-size: 1.05rem; }
  .send-card .reward-chip {
    display: inline-block; background: #fff; border: 1px solid #e3edf9;
    border-radius: 999px; padding: .1rem .6rem; font-size: .78rem; font-weight: bold;
    margin: .15rem .2rem 0 0;
  }
  .send-pending-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.2rem; height: 2.2rem; padding: 0 .5rem;
    border-radius: 999px; background: #dc3545; color: #fff; font-weight: bold;
  }

  /* ---- ポータル埋め込み時（親ページにヘッダーがあるので余白を詰める） ---- */
  body.embedded footer { display: none; }
  body.embedded #main-content { padding-top: .75rem !important; }

  /* ---- 星評価 ---- */
  .star-rating { cursor: pointer; font-size: 1.4rem; color: #ffc107; user-select: none; }
  .star-rating .star.off { color: #dee2e6; }

  @media (max-width: 767.98px) {
    /* 高さを詰めてコンテンツ領域を広げつつ、指で押しやすい大きさは確保する */
    .nav-tab { font-size: .82rem; padding: .6rem .25rem !important; min-height: 44px; }
  }

  /* ---- ふりがな（ルビ）: 低学年向けに漢字の上へ読みを表示 ---- */
  ruby { ruby-align: center; }
  ruby rt {
    font-size: .6em;
    font-weight: normal;
    color: #6c757d;
    user-select: none;
    letter-spacing: 0;
  }
  /* ルビの高さぶん行間を確保して重なりを防ぐ */
  .furigana-on { line-height: 2.1; }
  .furigana-on .btn,
  .furigana-on .badge,
  .furigana-on .nav-tab { line-height: 1.7; }
</style>
