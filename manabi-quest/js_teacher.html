<script>
/* =====================================================================
 * js_teacher.html — 教員用ビュー
 * ===================================================================== */

function initTeacherApp(data) {
  document.getElementById('nav-nickname').textContent = `${data.teacherName} 先生`;
  renderTeacherDashboard(data);
  renderTeacherStudentSelects(data.students);
  renderAnnouncements('t-announcements-list', data.announcements, true);
  bindTeacherEvents();
  bindAnnouncementDeletes();
  bindShokenStudioEvents();
  bindGradesEvents();
  bindStudyLogEvents();
}

/* ---------------- ダッシュボード ---------------- */

function renderTeacherDashboard(data) {
  const stats = data.classStats || {};
  document.getElementById('t-stats-cards').innerHTML = `
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body">
        <div class="text-muted small fw-bold">児童数</div>
        <div class="fs-3 fw-bold text-primary">${stats.studentCount ?? '-'}</div>
      </div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body">
        <div class="text-muted small fw-bold">今週記録した児童</div>
        <div class="fs-3 fw-bold text-success">${stats.weeklyActiveCount ?? '-'}<span class="fs-6 text-muted">人</span></div>
      </div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body">
        <div class="text-muted small fw-bold">今週の記録件数</div>
        <div class="fs-3 fw-bold text-info">${Object.values(stats.weeklyRecords || {}).reduce((a, b) => a + b, 0)}<span class="fs-6 text-muted">件</span></div>
      </div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body">
        <div class="text-muted small fw-bold">AI所見機能</div>
        <div class="fs-5 fw-bold ${data.aiEnabled ? 'text-success' : 'text-secondary'}">${data.aiEnabled ? '利用可能' : '未設定'}</div>
      </div></div>
    </div>`;

  renderStudentAlerts(data.alerts || []);

  // 児童一覧テーブル
  const tbody = document.querySelector('#t-student-table tbody');
  tbody.innerHTML = data.students.map(s => `
    <tr>
      <td>${esc(String(s.number))}</td>
      <td class="fw-bold">${esc(s.name)}</td>
      <td><span class="badge bg-warning text-dark">Lv.${s.level}</span></td>
      <td>${s.totalExp}</td>
      <td class="small text-muted">${esc(s.lastLogin || '-')}</td>
      <td><button class="btn btn-sm btn-outline-primary t-detail-link" data-email="${esc(s.email)}"><i class="bi bi-search"></i></button></td>
    </tr>`).join('');
  tbody.querySelectorAll('.t-detail-link').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('t-student-select').value = btn.dataset.email;
      showView('view-t-student', { push: true });
      loadStudentDetail(btn.dataset.email);
    });
  });

  // 今週の記録件数
  const weekly = stats.weeklyRecords || {};
  document.getElementById('t-weekly-records').innerHTML = Object.keys(weekly).map(label => `
    <div class="d-flex justify-content-between border-bottom py-1">
      <span>${esc(label)}</span><b>${weekly[label]}件</b>
    </div>`).join('') || emptyMessage('データがありません');
}

function renderStudentAlerts(alerts) {
  const area = document.getElementById('t-alerts-area');
  if (!alerts || alerts.length === 0) {
    area.innerHTML = `
      <div class="card shadow-sm border-0 rounded-4 bg-success-subtle">
        <div class="card-body py-2 small"><i class="bi bi-check-circle-fill text-success"></i> いま特に気になる児童はいません。みんな順調です。</div>
      </div>`;
    return;
  }
  area.innerHTML = `
    <div class="card shadow-sm border-warning rounded-4">
      <div class="card-header bg-warning text-dark fw-bold">
        <i class="bi bi-eye"></i> 声かけリスト（${alerts.length}人）
        <span class="fw-normal small">— 気になる様子の児童です。詳細やふり返りを確認してみましょう。</span>
      </div>
      <div class="card-body p-2">
        <div class="row g-2">
          ${alerts.map(a => `
            <div class="col-md-6 col-lg-4">
              <div class="border rounded-3 p-2 h-100 t-alert-card" role="button" data-email="${esc(a.email)}">
                <div class="fw-bold">${esc(String(a.number))} ${esc(a.name)} <i class="bi bi-chevron-right small text-muted"></i></div>
                ${a.reasons.map(r => `<div class="small text-muted">${r.icon} ${esc(r.text)}</div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  area.querySelectorAll('.t-alert-card').forEach(card => {
    card.addEventListener('click', () => {
      document.getElementById('t-student-select').value = card.dataset.email;
      showView('view-t-student', { push: true });
      loadStudentDetail(card.dataset.email);
    });
  });
}

function renderTeacherStudentSelects(students) {
  const options = students.map(s => `<option value="${esc(s.email)}">${esc(String(s.number))} ${esc(s.name)}</option>`).join('');
  const numberOptions = students.map(s => `<option value="${esc(String(s.number))}">${esc(String(s.number))} ${esc(s.name)}</option>`).join('');
  document.getElementById('t-student-select').innerHTML = `<option value="">選択してください</option>` + options;
  document.getElementById('t-shoken-student').innerHTML = `<option value="">児童を選択</option>` + numberOptions;
  document.getElementById('ts-student-select').innerHTML = `<option value="">児童を選択</option>` + numberOptions;
  document.getElementById('t-grant-checkboxes').innerHTML = students.map(s => `
    <div class="form-check">
      <input class="form-check-input t-grant-check" type="checkbox" value="${esc(s.email)}" id="grant-${esc(String(s.number))}">
      <label class="form-check-label small" for="grant-${esc(String(s.number))}">${esc(String(s.number))} ${esc(s.name)}</label>
    </div>`).join('');
}

/* ---------------- 先生からのひとこと ---------------- */

/**
 * 児童ひとりへ、ほめる言葉をワンタップで送ります。
 * お知らせシートの「宛先」つきの行として保存され、その児童のホームにだけ出ます。
 */
function openPraiseDialog(email, nickname) {
  const stamps = (App.data && App.data.praiseStamps) || [];
  Swal.fire({
    title: `${nickname} さんへひとこと`,
    html: `
      <div class="text-start">
        <label class="form-label small fw-bold">スタンプ（えらぶだけでも送れます）</label>
        <select id="praise-stamp" class="form-select mb-2">
          <option value="">（スタンプなし）</option>
          ${stamps.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}
        </select>
        <label class="form-label small fw-bold">ひとこと（任意・200文字まで）</label>
        <textarea id="praise-message" class="form-control" rows="3" maxlength="200"
                  placeholder="例: 今日の発表、みんなにわかりやすく話せていました。"></textarea>
        <div class="form-text">この児童のホームの「おしらせ」にだけ表示されます。</div>
      </div>`,
    showCancelButton: true, confirmButtonText: '送る', cancelButtonText: 'やめる',
    preConfirm: () => ({
      email,
      stamp: document.getElementById('praise-stamp').value,
      message: document.getElementById('praise-message').value
    })
  }).then(async result => {
    if (!result.isConfirmed) return;
    const res = await apiWithLoading('送信中...', 'sendTeacherPraise', result.value);
    if (res.success) toast(res.message);
    else Swal.fire('送れません', esc(res.message), 'warning');
  });
}

/* ---------------- 児童の詳細 ---------------- */

async function loadStudentDetail(email) {
  if (!email) return;
  const container = document.getElementById('t-student-detail');
  container.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>`;
  try {
    const result = await api('getStudentDetails', email);
    if (!result.success) {
      container.innerHTML = `<div class="alert alert-warning">${esc(result.message)}</div>`;
      return;
    }
    const d = result.data;
    const r = d.records;
    const summaryCards = [
      { label: 'レベル', value: `Lv.${d.profile.level}`, cls: 'text-primary' },
      { label: '累計EXP', value: d.profile.totalExp, cls: 'text-info' },
      { label: 'タイピング', value: `${r.typing.length}回`, cls: 'text-success' },
      { label: '読書', value: `${r.reading.summary.totalBooks}冊`, cls: 'text-success' },
      { label: '自主学習', value: `${r.study.length}回`, cls: 'text-success' },
      { label: 'ふり返り', value: `${r.lesson.length}回`, cls: 'text-success' }
    ];
    container.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="fw-bold mb-0">${esc(String(d.profile.number))} ${esc(d.profile.name)} さんの記録</h5>
        <div class="d-flex gap-2">
          <button id="t-praise-btn" class="btn btn-danger btn-sm fw-bold" data-email="${esc(email)}" data-name="${esc(d.profile.nickname)}"><i class="bi bi-chat-heart"></i> ひとことを送る</button>
          <button id="t-interview-btn" class="btn btn-outline-primary btn-sm fw-bold" data-email="${esc(email)}"><i class="bi bi-file-earmark-person"></i> 面談メモPDF</button>
        </div>
      </div>
      <div class="row g-2 mb-3">
        ${summaryCards.map(c => `<div class="col-4 col-md-2">
          <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body p-2">
            <div class="small text-muted fw-bold">${c.label}</div>
            <div class="fs-5 fw-bold ${c.cls}">${esc(String(c.value))}</div>
          </div></div>
        </div>`).join('')}
      </div>
      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="fw-bold text-primary mb-0">✍️ 最近の授業のふり返り</h6>
              <select id="t-lesson-filter" class="form-select form-select-sm" style="max-width:130px;">
                <option value="">すべて</option>
                ${[...new Set(r.lesson.map(l => l.subject))].map(s => `<option>${esc(s)}</option>`).join('')}
              </select>
            </div>
            <div id="t-lesson-list"></div>
          </div></div>
          <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
            <h6 class="fw-bold text-danger">📝 テストのふり返り</h6>
            ${r.test.slice(0, 8).map(t => `
              <div class="border-bottom py-1 small">
                <b>${esc(t.subject)} / ${esc(t.unit)}</b>
                （${esc(String(t.score1 ?? ''))}${t.score2 !== '' && t.score2 !== null ? ` / ${esc(String(t.score2))}` : ''}点）
                ${esc(t.reflection || '')}
              </div>`).join('') || emptyMessage('記録なし')}
          </div></div>
          <div class="card shadow-sm border-0 rounded-4"><div class="card-body">
            <h6 class="fw-bold" style="color:#d63384;">💖 道徳ノート</h6>
            ${r.moral.slice(0, 5).map(m => `
              <div class="border-bottom py-1 small">
                <b>${esc(m.materialName)}</b>（${m.date}）<br>${esc(m.myThought)}
              </div>`).join('') || emptyMessage('記録なし')}
          </div></div>
        </div>
        <div class="col-lg-6">
          <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
            <h6 class="fw-bold text-success">🌱 成長のきろく・💡 自主学習</h6>
            ${d.records.growth.slice(0, 5).map(g => `<div class="border-bottom py-1 small">🌱 ${g.date} ${esc(g.content)}</div>`).join('')}
            ${d.records.study.slice(0, 5).map(s => `<div class="border-bottom py-1 small">💡 ${s.date} <b>${esc(s.theme)}</b> ${esc(s.summary)}</div>`).join('')}
            ${d.records.growth.length + d.records.study.length === 0 ? emptyMessage('記録なし') : ''}
          </div></div>
          <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
            <h6 class="fw-bold text-warning-emphasis">📖 読書のきろく</h6>
            ${r.reading.records.slice(0, 6).map(b => `<div class="border-bottom py-1 small">${b.date} <b>${esc(b.title)}</b>（${b.pages}p）</div>`).join('') || emptyMessage('記録なし')}
          </div></div>
          ${studentStudyLogCard(d.studyLog)}
          <div class="card shadow-sm border-0 rounded-4"><div class="card-body">
            <h6 class="fw-bold text-info">🕐 最近のアプリ内活動</h6>
            <div class="custom-scrollbar" style="max-height:220px;overflow-y:auto;">
            ${d.recentActivity.slice(0, 15).map(a => `
              <div class="d-flex gap-2 border-bottom py-1 small">
                <span class="text-muted" style="min-width:2.6rem;">${fmtDate(a.timestamp)}</span><span>${esc(a.message)}</span>
              </div>`).join('') || emptyMessage('記録なし')}
            </div>
          </div></div>
        </div>
      </div>`;

    // 授業のふり返り: 教科フィルター
    const renderLessonList = subject => {
      const filtered = subject ? r.lesson.filter(l => l.subject === subject) : r.lesson;
      document.getElementById('t-lesson-list').innerHTML = filtered.slice(0, 12).map(l => `
        <div class="border-bottom py-1 small">
          <span class="badge bg-light text-dark border">${esc(l.subject)}</span>
          <span class="text-muted">${l.date}</span> ${esc(l.reflection)}
        </div>`).join('') || emptyMessage('記録なし');
    };
    renderLessonList('');
    document.getElementById('t-lesson-filter').addEventListener('change', e2 => renderLessonList(e2.target.value));

    // 先生からのひとこと（その児童のホームの「おしらせ」にだけ届きます）
    document.getElementById('t-praise-btn').addEventListener('click', ev => {
      openPraiseDialog(ev.currentTarget.dataset.email, ev.currentTarget.dataset.name);
    });

    // 面談メモPDF
    document.getElementById('t-interview-btn').addEventListener('click', async ev => {
      const result = await apiWithLoading('面談メモを作成しています...', 'createInterviewSheet', ev.currentTarget.dataset.email);
      if (result.success) {
        Swal.fire({
          icon: 'success', title: '面談メモを作成しました',
          html: `${esc(result.message)}<br><a href="${esc(result.fileUrl)}" target="_blank" class="btn btn-primary btn-sm mt-2"><i class="bi bi-box-arrow-up-right"></i> PDFを開く</a>`
        });
      } else {
        Swal.fire('エラー', esc(result.message), 'error');
      }
    });
  } catch (e) {
    container.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}

/* ---------------- イベント ---------------- */

function bindAnnouncementDeletes() {
  document.getElementById('t-announcements-list').addEventListener('click', async e => {
    const btn = e.target.closest('.del-announce-btn');
    if (!btn) return;
    const confirm = await Swal.fire({ title: 'お知らせを削除しますか？', icon: 'warning', showCancelButton: true, confirmButtonText: '削除', cancelButtonText: 'やめる' });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('削除中...', 'deleteAnnouncement', Number(btn.dataset.row));
    if (result.success) {
      renderAnnouncements('t-announcements-list', result.announcements, true);
      toast('削除しました');
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });
}

function bindTeacherEvents() {
  // 児童詳細
  document.getElementById('t-view-student-btn').addEventListener('click', () => {
    loadStudentDetail(document.getElementById('t-student-select').value);
  });

  // ポイント配布
  document.getElementById('t-grant-select-all').addEventListener('click', () => {
    document.querySelectorAll('.t-grant-check').forEach(c => c.checked = true);
  });
  document.getElementById('t-grant-clear').addEventListener('click', () => {
    document.querySelectorAll('.t-grant-check').forEach(c => c.checked = false);
  });
  document.getElementById('t-grant-btn').addEventListener('click', async () => {
    const emails = [...document.querySelectorAll('.t-grant-check:checked')].map(c => c.value);
    const amount = Number(document.getElementById('t-point-amount').value);
    const type = document.querySelector('input[name="t-point-type"]:checked').value;
    const reason = document.getElementById('t-grant-reason').value;
    if (emails.length === 0) { Swal.fire('確認', '児童を選択してください。', 'info'); return; }
    if (!amount || amount <= 0) { Swal.fire('確認', '配布量を入力してください。', 'info'); return; }
    const result = await apiWithLoading('配布中...', 'grantPoints', { emails, type, amount, reason });
    if (result.success) {
      toast(result.message);
      document.getElementById('t-point-amount').value = '';
      document.getElementById('t-grant-reason').value = '';
      document.querySelectorAll('.t-grant-check').forEach(c => c.checked = false);
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // お知らせ投稿
  document.getElementById('t-post-announcement-btn').addEventListener('click', async () => {
    const message = document.getElementById('t-announcement-message').value.trim();
    const endDate = document.getElementById('t-announcement-end').value || null;
    if (!message) { Swal.fire('確認', 'お知らせの内容を入力してください。', 'info'); return; }
    const result = await apiWithLoading('投稿中...', 'postAnnouncement', { message, endDate });
    if (result.success) {
      renderAnnouncements('t-announcements-list', result.announcements, true);
      document.getElementById('t-announcement-message').value = '';
      document.getElementById('t-announcement-end').value = '';
      toast('お知らせを投稿しました');
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // PDF作成
  document.getElementById('t-create-pdf-btn').addEventListener('click', async () => {
    const term = Number(document.getElementById('t-pdf-term').value);
    const confirm = await Swal.fire({
      title: `${term}学期のポートフォリオPDF`,
      text: '全児童分のPDFを作成します。数分かかることがあります。',
      icon: 'question', showCancelButton: true, confirmButtonText: '作成する', cancelButtonText: 'やめる'
    });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('PDFを作成しています...（数分かかることがあります）', 'createPortfolioPdf', term);
    if (result.success) {
      Swal.fire({
        icon: 'success', title: 'PDFを作成しました',
        html: `${esc(result.message)}<br><a href="${esc(result.fileUrl)}" target="_blank" class="btn btn-primary btn-sm mt-2"><i class="bi bi-box-arrow-up-right"></i> PDFを開く</a>`
      });
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // がんばり賞状PDF
  document.getElementById('t-create-cert-btn').addEventListener('click', async () => {
    const term = Number(document.getElementById('t-pdf-term').value);
    const confirm = await Swal.fire({
      title: `${term}学期のがんばり賞状PDF`,
      text: '全児童分の賞状を作成します。数分かかることがあります。',
      icon: 'question', showCancelButton: true, confirmButtonText: '作成する', cancelButtonText: 'やめる'
    });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('賞状を作成しています...（数分かかることがあります）', 'createCertificatePdf', term);
    if (result.success) {
      Swal.fire({
        icon: 'success', title: '賞状を作成しました',
        html: `${esc(result.message)}<br><a href="${esc(result.fileUrl)}" target="_blank" class="btn btn-primary btn-sm mt-2"><i class="bi bi-box-arrow-up-right"></i> PDFを開く</a>`
      });
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // 所見材料保存（手入力メモ）
  document.getElementById('t-shoken-save-btn').addEventListener('click', async () => {
    const studentNumber = document.getElementById('t-shoken-student').value;
    const category = document.getElementById('t-shoken-category').value;
    const episode = document.getElementById('t-shoken-episode').value.trim();
    if (!studentNumber || !episode) { Swal.fire('確認', '児童とエピソードを入力してください。', 'info'); return; }
    const result = await apiWithLoading('保存中...', 'saveShokenMaterial', { studentNumber, category, episode });
    if (result.success) {
      toast(result.message);
      document.getElementById('t-shoken-episode').value = '';
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });
}

/* ---------------- AI所見スタジオ ---------------- */

const TS_SUBJECTS = ['国語', '社会', '算数', '理科', '英語', '音楽', '図工', '家庭', '体育', '総合', '学活', '道徳'];
const TS_VIEWPOINT_BADGES = {
  '知識・技能': 'bg-primary',
  '思考・判断・表現': 'bg-success',
  '主体的に学習に取り組む態度': 'bg-warning text-dark'
};
let tsStudioLoaded = false;

async function loadShokenStudio(force) {
  if (tsStudioLoaded && !force) return;
  const cards = document.getElementById('ts-status-cards');
  cards.innerHTML = `<div class="text-center py-4 w-100"><div class="spinner-border text-primary"></div></div>`;
  try {
    const result = await api('getShokenStudio');
    if (!result.success) {
      cards.innerHTML = `<div class="col-12"><div class="alert alert-warning mb-0">${esc(result.message)}</div></div>`;
      return;
    }
    tsStudioLoaded = true;
    renderShokenStudio(result);
  } catch (e) {
    cards.innerHTML = `<div class="col-12"><div class="alert alert-danger mb-0">${esc(e.message)}</div></div>`;
  }
}

function renderShokenStudio(d) {
  const pendingTotal = ((d.pending && d.pending.lesson) || 0) + ((d.pending && d.pending.test) || 0);
  const statusCard = (label, value, cls) => `
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body">
        <div class="text-muted small fw-bold">${label}</div>
        <div class="fs-5 fw-bold ${cls}">${value}</div>
      </div></div>
    </div>`;
  document.getElementById('ts-status-cards').innerHTML =
    statusCard('AI機能', d.aiEnabled ? '利用可能' : '未設定', d.aiEnabled ? 'text-success' : 'text-secondary') +
    statusCard('保存時の自動抽出', d.autoExtract ? 'ON' : 'OFF', d.autoExtract ? 'text-success' : 'text-secondary') +
    statusCard('未処理のふり返り', `${pendingTotal}件`, pendingTotal > 0 ? 'text-danger' : 'text-success') +
    statusCard('所見材料ストック', `${d.totalMaterials ?? 0}件`, 'text-info');

  document.getElementById('ts-pending-count').textContent = pendingTotal;

  // 児童別の材料件数（材料が少ない児童の確認用）
  const students = (App.data && App.data.students) || [];
  const counts = d.materialCounts || {};
  document.getElementById('ts-count-summary').innerHTML = students.map(s => {
    const c = counts[String(s.number)] || 0;
    return `<span class="badge ${c === 0 ? 'bg-danger-subtle text-danger border border-danger' : 'bg-light text-dark border'}">${esc(String(s.number))} ${esc(s.name)}: ${c}件</span>`;
  }).join('') || '';

  renderTeachingPointList(d.teachingPoints || []);
}

function renderTeachingPointList(points) {
  document.getElementById('ts-tp-list').innerHTML = points.slice().reverse().map(tp => `
    <div class="border-bottom py-2 small d-flex justify-content-between gap-2">
      <div>
        <span class="badge bg-light text-dark border">${esc(tp.subject)}</span>
        <span class="text-muted">${esc(tp.date)}</span>
        ${tp.unit ? `<b>${esc(tp.unit)}</b><br>` : '<br>'}
        ${esc(tp.points)}
        ${tp.evalPoints ? `<div class="text-muted">評価: ${esc(tp.evalPoints)}</div>` : ''}
      </div>
      <button class="btn btn-sm btn-outline-danger ts-tp-del align-self-start" data-row="${tp.row}"><i class="bi bi-trash"></i></button>
    </div>`).join('') || emptyMessage('指導事項はまだ登録されていません');
}

function renderShokenMaterials(materials) {
  const container = document.getElementById('ts-material-list');
  container.innerHTML = (materials || []).map(m => `
    <div class="border-bottom py-2 small d-flex justify-content-between gap-2">
      <div>
        <span class="badge bg-light text-dark border">${esc(m.category)}</span>
        ${m.viewpoint ? `<span class="badge ${TS_VIEWPOINT_BADGES[m.viewpoint] || 'bg-secondary'}">${esc(m.viewpoint)}</span>` : ''}
        ${m.quality ? `<span class="text-warning">${'★'.repeat(m.quality)}</span>` : ''}
        <span class="text-muted">${esc(m.date)}</span>
        ${m.unit ? `<span class="text-muted">｜${esc(m.unit)}</span>` : ''}
        <div>${esc(m.episode)}</div>
        ${m.source ? `<div class="text-muted" style="font-size:.75rem;">出典: ${esc(m.source)}</div>` : ''}
      </div>
      <button class="btn btn-sm btn-outline-danger ts-mat-del align-self-start" data-row="${m.row}"><i class="bi bi-trash"></i></button>
    </div>`).join('') || emptyMessage('この児童の所見材料はまだありません');
}

async function loadShokenMaterials() {
  const studentNumber = document.getElementById('ts-student-select').value;
  if (!studentNumber) { Swal.fire('確認', '児童を選択してください。', 'info'); return; }
  const container = document.getElementById('ts-material-list');
  container.innerHTML = `<div class="text-center py-3"><div class="spinner-border text-primary spinner-border-sm"></div></div>`;
  loadMoralMaterialsForStudent(studentNumber);
  try {
    const result = await api('getShokenMaterials', studentNumber);
    if (!result.success) { container.innerHTML = `<div class="alert alert-warning">${esc(result.message)}</div>`; return; }
    renderShokenMaterials(result.materials);
  } catch (e) {
    container.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}

async function loadMoralMaterialsForStudent(studentNumber) {
  const select = document.getElementById('ts-moral-material');
  select.innerHTML = `<option value="">読み込み中...</option>`;
  document.getElementById('ts-moral-draft-area').classList.add('d-none');
  try {
    const result = await api('getStudentMoralList', studentNumber);
    if (!result.success || result.materials.length === 0) {
      select.innerHTML = `<option value="">道徳ノートの記録がありません</option>`;
      return;
    }
    select.innerHTML = result.materials.map(m => `<option value="${esc(m.materialName)}">${esc(m.materialName)}${m.date ? `（${m.date}）` : ''}</option>`).join('');
  } catch (e) {
    select.innerHTML = `<option value="">読み込みに失敗しました</option>`;
  }
}

function bindShokenStudioEvents() {
  // タブを最初に開いたときに読み込む
  document.querySelectorAll('[data-view="view-t-shoken"]').forEach(tab => {
    tab.addEventListener('click', () => loadShokenStudio(false));
  });
  document.getElementById('ts-reload-btn').addEventListener('click', () => loadShokenStudio(true));

  // 指導事項フォーム
  document.getElementById('ts-tp-subject').innerHTML = TS_SUBJECTS.map(s => `<option>${s}</option>`).join('');
  const today = new Date();
  document.getElementById('ts-tp-date').value =
    `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  document.getElementById('ts-tp-save-btn').addEventListener('click', async () => {
    const data = {
      date: document.getElementById('ts-tp-date').value,
      subject: document.getElementById('ts-tp-subject').value,
      unit: document.getElementById('ts-tp-unit').value.trim(),
      points: document.getElementById('ts-tp-points').value.trim(),
      evalPoints: document.getElementById('ts-tp-eval').value.trim()
    };
    if (!data.subject || (!data.unit && !data.points)) {
      Swal.fire('確認', '教科と、単元名または指導事項・ねらいを入力してください。', 'info');
      return;
    }
    const result = await apiWithLoading('登録中...', 'saveTeachingPoint', data);
    if (result.success) {
      toast(result.message);
      document.getElementById('ts-tp-unit').value = '';
      document.getElementById('ts-tp-points').value = '';
      document.getElementById('ts-tp-eval').value = '';
      loadShokenStudio(true);
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // 指導事項の一括登録
  document.getElementById('ts-tp-bulk-toggle').addEventListener('click', () => {
    document.getElementById('ts-tp-bulk-area').classList.toggle('d-none');
  });
  document.getElementById('ts-tp-bulk-save-btn').addEventListener('click', async () => {
    const text = document.getElementById('ts-tp-bulk-text').value.trim();
    if (!text) { Swal.fire('確認', '貼り付けるテキストを入力してください。', 'info'); return; }
    const result = await apiWithLoading('登録中...', 'saveTeachingPointsBulk', text);
    if (result.success) {
      toast(result.message);
      document.getElementById('ts-tp-bulk-text').value = '';
      document.getElementById('ts-tp-bulk-area').classList.add('d-none');
      loadShokenStudio(true);
    } else {
      Swal.fire(result.message.includes('登録しました') ? '一部登録' : 'エラー', esc(result.message), result.message.includes('登録しました') ? 'info' : 'error');
    }
  });

  // 指導事項削除
  document.getElementById('ts-tp-list').addEventListener('click', async e => {
    const btn = e.target.closest('.ts-tp-del');
    if (!btn) return;
    const confirm = await Swal.fire({ title: 'この指導事項を削除しますか？', icon: 'warning', showCancelButton: true, confirmButtonText: '削除', cancelButtonText: 'やめる' });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('削除中...', 'deleteTeachingPoint', Number(btn.dataset.row));
    if (result.success) { toast('削除しました'); loadShokenStudio(true); }
    else { Swal.fire('エラー', esc(result.message), 'error'); }
  });

  // 一括AI抽出
  document.getElementById('ts-extract-btn').addEventListener('click', async () => {
    const confirm = await Swal.fire({
      title: '所見材料のAI抽出',
      text: '未処理のふり返りをAIが分析し、所見材料をストックします。件数によっては数分かかります。',
      icon: 'question', showCancelButton: true, confirmButtonText: '実行する', cancelButtonText: 'やめる'
    });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('AIがふり返りを分析しています...', 'runShokenExtraction');
    if (result.success) {
      Swal.fire('抽出完了', esc(result.message), 'success');
      loadShokenStudio(true);
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // 児童別ストック表示
  document.getElementById('ts-load-materials-btn').addEventListener('click', loadShokenMaterials);
  document.getElementById('ts-student-select').addEventListener('change', () => {
    document.getElementById('ts-draft-area').classList.add('d-none');
    document.getElementById('ts-moral-draft-area').classList.add('d-none');
    if (document.getElementById('ts-student-select').value) loadShokenMaterials();
  });

  // 全児童分の全体所見ドラフトを一括生成
  document.getElementById('ts-bulk-draft-btn').addEventListener('click', async () => {
    const confirm = await Swal.fire({
      title: '全児童の全体所見ドラフトを生成',
      text: '所見材料があり、まだドラフトのない児童分をまとめて生成します（数分かかることがあります）。',
      icon: 'question', showCancelButton: true, confirmButtonText: '生成する', cancelButtonText: 'やめる'
    });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('AIが全体所見をまとめて作成しています...', 'runBulkGeneralShokenDraft');
    if (result.success) { Swal.fire('生成完了', esc(result.message), 'success'); loadShokenStudio(true); }
    else Swal.fire('エラー', esc(result.message), 'error');
  });

  // 道徳所見の生成
  document.getElementById('ts-moral-gen-btn').addEventListener('click', async () => {
    const studentNumber = document.getElementById('ts-student-select').value;
    const materialName = document.getElementById('ts-moral-material').value;
    if (!studentNumber) { Swal.fire('確認', '上の欄で児童を選択してください。', 'info'); return; }
    if (!materialName) { Swal.fire('確認', '教材を選択してください。', 'info'); return; }
    const result = await apiWithLoading('AIが道徳所見を作成しています...', 'generateMoralShokenDraft', { studentNumber, materialName });
    if (result.success) {
      document.getElementById('ts-moral-output').value = result.text;
      document.getElementById('ts-moral-draft-area').classList.remove('d-none');
      toast(`道徳所見を生成しました（${result.length}字）`);

      Swal.fire('エラー', esc(result.message), 'error');
    }
  });
  document.getElementById('ts-copy-moral-btn').addEventListener('click', () => copyTextarea('ts-moral-output'));

  // 所見材料削除
  document.getElementById('ts-material-list').addEventListener('click', async e => {
    const btn = e.target.closest('.ts-mat-del');
    if (!btn) return;
    const confirm = await Swal.fire({ title: 'この所見材料を削除しますか？', icon: 'warning', showCancelButton: true, confirmButtonText: '削除', cancelButtonText: 'やめる' });
    if (!confirm.isConfirmed) return;
    const studentNumber = document.getElementById('ts-student-select').value;
    const result = await apiWithLoading('削除中...', 'deleteShokenMaterial', { rowNum: Number(btn.dataset.row), studentNumber });
    if (result.success) { toast('削除しました'); renderShokenMaterials(result.materials); }
    else { Swal.fire('エラー', esc(result.message), 'error'); }
  });

  // 所見ドラフト生成
  document.getElementById('ts-draft-btn').addEventListener('click', async () => {
    const studentNumber = document.getElementById('ts-student-select').value;
    if (!studentNumber) { Swal.fire('確認', '児童を選択してください。', 'info'); return; }
    const result = await apiWithLoading('AIが所見ドラフトを作成しています...', 'generateShokenDraft', studentNumber);
    if (result.success) {
      document.getElementById('ts-draft-output').value = result.text;
      document.getElementById('ts-draft-area').classList.remove('d-none');
      toast(`所見ドラフトを生成しました（${result.length}字）`);
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });

  // ドラフトコピー
  document.getElementById('ts-copy-draft-btn').addEventListener('click', () => copyTextarea('ts-draft-output'));

  // 要録用（だ・である調）に変換
  document.getElementById('ts-youroku-btn').addEventListener('click', async () => {
    const text = document.getElementById('ts-draft-output').value.trim();
    if (!text) { Swal.fire('確認', '変換する所見がありません。', 'info'); return; }
    const result = await apiWithLoading('AIが要録用に変換しています...', 'convertShokenToYouroku', text);
    if (result.success) {
      document.getElementById('ts-youroku-output').value = result.text;
      document.getElementById('ts-youroku-area').classList.remove('d-none');
      toast(`要録用に変換しました（${result.length}字）`);
    } else {
      Swal.fire('エラー', esc(result.message), 'error');
    }
  });
  document.getElementById('ts-copy-youroku-btn').addEventListener('click', () => copyTextarea('ts-youroku-output'));
}

async function copyTextarea(id) {
  const el = document.getElementById(id);
  try {
    await navigator.clipboard.writeText(el.value);
  } catch (e) {
    el.select();
    document.execCommand('copy');
  }
  toast('コピーしました');
}

/* ---------------- 学習アプリ（study.v1 共通学習ログ） ---------------- */

let tlLoaded = false;

/** 分 → 表示用の時間文字列 */
function fmtStudyMinutes(min) {
  if (!min || min <= 0) return '0分';
  return min >= 60 ? `${Math.floor(min / 60)}時間${min % 60 > 0 ? `${min % 60}分` : ''}` : `${min}分`;
}

/** レコードの注意フラグ（比較に注意が必要な条件）をバッジ列にします */
function studyFlagBadges(r) {
  const badges = [];
  if (r.multiplayer) badges.push('<span class="badge bg-danger-subtle text-danger border border-danger">対戦</span>');
  if (r.grading === 'selfReport') badges.push('<span class="badge bg-info-subtle text-info-emphasis border border-info">自己評価</span>');
  if (r.grading === 'mixed') badges.push('<span class="badge bg-info-subtle text-info-emphasis border border-info">混合採点</span>');
  if (r.source === 'weak') badges.push('<span class="badge bg-warning-subtle text-warning-emphasis border border-warning">にがて</span>');
  if (r.source === 'review') badges.push('<span class="badge bg-secondary-subtle text-secondary border">復習</span>');
  if (r.source === 'custom') badges.push('<span class="badge bg-secondary-subtle text-secondary border">じさく</span>');
  // 中断が正常な使い方であるアプリ（Typa）は「中断」と出しません（仕様 §5.4）。
  // 区切りを設けないことで、すきま時間の練習を成立させているアプリです。
  // ここで「中断」と並べると、こまめに練習した児童ほど中断が多い子に見えてしまいます。
  if (r.status === 'aborted') {
    badges.push(r.abortNormal
      ? '<span class="badge bg-success-subtle text-success-emphasis border border-success">すきま練習</span>'
      : '<span class="badge bg-light text-secondary border">中断</span>');
  }
  return badges.join(' ');
}

async function loadStudyLog(force) {
  if (tlLoaded && !force) return;
  const cards = document.getElementById('tl-stats-cards');
  cards.innerHTML = `<div class="text-center py-4 w-100"><div class="spinner-border text-primary"></div></div>`;
  try {
    const result = await api('getStudyLogDashboard', document.getElementById('tl-period').value);
    if (!result.success) {
      cards.innerHTML = `<div class="col-12"><div class="alert alert-warning mb-0">${esc(result.message)}</div></div>`;
      return;
    }
    tlLoaded = true;
    renderStudyLog(result);
  } catch (e) {
    cards.innerHTML = `<div class="col-12"><div class="alert alert-danger mb-0">${esc(e.message)}</div></div>`;
  }
}

function renderStudyLog(d) {
  // 受信設定の案内。まだ1件も届いていないときだけ、送信のしくみを出します。
  // （学習ログは学習ポータル経由でいつでも受信できる状態です。
  //   「学習ログ送信キー」は匿名の受信用デプロイを使うときだけ必要です）
  const note = document.getElementById('tl-setup-note');
  if (!d.everReceived) {
    note.classList.remove('d-none');
    note.innerHTML = `
      <div class="alert alert-info mb-0 small">
        <b><i class="bi bi-info-circle"></i> まだ学習アプリのきろくは届いていません。</b><br>
        きろくは<b>学習ポータル</b>から送られます。児童には
        ${d.portalUrl
          ? `<a href="${esc(d.portalUrl)}" target="_blank" rel="noopener">${esc(d.portalUrl)}</a>`
          : '学習ポータル（manabi-portal）のURL'}
        を配付し、ポータルの「⚙️ せってい」に<b>このWebアプリのURL</b>を入れてください。<br>
        ポータルは画面に出ているまなびクエストごしに送るので、デプロイの
        「アクセスできるユーザー」は<b>組織内</b>のままで大丈夫です
        （組織アカウントで「全員」を選べなくても使えます）。
        ${d.anonymousPost ? '' : '匿名の受信用デプロイ（アクセス: 全員）を併用する場合だけ、「初期設定」シートの <b>学習ログ送信キー</b> を設定してください。'}
      </div>`;
  } else {
    note.classList.add('d-none');
    note.innerHTML = '';
  }

  // サマリカード
  const t = d.totals || {};
  const card = (label, value, cls) => `
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 rounded-4 text-center"><div class="card-body">
        <div class="text-muted small fw-bold">${label}</div>
        <div class="fs-4 fw-bold ${cls}">${value}</div>
      </div></div>
    </div>`;
  // 読書は「記録する操作」の時間しか計測できないため、合計学習時間には入れず
  // 冊数・ページ数で見せます（仕様 §3.8.2）。1冊でも届いていれば専用のカードを出します。
  document.getElementById('tl-stats-cards').innerHTML =
    card('学習の回数', `${t.records ?? 0}<span class="fs-6 text-muted">回</span>`, 'text-primary') +
    card('とりくんだ児童', `${t.students ?? 0}<span class="fs-6 text-muted">人</span>`, 'text-success') +
    card(`合計学習時間${t.books > 0 ? '<span class="fw-normal">（読書のぞく）</span>' : ''}`, fmtStudyMinutes(t.minutes), 'text-info') +
    // 中断は「難しすぎる」「量が多すぎる」のサインですが、Typa のように
    // 区切りを作らないことですきま時間の練習を成立させているアプリでは、
    // 中断が正常な使い方です。数に入れず、下に注記だけ出します（仕様 §5.4）
    card('中断', `${t.aborted ?? 0}<span class="fs-6 text-muted">回</span>`, t.aborted > 0 ? 'text-warning' : 'text-secondary') +
    (t.books > 0
      ? card('読書', `${t.books}<span class="fs-6 text-muted">さつ / ${t.pages}ページ</span>`, 'text-warning-emphasis')
      : '') +
    (t.abortNormal > 0
      ? `<div class="col-12"><div class="alert alert-light border small mb-0 py-2">
           <i class="bi bi-info-circle"></i> Typa（タイピング）の途中でやめた ${t.abortNormal} 回は「中断」に数えていません。
           Typa は<b>区切りを作らないことで、すきま時間の練習を成立させている</b>アプリです。
           打ったぶんがそのまま残る設計なので、途中でやめるのが正常な使い方になります。
           とりくみ量は上の「合計学習時間」と下の「初回正答/解答」で見てください。
         </div></div>`
      : '');

  // 児童別
  document.getElementById('tl-student-rows').innerHTML = (d.students || []).map(s => {
    const rate = s.rate === null
      ? '<span class="text-muted">-</span>'
      : `<b class="${s.rate < 60 ? 'text-danger' : 'text-success'}">${s.rate}%</b> <span class="text-muted" style="font-size:.7rem;">(${s.firstTry}/${s.attempted})</span>`;
    // 読書は学習時間に入らないため、冊数・ページ数を別の列で見せます（仕様 §3.8.2）
    const books = s.books > 0
      ? `${s.books}さつ <span class="text-muted" style="font-size:.7rem;">(${s.pages}p)</span>`
      : '<span class="text-muted">-</span>';
    return `<tr class="${s.records === 0 ? 'text-muted' : ''}">
      <td>${esc(String(s.number))}</td>
      <td class="fw-bold">${esc(s.name)}</td>
      <td>${s.records}回</td>
      <td>${fmtStudyMinutes(s.minutes)}</td>
      <td>${books}</td>
      <td>${rate}</td>
      <td>${s.aborted > 0 ? `${s.aborted}回` : '-'}</td>
      <td class="small text-muted">${esc(s.lastDay || '-')}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8">${emptyMessage('児童マスタが空です')}</td></tr>`;

  // アプリ別
  // 読書アプリ（timed: false）は学習時間を計測していないので、時間のかわりにページ数を出します。
  // 初回正答率も採点をともなわない活動には無いため、冊数を右側に置きます（仕様 §3.8）。
  document.getElementById('tl-app-list').innerHTML = (d.apps || []).map(a => {
    const amount = a.timed === false ? `${a.pages}ページ` : fmtStudyMinutes(a.minutes);
    const right = a.timed === false
      ? `<b>${a.books}さつ</b><div class="text-muted" style="font-size:.7rem;">読んだ冊数</div>`
      : (a.rate === null ? '<span class="text-muted small">-</span>' : `<b>${a.rate}%</b><div class="text-muted" style="font-size:.7rem;">初回正答率</div>`);
    return `
    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
      <div>
        <div class="fw-bold">${esc(a.label)}</div>
        <div class="small text-muted">${a.records}回 / ${a.students}人 / ${amount}</div>
      </div>
      <div class="text-end">${right}</div>
    </div>`;
  }).join('') || emptyMessage('この期間の記録はまだありません');

  // アプリをひらく（児童画面の「がくしゅうアプリ」と同じ一覧。新しいタブでひらきます）
  document.getElementById('tl-app-links').innerHTML = (d.links || []).length === 0
    ? emptyMessage('ひらけるアプリが登録されていません')
    : `<div class="mq-applist compact">${(d.links || []).map(a => `
        <a class="mq-app app-${esc(a.color || 'blue')}" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer"
           title="${esc(a.note || '')}">
          <span class="app-icon">${icon(a.icon || 'gamepad')}</span>
          <span class="app-body"><span class="app-name">${esc(a.name || a.label)}</span></span>
          <span class="app-open">${icon('external')}</span>
        </a>`).join('')}</div>`;

  // つまずき問題
  // 「何人が落としたか」だけでは手が打てないので、どう間違えたか（wrong）と
  // 答えを見せてもらった回数（hint）も並べます（仕様 §2.10）
  document.getElementById('tl-stumbles').innerHTML = (d.stumbles || []).map(sb => {
    const wrong = (sb.wrong || []).length > 0
      ? `<div class="text-muted mt-1">よくある誤答: ${sb.wrong.map(w =>
          `<span class="badge bg-danger-subtle text-danger-emphasis border border-danger">${esc(w.key)}<span class="fw-normal"> ${w.count}</span></span>`).join(' ')}</div>`
      : '';
    const hints = sb.hints > 0
      ? `<div class="text-muted mt-1"><i class="bi bi-lightbulb"></i> ${sb.hints}回は答えやヒントを見て解いています（自力では解けていません）</div>`
      : '';
    return `
    <div class="border-bottom py-2 small">
      <b class="fs-6">${esc(sb.q)}</b>
      <span class="text-muted">｜${esc(sb.unit)}（${esc(sb.app)}）</span>
      <div><span class="badge bg-danger">${sb.students}人</span> がはじめの1回でまちがえました（のべ${sb.misses}回）</div>
      ${wrong}${hints}
    </div>`;
  }).join('') || emptyMessage('つまずきの多い問題はまだ検出されていません');

  renderStudyHints(d.hints || {});

  // 最近の学習
  document.getElementById('tl-recent-rows').innerHTML = (d.recent || []).map(r => `
    <tr>
      <td class="small">${esc(r.day)}</td>
      <td class="small text-muted">${esc(r.slot)}</td>
      <td class="small fw-bold">${esc(String(r.number))} ${esc(r.name)}</td>
      <td class="small">${esc(r.app)}</td>
      <td class="small">${esc(r.unit)}<span class="text-muted">（${esc(r.mode)}）</span></td>
      <td class="small text-center">${r.timed === false
        ? `<span class="text-muted">-</span>`
        : `${r.firstTry}/${r.attempted}<span class="text-muted">（${r.count}問中）</span>`}</td>
      <td class="small">${r.timed === false ? `${r.pages}ページ` : fmtStudyMinutes(r.minutes)}</td>
      <td class="small">${studyFlagBadges(r)}</td>
    </tr>`).join('') || `<tr><td colspan="8">${emptyMessage('この期間の記録はまだありません')}</td></tr>`;
}

/**
 * 「指導のてがかり」を描きます（学習ログの拡張層 ext から）。
 *
 * 回数や正答率だけでは「次に何をすればいいか」までは決まりません。
 * ここに出すのは、仕様が「他アプリにない指導価値がある」と名指しした値だけです。
 * どのカードにも「明日の指導のどこが変わるか」を1文で添えています（仕様 §4.2）。
 * 届いていないてがかりはカードごと出しません（空欄が並ぶと0なのか未受信なのか分からないため）。
 */
function renderStudyHints(h) {
  const box = document.getElementById('tl-hints');
  if (!box) return;
  const cards = [];

  // 漢字の4技能（漢字タウン ext.skills / 仕様 §3.3）
  if (h.kanjiSkills && h.kanjiSkills.skills.length > 0) {
    const k = h.kanjiSkills;
    const bars = k.skills.map(s => `
      <div class="d-flex align-items-center gap-2 mb-1">
        <span class="small text-muted" style="width:5.5em;">${esc(s.label)}</span>
        <div class="progress flex-grow-1" style="height:14px;">
          <div class="progress-bar ${s.score < 60 ? 'bg-danger' : 'bg-primary'}" style="width:${s.score}%"></div>
        </div>
        <b class="small" style="width:3em;text-align:right;">${s.score}%</b>
      </div>`).join('');
    // 「読めるが書けない」は他のアプリからは見えない、漢字タウンだけが持つ次元です
    const gap = (k.high && k.low && k.diff >= 10)
      ? `<div class="alert alert-warning small py-2 mb-0 mt-2">
           <b>「${esc(k.high.label)}」は ${k.high.score}%、「${esc(k.low.label)}」は ${k.low.score}%</b>（差 ${k.diff} ポイント）。
           クラス全体で<b>${esc(k.low.label)}が弱い</b>傾向です。次の漢字の時間は${esc(k.low.label)}に時間を回すと効きます。
         </div>`
      : `<div class="small text-muted mt-2">4つの技能に大きな差はありません（差 ${k.diff} ポイント）。</div>`;
    cards.push(`
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 h-100">
          <div class="card-header bg-transparent fw-bold"><i class="bi bi-pencil"></i> 漢字の4技能（学級の平均）</div>
          <div class="card-body">
            <p class="small text-muted">漢字タウンが計っている「よみ・いみ・かき・ひつじゅん」の習熟度です。児童ごとにいちばん新しい記録の値を平均しました（${k.students}人）。<b>正答率ひとつでは見えない「読めるが書けない」</b>が分かります。</p>
            ${bars}${gap}
          </div>
        </div>
      </div>`);
  }

  // 作戦べつの定着（さんすうブロック ext.strategyStats / 仕様 §3.5）
  if (h.strategies) {
    const rows = h.strategies.map(s => `
      <div class="d-flex justify-content-between align-items-center border-bottom py-2">
        <div>
          <div class="fw-bold small">${esc(s.label)}</div>
          <div class="text-muted" style="font-size:.7rem;">${s.count}問 / ${s.students}人</div>
        </div>
        <div class="text-end">
          <b class="${s.rate !== null && s.rate < 60 ? 'text-danger' : 'text-success'}">${s.rate === null ? '-' : s.rate + '%'}</b>
          <div class="text-muted" style="font-size:.7rem;">初回正答率</div>
        </div>
      </div>`).join('');
    const worst = h.strategies[0];
    cards.push(`
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 h-100">
          <div class="card-header bg-transparent fw-bold"><i class="bi bi-diagram-3"></i> ひき算の作戦べつの定着</div>
          <div class="card-body">
            <p class="small text-muted">さんすうブロックは、繰り下がりのひき算をどの作戦で解いたかを記録しています。<b>同じ「ひき算」でも、減加法は解けるのに減減法でつまずく</b>ことがあり、モード名だけでは見えません。</p>
            ${rows}
            ${worst && worst.rate !== null && worst.rate < 70
              ? `<div class="alert alert-warning small py-2 mb-0 mt-2"><b>${esc(worst.label)}</b>の初回正答率が ${worst.rate}% です。この作戦をもう一度ブロックで確かめる時間をとると効きます。</div>`
              : ''}
          </div>
        </div>
      </div>`);
  }

  // ミスの多い指（Typa ext.missByFinger / 仕様 §3.9）
  if (h.typing) {
    const max = h.typing.fingers[0].count || 1;
    const bars = h.typing.fingers.map(f => `
      <div class="d-flex align-items-center gap-2 mb-1">
        <span class="small text-muted" style="width:7em;">${esc(f.label)}</span>
        <div class="progress flex-grow-1" style="height:14px;">
          <div class="progress-bar bg-warning" style="width:${Math.round(100 * f.count / max)}%"></div>
        </div>
        <b class="small" style="width:3.5em;text-align:right;">${f.count}回</b>
      </div>`).join('');
    const keys = (h.typing.keys || []).map(k =>
      `<span class="badge bg-light text-dark border">${esc(k.key)} <span class="text-muted">${k.count}</span></span>`).join(' ');
    cards.push(`
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 h-100">
          <div class="card-header bg-transparent fw-bold"><i class="bi bi-keyboard"></i> タイピング：ミスの多い指</div>
          <div class="card-body">
            <p class="small text-muted">${h.typing.students}人ぶん・のべ${h.typing.misses}回の打ちまちがいを指べつに数えました。<b>「右こゆびのミスが多い」は、人さし指2本で打っている癖のサイン</b>です。キーべつのミスだけでは見えません。</p>
            ${bars}
            ${keys ? `<div class="small text-muted mt-2">ミスの多いキー: ${keys}</div>` : ''}
          </div>
        </div>
      </div>`);
  }

  // 入力のしかた（100マス計算 ext.input / 仕様 §3.6）
  if (h.inputs) {
    const rows = h.inputs.map(i => `
      <div class="d-flex justify-content-between align-items-center border-bottom py-2">
        <div>
          <div class="fw-bold small">${esc(i.label)}</div>
          <div class="text-muted" style="font-size:.7rem;">${i.records}回 / ${i.students}人</div>
        </div>
        <div class="text-end">
          <b>${i.avgSec === null ? '-' : Math.floor(i.avgSec / 60) + '分' + (i.avgSec % 60) + '秒'}</b>
          <div class="text-muted" style="font-size:.7rem;">100問の平均タイム</div>
        </div>
      </div>`).join('');
    cards.push(`
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 h-100">
          <div class="card-header bg-transparent fw-bold"><i class="bi bi-input-cursor"></i> 100マス計算：入力のしかた</div>
          <div class="card-body">
            <p class="small text-muted">100マス計算は<b>タイムが主な指標</b>ですが、AI手書き・テンキー・キーボードでは同じ実力でもタイムが大きく変わります。<b>入力のしかたがちがう記録どうしのタイムを、そのまま並べて比べないでください。</b></p>
            ${rows}
          </div>
        </div>
      </div>`);
  }

  box.innerHTML = cards.join('');
  box.parentElement.classList.toggle('d-none', cards.length === 0);
}

/** 児童詳細画面に出す「学習アプリのきろく」カード */
function studentStudyLogCard(sl) {
  if (!sl || !sl.summary) return '';
  const s = sl.summary;
  const rate = s.rate === null ? '-' : `${s.rate}%`;
  const apps = Object.keys(sl.apps || {}).map(label =>
    `<span class="badge bg-light text-dark border">${esc(label)}: ${sl.apps[label]}回</span>`).join(' ');
  return `
    <div class="card shadow-sm border-0 rounded-4 mb-3"><div class="card-body">
      <h6 class="fw-bold text-primary">🎮 学習アプリのきろく</h6>
      ${s.records === 0 ? emptyMessage('学習アプリの記録はまだ届いていません') : `
        <div class="d-flex gap-3 small mb-2 flex-wrap">
          <span>回数: <b>${s.records}回</b></span>
          <span>学習時間: <b>${fmtStudyMinutes(s.minutes)}</b></span>
          ${s.books > 0 ? `<span>読書: <b>${s.books}さつ / ${s.pages}ページ</b></span>` : ''}
          <span>初回正答率: <b>${rate}</b>${s.attempted > 0 ? `<span class="text-muted">（${s.firstTry}/${s.attempted}）</span>` : ''}</span>
          ${s.aborted > 0 ? `<span class="text-warning-emphasis">中断: ${s.aborted}回</span>` : ''}
        </div>
        <div class="mb-2">${apps}</div>
        <div class="custom-scrollbar" style="max-height:180px;overflow-y:auto;">
          ${(sl.recent || []).map(r => `
            <div class="border-bottom py-1 small d-flex justify-content-between gap-2">
              <span><span class="text-muted">${esc(r.day)} ${esc(r.slot)}</span> ${esc(r.app)}「${esc(r.unit)}」</span>
              <span class="text-nowrap">${r.firstTry}/${r.attempted} ${studyFlagBadges(r)}</span>
            </div>`).join('')}
        </div>`}
    </div></div>`;
}

function bindStudyLogEvents() {
  document.querySelectorAll('[data-view="view-t-studylog"]').forEach(tab => {
    tab.addEventListener('click', () => loadStudyLog(false));
  });
  document.getElementById('tl-reload-btn').addEventListener('click', () => loadStudyLog(true));
  document.getElementById('tl-period').addEventListener('change', () => loadStudyLog(true));
}

/* ---------------- 成績・評価タブ ---------------- */

let tgLoaded = false;

async function loadTestMatrix(subject) {
  const container = document.getElementById('tg-matrix');
  container.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>`;
  try {
    const result = await api('getTestScoreMatrix', subject || '');
    if (!result.success) { container.innerHTML = `<div class="alert alert-warning">${esc(result.message)}</div>`; return; }
    tgLoaded = true;
    renderTestMatrix(result);
  } catch (e) {
    container.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}

function renderTestMatrix(d) {
  // 教科セレクト（選択状態を保持）
  const select = document.getElementById('tg-subject');
  select.innerHTML = d.subjects.map(s => `<option ${s === d.subject ? 'selected' : ''}>${esc(s)}</option>`).join('');

  const container = document.getElementById('tg-matrix');
  if (d.units.length === 0) {
    container.innerHTML = emptyMessage('テストのふり返りがまだ記録されていません');
    return;
  }
  const cellHtml = c => {
    if (!c) return '<td class="text-center text-muted">-</td>';
    const score = v => v === null ? '-' : v;
    const goal = (c.e1 !== null || c.e2 !== null) ? `<div class="text-muted" style="font-size:.7rem;">(目標 ${score(c.e1)}・${score(c.e2)})</div>` : '';
    const below = (c.s1 !== null && c.e1 !== null && c.s1 < c.e1) || (c.s2 !== null && c.e2 !== null && c.s2 < c.e2);
    return `<td class="text-center ${below ? 'table-warning' : ''}"><b>${score(c.s1)}</b>・<b>${score(c.s2)}</b>${goal}</td>`;
  };
  container.innerHTML = `
    <table class="table table-bordered table-sm align-middle mb-0" style="min-width:${200 + d.units.length * 110}px;">
      <thead class="table-light sticky-top"><tr>
        <th style="min-width:110px;">児童</th>
        ${d.units.map(u => `<th class="text-center small">${esc(u)}<div class="text-muted fw-normal" style="font-size:.7rem;">知識・思考</div></th>`).join('')}
      </tr></thead>
      <tbody>
        ${d.rows.map(r => `<tr><td class="small fw-bold">${esc(String(r.number))} ${esc(r.name)}</td>${r.cells.map(cellHtml).join('')}</tr>`).join('')}
      </tbody>
      <tfoot class="table-light">
        <tr><td class="small fw-bold">クラス平均</td>
        ${d.averages.map(a => `<td class="text-center small fw-bold">${a.s1 ?? '-'}・${a.s2 ?? '-'}</td>`).join('')}</tr>
      </tfoot>
    </table>
    <div class="small text-muted mt-1">黄色のセルは目標点に届かなかったテストです（面談・声かけの目安に）。</div>`;
}

function renderAttitudeSummary(d) {
  const container = document.getElementById('tg-attitude');
  if (d.subjects.length === 0) {
    container.innerHTML = emptyMessage('この学期のスコアデータがまだありません（授業のふり返りが保存されると自動で蓄積されます）');
    return;
  }
  const gradeBadge = g => {
    const cls = { A: 'bg-success', B: 'bg-primary', C: 'bg-secondary' }[g] || 'bg-light text-dark';
    return `<span class="badge ${cls}">${g}</span>`;
  };
  container.innerHTML = `
    <table class="table table-bordered table-sm align-middle mb-0" style="min-width:${200 + d.subjects.length * 100}px;">
      <thead class="table-light sticky-top"><tr>
        <th style="min-width:110px;">児童</th>
        ${d.subjects.map(s => `<th class="text-center small">${esc(s)}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${d.rows.map(r => `<tr>
          <td class="small fw-bold">${esc(String(r.number))} ${esc(r.name)}</td>
          ${d.subjects.map(s => {
            const sc = r.scores[s];
            return sc
              ? `<td class="text-center">${gradeBadge(sc.grade)}<div class="text-muted" style="font-size:.7rem;">平均${sc.avg}（${sc.count}回）</div></td>`
              : '<td class="text-center text-muted">-</td>';
          }).join('')}
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="small text-muted mt-1">A: 平均${d.thresholdA}点以上 ／ B: 平均${d.thresholdB}点以上 ／ C: それ未満（あくまで評価の参考案です）</div>`;
}

function bindGradesEvents() {
  document.querySelectorAll('[data-view="view-t-grades"]').forEach(tab => {
    tab.addEventListener('click', () => { if (!tgLoaded) loadTestMatrix(''); });
  });
  document.getElementById('tg-reload-btn').addEventListener('click', () => loadTestMatrix(document.getElementById('tg-subject').value));
  document.getElementById('tg-subject').addEventListener('change', () => loadTestMatrix(document.getElementById('tg-subject').value));

  document.getElementById('tg-attitude-btn').addEventListener('click', async () => {
    const term = Number(document.getElementById('tg-term').value);
    const container = document.getElementById('tg-attitude');
    container.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-success"></div></div>`;
    try {
      const result = await api('getAttitudeSummary', term);
      if (!result.success) { container.innerHTML = `<div class="alert alert-warning">${esc(result.message)}</div>`; return; }
      renderAttitudeSummary(result);
    } catch (e) {
      container.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
    }
  });

  document.getElementById('tg-attitude-export').addEventListener('click', async () => {
    const term = Number(document.getElementById('tg-term').value);
    const confirm = await Swal.fire({
      title: `${term}学期の評価案をシートへ出力`,
      text: `「人間性評価集計」シートに出力します（既存の内容は上書きされます）。`,
      icon: 'question', showCancelButton: true, confirmButtonText: '出力する', cancelButtonText: 'やめる'
    });
    if (!confirm.isConfirmed) return;
    const result = await apiWithLoading('出力中...', 'exportAttitudeSummary', term);
    if (result.success) Swal.fire('出力完了', esc(result.message), 'success');
    else Swal.fire('エラー', esc(result.message), 'error');
  });
}
</script>
