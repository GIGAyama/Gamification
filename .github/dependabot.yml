# =====================================================================
# dependabot.yml — 依存ライブラリの更新チェック
# =====================================================================
# 見張っているのは次の2つです。
#
#   github-actions … ワークフローで使っているアクション
#   npm            … まなびクエスト本体に同梱しているライブラリ
#                    （bootstrap・bootstrap-icons・sweetalert2・kuroshiro ほか。
#                     版は package.json で固定し、npm run build で
#                     manabi-quest/vendor_*.html に焼きこんでいます）
#
# ⚠️ npm の更新 PR は、そのままでは CI の generated ジョブ（npm run verify）が
#    赤くなります。同梱ファイルを作り直していないためです。
#    取りこむときは、PR のブランチで `npm ci && npm run build` を走らせ、
#    作り直した vendor_*.html もいっしょにコミットしてください。
#
# 更新の通知は月1回にしています。学校で使うアプリは、
# 学期中に何度もバージョンが動くほうが困るためです。
# =====================================================================
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
