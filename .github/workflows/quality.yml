# =====================================================================
# quality.yml — 品質ゲート
# =====================================================================
# push と Pull Request のたびに、次の2つを自動で確かめます。
#
#   npm run check … 品質ゲート（構文・秘密情報・OAuthスコープ・postMessage の宛先ほか）
#   npm test      … 中身のテスト（学習ログの受け取り・課題の提出判定・経験値・分析）
#
# どちらも外部サービスにつながないので、数秒で終わります。
# 赤くなったときは、ログのファイル名と行番号を見て直してください。
#
# ※ このリポジトリは npm パッケージを使わないので npm ci は要りません。
# =====================================================================
name: quality

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 品質ゲート（npm run check）
        run: npm run check

      - name: テスト（npm test）
        run: npm test

  # 生成物が原本と食い違っていないか。
  # ライブラリを自己ホストにしたので、原本（vendor.config.json / src/app.jsx など）を
  # 直したのに npm run build を忘れると、リポジトリの中身だけが古いまま残る。
  # 構文検査もスキル照合も通ってしまい、貼り付けて動かすまで気づけない。
  #
  # ⚠️ 検査はコミットされている中身と比べる。前に build を走らせても結果は変わらない
  #    （作業ツリーと比べていたころは、build を先に置くだけで必ず緑になった）。
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 生成物が原本と一致しているか
        run: npm run verify

  # 正本コピー（standards-map.json に載るファイル）が
  # GIGAyama.github.io/standards/ とずれていないか
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards

  # 取り寄せ先アプリ（RECORD_SOURCES）の本番サイトに受け渡し口が実在するか。
  # これだけは本番への通信を伴うので、check/test とはジョブを分ける。
  # 落ちたら「コードの誤り」ではなく「該当アプリの配備漏れ」なので、
  # そのアプリのリポジトリへ standards/records/ からブリッジを配備して直す。
  bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 受け渡し口の実在点検（npm run check:bridges）
        run: npm run check:bridges
