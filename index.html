<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    このページは外から何ひとつ読み込みません（アイコンも自分の中）。
    そのため default-src を 'self' に絞れます。
    'unsafe-inline' が style と script に残っているのは、
    CSS と受け渡しスクリプトをこのファイルの中に書いているためです。
    防ぎたいのは「外部のスクリプトが差し込まれること」で、それは止まります。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>まなびクエスト</title>
  <meta name="description" content="小学校の学習記録×ゲーミフィケーション「まなびクエスト」の入口ページ">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GIGA school">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="まなびクエスト">
  <meta property="og:description" content="小学校の学習記録×ゲーミフィケーション「まなびクエスト」の入口ページ">
  <meta property="og:url" content="https://gamification.giga-school.com/">
  <meta property="og:image" content="https://giga-school.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
  <meta name="twitter:card" content="summary_large_image">

  <!-- ---- PWA（このページからインストールしても学習ポータルが起動します） ---- -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b7de9">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="まなびクエスト">
  <!--
    GitHub Pages の入口ページ（https://gamification.giga-school.com/）
    =====================================================================
    児童に配るのは学習ポータル（manabi-portal/）のURLです。
    このページは、ルートURLを開いてしまったときの案内と、
    設定パラメータ（?app=…&endpoint=…&key=…）付きで開かれたときの
    ポータルへの受け渡しを担当します。
  -->
  <style>
    /* 画面幅にあわせて文字の大きさを変えます（Part I §2-4）。
       メディアクエリを何段も書かずに、375px のスマホから
       1920px の教員用PCまで同じ読みやすさにするためです。 */
    :root {
      --fs-body:  clamp(15px, 1.6vw + 10px, 18px);
      --fs-lead:  clamp(15px, 1.4vw + 11px, 18px);
      --fs-title: clamp(22px, 2.8vw + 14px, 32px);
      --fs-go:    clamp(17px, 1.8vw + 12px, 21px);
      --fs-note:  clamp(13px, 1vw + 9px, 15px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px))
               calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
      font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDGothic", sans-serif;
      background: linear-gradient(160deg, #eaf4ff, #fdf1e7);
      color: #33404d;
      font-size: var(--fs-body);
      line-height: 1.8;   /* 児童も読むページなので行間を広くとる */
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(60, 90, 130, .14);
      text-align: center;
    }
    .card > img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 12px 0 4px; font-size: var(--fs-title); line-height: 1.5; }
    /* #6a7a8a は白地で 4.41:1 と、わずかに基準（4.5:1）に足りなかった → 5.70:1 */
    .lead { margin: 0 0 24px; color: #5c6874; font-size: var(--fs-lead); }
    .go {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;          /* 低学年の指で確実に押せる下限（Part I §2-9） */
      padding: 16px;
      border-radius: 16px;
      background: #2b7de9;
      color: #fff;
      font-size: var(--fs-go);
      font-weight: bold;
      text-decoration: none;
      touch-action: manipulation;  /* ダブルタップ判定の 300ms 待ちを消す */
    }
    .go:hover { background: #1c5fb8; }
    .note {
      margin: 24px 0 0;
      padding-top: 20px;
      border-top: 1px solid #eef2f6;
      font-size: var(--fs-note);
      line-height: 1.7;
      color: #626f7c;   /* #8a99a8 は白地で 2.92:1 しかなく読めなかった → 5.14:1 */
      text-align: left;
    }
    .note a { color: #5c6874; }
    code { background: #f4f7fa; border-radius: 4px; padding: 1px 5px; font-size: .95em; }
    :focus-visible { outline: 3px solid #1c5fb8; outline-offset: 2px; }

    /* 動きが苦手な子のために、端末の設定にしたがって演出を止める（Part I §2-10） */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #121a24, #1c1a22); color: #e8eef5; }
      .card { background: #1a2431; box-shadow: 0 12px 32px rgba(0, 0, 0, .4); }
      .lead, .note { color: #93a2b3; }
      .note { border-top-color: #2a3745; }
      code { background: #22303f; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 読み込み前でもレイアウトがガタつかないよう width/height を書きます（CLS 対策） -->
    <img src="./icons/icon-192.png" width="72" height="72" alt="" decoding="async">
    <h1>まなびクエスト</h1>
    <p class="lead">学習ポータルへ すすんでください</p>
    <a class="go" id="go" href="./manabi-portal/">ポータルを ひらく</a>
    <p class="note">
      児童に配付するURLは <code>./manabi-portal/</code> です。
      設定パラメータ（<code>?app=…&amp;endpoint=…&amp;key=…</code>）を付けてこのページを開いた場合は、
      自動でポータルへ引き継ぎます。
      スマートフォンやタブレットでは、ポータルを開いてから
      <b>「ホーム画面に追加」／「アプリをインストール」</b>すると、アプリとして使えます。
      セットアップ手順は <a href="https://github.com/GIGAyama/Gamification">リポジトリの README</a> を参照してください。
    </p>
  </div>

  <script>
    // 設定パラメータ付きで開かれたときは、そのままポータルへ引き継ぐ
    // （先生が配付URLのパスを付け忘れても設定が保存されるように）
    (() => {
      const query = window.location.search;
      const target = './manabi-portal/' + query;
      document.getElementById('go').href = target;
      if (query.length > 1) window.location.replace(target);
    })();
  </script>
</body>
</html>
